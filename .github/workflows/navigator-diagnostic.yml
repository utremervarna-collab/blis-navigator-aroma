name: Navigator Full Diagnostic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Go application
        run: |
          set -euxo pipefail
          BLIS_AUTH_PROXY_DISABLED=1 go test ./...
          go build -tags netgo -ldflags '-s -w' -o app .

      - name: Validate canonical static architecture
        run: |
          set -euxo pipefail
          test -s static/dashboard.html
          test -s static/navigator-runtime-core-v1.js
          test -s static/navigator-reference.js
          test -s static/navigator-curves.js
          test -s static/navigator-overview-master.js
          test -s static/navigator-live-master.js
          test -s static/navigator-digital-master.js
          test -s static/navigator-reputation-master.js
          test -s static/navigator-perception-map.js
          test -s static/navigator-competition-master-v5.js
          test -s static/navigator-client-value-pages-v1.js
          test -s static/navigator-production-cleanup-v1.js
          test -s static/navigator-commerce-safe-v3.js
          grep -q 'navigator-runtime-core-v1.js' static/dashboard.html
          grep -q 'navigator-production-cleanup-v1.js' static/dashboard.html
          grep -q 'navigator-commerce-safe-v3.js' static/dashboard.html
          ! grep -q 'src="/navigator-runtime-bridge.js' static/dashboard.html
          ! grep -q 'src="/navigator-chart-points.js' static/dashboard.html
          ! grep -q 'navigator-architecture-v15.js' static/navigator-runtime-core-v1.js
          ! grep -q 'setInterval' static/navigator-runtime-core-v1.js
          ! grep -q 'setInterval' static/navigator-production-cleanup-v1.js
          ! grep -q 'MutationObserver' static/navigator-production-cleanup-v1.js
          ! grep -q 'window.setInterval=' static/navigator-stability-preload-v1.js
          ! grep -q 'window.setTimeout=' static/navigator-stability-preload-v1.js
          node --check static/navigator-runtime-core-v1.js
          node --check static/navigator-reference.js
          node --check static/navigator-architecture-v15.js
          node --check static/navigator-module-lock-v1.js
          node --check static/navigator-curves.js
          node --check static/navigator-production-cleanup-v1.js
          node --check static/navigator-commerce-safe-v3.js

      - name: Start application and validate APIs
        run: |
          set -euxo pipefail
          BLIS_AUTH_PROXY_DISABLED=1 PORT=10000 ./app > /tmp/blis-diagnostic.log 2>&1 &
          echo $! > /tmp/blis.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10000/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/api/health | tee /tmp/health.json
          curl -fsS http://127.0.0.1:10000/api/clients | tee /tmp/clients.json
          for c in aroma bolyarka astor-garden mollox; do
            curl -fsS "http://127.0.0.1:10000/api/clients/$c/dashboard" >/tmp/$c-dashboard.json
            curl -fsS "http://127.0.0.1:10000/api/clients/$c/sources" >/tmp/$c-sources.json
            curl -fsS "http://127.0.0.1:10000/api/clients/$c/data-quality" >/tmp/$c-quality.json
            curl -fsS "http://127.0.0.1:10000/api/clients/$c/activity" >/tmp/$c-activity.json
            curl -fsS "http://127.0.0.1:10000/api/clients/$c/history" >/tmp/$c-history.json
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/$c-dashboard.json'));if(!Number.isFinite(Number(d.blis_index)))process.exit(1);if(!Array.isArray(d.indices)||!d.indices.length)process.exit(1)"
            node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('/tmp/$c-sources.json'));if(!Array.isArray(s)||!s.length)process.exit(1)"
            node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/$c-history.json'));if(!Array.isArray(h)||!h.length)process.exit(1)"
          done
          curl -fsS 'http://127.0.0.1:10000/dashboard.html?client=varna-towers' >/tmp/varna-towers.html
          grep -q 'varna-towers-runtime.js' /tmp/varna-towers.html
          grep -q 'navigator-runtime-core-v1.js' /tmp/varna-towers.html
          grep -q 'navigator-commerce-safe-v3.js' /tmp/varna-towers.html

      - name: Show diagnostic log on failure
        if: failure()
        run: cat /tmp/blis-diagnostic.log || true
