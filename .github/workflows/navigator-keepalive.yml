name: Navigator 24-7 Availability Probe

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigator-availability-probe
  cancel-in-progress: true

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN }}

jobs:
  availability:
    if: ${{ vars.NAVIGATOR_ORIGIN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify Navigator health and KUB signals
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"

          request() {
            local url="$1"
            local out="$2"
            curl -L --fail --silent --show-error \
              --connect-timeout 20 --max-time 90 \
              --retry 4 --retry-delay 4 --retry-all-errors \
              -H 'Accept: application/json' \
              "$url" -o "$out"
          }

          request "$BASE/api/health?probe=1&ts=$(date +%s)" /tmp/app-health.json
          echo 'Navigator health response:'
          cat /tmp/app-health.json
          grep -q '"ok"' /tmp/app-health.json

          request "$BASE/api/signals/health?client=kub&probe=1&ts=$(date +%s)" /tmp/kub-health.json
          echo 'KUB signal health response:'
          cat /tmp/kub-health.json

          request "$BASE/api/signals?client=kub&limit=3&probe=1&ts=$(date +%s)" /tmp/signals.json
          echo 'KUB signal response:'
          cat /tmp/signals.json
          grep -q '"signals"' /tmp/signals.json

      - name: Explain disabled probe
        if: ${{ vars.NAVIGATOR_ORIGIN == '' }}
        run: echo 'Set repository variable NAVIGATOR_ORIGIN to the active production origin to enable this probe.'
