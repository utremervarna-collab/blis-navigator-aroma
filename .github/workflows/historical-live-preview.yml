name: Historical Live Preview
on:
  push:
    branches: [preview-live-20260817-2205]
  pull_request:
    branches: [main]
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ec1b8a62f5ddbcb1c197cb99fbe294531885d79
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Start Navigator
        run: |
          PORT=8080 go run . > /tmp/blis.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/dashboard.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/blis.log
          exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture historical Live Monitoring
        run: |
          cat > shot.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100},deviceScaleFactor:1});
            await page.addInitScript(()=>{
              window.MutationObserver=class{constructor(cb){this.cb=cb}observe(){}disconnect(){}takeRecords(){return[]}};
            });
            await page.goto('http://127.0.0.1:8080/dashboard.html',{waitUntil:'networkidle'});
            await page.waitForTimeout(2200);
            await page.evaluate(()=>{
              document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
              document.getElementById('live')?.classList.add('active');
              document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='live'));
            });
            await page.addScriptTag({url:'http://127.0.0.1:8080/navigator-geo-v2.js?v=historical-shot'}).catch(()=>{});
            await page.waitForTimeout(1800);
            console.log(await page.evaluate(()=>({
              active:document.querySelector('.page.active')?.id,
              activity:!!document.querySelector('.lm-live-card'),
              activityLen:document.querySelector('.lm-live-card')?.outerHTML.length||0,
              geo:!!document.querySelector('.lm-geo-card'),
              geoV2:!!document.querySelector('.lm-bgmap-stage'),
              clock:document.getElementById('lmLiveClock')?.textContent||null
            })));
            await page.screenshot({path:'historical-live-2205.png',fullPage:true});
            await browser.close();
          })();
          EOF
          node shot.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: historical-live-2205
          path: historical-live-2205.png
