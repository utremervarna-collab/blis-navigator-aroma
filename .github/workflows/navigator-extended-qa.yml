name: Navigator Extended QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start Navigator through production gateway
        run: |
          set -euxo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app >/tmp/blis-extended.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:10000/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/api/health

      - name: Verify public read-only gateway and protected mutation contracts
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:10000/client-login)
          test "$code" = "200"
          grep -Eqi 'BLIS|client|клиент' /tmp/login.html
          code=$(curl -sS -D /tmp/dashboard.headers -o /tmp/dashboard.body -w '%{http_code}' 'http://127.0.0.1:10000/dashboard.html?client=aroma&page=overview')
          test "$code" = "200"
          ! grep -qi 'client-login' /tmp/dashboard.body
          code=$(curl -sS -o /tmp/aroma.json -w '%{http_code}' 'http://127.0.0.1:10000/api/clients/aroma/dashboard')
          test "$code" = "200"
          code=$(curl -sS -D /tmp/kub.headers -o /tmp/kub.body -w '%{http_code}' 'http://127.0.0.1:10000/dashboard.html?client=kub&page=overview')
          test "$code" = "302"
          grep -Eqi '^location: /kub-crisis\.html' /tmp/kub.headers
          code=$(curl -sS -o /tmp/admin.body -w '%{http_code}' http://127.0.0.1:10000/admin.html)
          test "$code" = "404"
          code=$(curl -sS -o /tmp/refresh.body -w '%{http_code}' -X POST http://127.0.0.1:10000/api/clients/wirello/refresh)
          test "$code" = "409"
          echo PUBLIC_READ_ONLY_GATEWAY_OK

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run current desktop and mobile browser QA
        run: |
          cat >/tmp/extended.cjs <<'NODE'
          const {chromium}=require(process.env.GITHUB_WORKSPACE+'/node_modules/playwright');
          const fs=require('fs');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          // Renderer QA deliberately uses the application behind the gateway.
          // The external public read-only contract is validated separately above.
          const origin='http://127.0.0.1:10001';
          const clients=['aroma','bolyarka','mollox','varna-towers','everbet','astor-garden'];
          const pages=['overview','social','market','digital','reputation','competition','history','reports'];
          const expected={aroma:'Aroma',bolyarka:'Болярка',mollox:'MOLLOX','varna-towers':'Varna Towers',everbet:'Everbet','astor-garden':'Astor Garden'};
          const visible=['kub','mollox','aroma','bolyarka','wirello'];
          let phase='startup';
          const watchdog=setTimeout(()=>{const msg=`watchdog timeout at ${phase}`;try{fs.writeFileSync('/tmp/extended-error.txt',msg)}catch(_){};console.error(msg);process.exit(2)},150000);

          async function ready(p,client){
            phase=`ready:${client}:goto`;
            await p.goto(`${origin}/dashboard.html?client=${client}&page=overview`,{waitUntil:'domcontentloaded',timeout:25000});
            phase=`ready:${client}:runtime`;
            await p.waitForFunction(()=>typeof window.refGo==='function'&&!!window.BLISClientUIV5&&Array.isArray(window.BLIS_VISIBLE_CLIENTS),null,{timeout:25000});
            await p.waitForFunction(()=>document.querySelectorAll('#nav button[data-page]').length>=8,null,{timeout:15000});
            await p.waitForFunction(()=>document.querySelector('.page.active')?.innerText.trim().length>20,null,{timeout:18000});
            await p.waitForFunction(()=>document.body.dataset.blisLoading!=='true',null,{timeout:15000});
            const state=await p.evaluate(()=>({
              id:document.body.dataset.client||'',
              name:document.querySelector('.bch3-name')?.textContent||document.querySelector('.client-brand-name')?.textContent||'',
              nav:[...document.querySelectorAll('#nav button[data-page]')].map(x=>x.dataset.page),
              visible:[...(window.BLIS_VISIBLE_CLIENTS||[])],
              menu:[...document.querySelectorAll('.client-switch-menu .client-option[data-client-key]')].map(x=>x.dataset.clientKey),
              lang:document.documentElement.lang,
              language:window.BLIS_LANGUAGE,
              services:!!document.querySelector('[data-blis-commerce-open]')
            }));
            assert(state.id===client,`${client}: wrong body client ${state.id}`);
            assert(state.name.includes(expected[client]),`${client}: wrong identity ${state.name}`);
            assert(new Set(state.nav).size===state.nav.length,`${client}: duplicate routes ${state.nav}`);
            for(const id of pages)assert(state.nav.includes(id),`${client}: missing route ${id}; nav=${state.nav}`);
            assert(state.visible.join(',')===visible.join(','),`${client}: visible registry ${state.visible}`);
            assert(state.menu.join(',')===visible.join(','),`${client}: hidden client leaked into menu ${state.menu}`);
            assert(state.lang==='bg'&&state.language==='bg',`${client}: Bulgarian default missing`);
            assert(!state.services,`${client}: Services launcher leaked into Navigator`);
            return state;
          }

          async function inspect(p,id){
            return p.evaluate(id=>{
              const root=document.getElementById(id),r=root?.getBoundingClientRect(),cs=root?getComputedStyle(root):null;
              const text=(root?.innerText||'').trim();
              return {id:document.querySelector('.page.active')?.id,text:text.length,height:r?.height||0,visible:!!root&&cs.display!=='none'&&cs.visibility!=='hidden'&&Number(cs.opacity||1)>.01,overflow:Math.max(0,document.documentElement.scrollWidth-window.innerWidth),loading:/\bLoading\b|Зареждане\.{2,}/i.test(text)};
            },id);
          }

          async function verifyPages(p,client){
            for(const page of pages){
              phase=`${client}:${page}`;
              await p.evaluate(x=>window.refGo(x),page);
              await p.waitForFunction(x=>document.querySelector('.page.active')?.id===x,page,{timeout:10000});
              await p.waitForTimeout(250);
              const x=await inspect(p,page);
              assert(x.visible&&x.height>70&&x.text>20,`${client}/${page}: blank or collapsed ${JSON.stringify(x)}`);
              assert(!x.loading,`${client}/${page}: loading remained`);
              assert(x.overflow<=12,`${client}/${page}: horizontal overflow ${x.overflow}`);
            }
          }

          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              phase='desktop:aroma';
              const p=await browser.newPage({viewport:{width:1440,height:1000}});
              const errs=[];
              p.on('pageerror',e=>errs.push('PAGEERROR '+e.message));
              p.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource|ERR_NAME_NOT_RESOLVED|net::ERR_/i.test(m.text()))errs.push('CONSOLE '+m.text())});
              await ready(p,'aroma');
              await verifyPages(p,'aroma-desktop');

              phase='desktop:switch-bolyarka';
              await p.evaluate(()=>window.refGo('overview'));
              const btn=p.locator('.client-switch-button');
              assert(await btn.count()>0,'client switch button missing');
              await btn.click();
              await p.waitForFunction(()=>document.querySelector('.client-switch')?.classList.contains('open'),null,{timeout:4000});
              const option=p.locator('.client-option[data-client-key="bolyarka"]');
              assert(await option.count()===1,'Bolyarka visible option missing or duplicated');
              await option.click();
              await p.waitForFunction(()=>document.body.dataset.client==='bolyarka'&&document.body.dataset.blisLoading!=='true'&&(document.querySelector('.bch3-name')?.textContent||document.querySelector('.client-brand-name')?.textContent||'').includes('Болярка'),null,{timeout:15000});
              const switched=await ready(p,'bolyarka');
              assert(switched.menu.join(',')===visible.join(','),'client switch changed visible registry');
              assert(errs.length===0,`desktop runtime errors ${errs.join(' | ')}`);
              await p.close();

              for(const client of clients){
                phase=`mobile:${client}:open`;
                const m=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
                const mobileErrs=[];
                m.on('pageerror',e=>mobileErrs.push('PAGEERROR '+e.message));
                m.on('console',x=>{if(x.type()==='error'&&!/favicon|Failed to load resource|ERR_NAME_NOT_RESOLVED|net::ERR_/i.test(x.text()))mobileErrs.push('CONSOLE '+x.text())});
                await ready(m,client);
                await verifyPages(m,`${client}-mobile`);
                assert(mobileErrs.length===0,`${client}/mobile runtime errors ${mobileErrs.join(' | ')}`);
                await m.close();
              }

              phase='done';
              clearTimeout(watchdog);
              console.log('NAVIGATOR_EXTENDED_CURRENT_QA_OK');
            } finally {await browser.close();}
          })().catch(e=>{try{fs.writeFileSync('/tmp/extended-error.txt',`${phase}: ${String(e.message||e)}`)}catch(_){};console.error(phase,e);process.exit(1)});
          NODE
          node /tmp/extended.cjs

      - name: Show server log on failure
        if: failure()
        run: |
          cat /tmp/extended-error.txt || true
          cat /tmp/blis-extended.log || true

      - name: Publish QA status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');const ok='${{ job.status }}'==='success';let detail='';try{detail=fs.readFileSync('/tmp/extended-error.txt','utf8').replace(/[^a-zA-Z0-9_:\/.-]+/g,' ').slice(0,95)}catch(_){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:ok?'success':'failure',context:'navigator-extended-qa',description:ok?'public read-only gateway + desktop/mobile QA passed':'Extended Navigator QA failed'});
            if(!ok&&detail)await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'failure',context:`nav-ext:${detail}`,description:'First extended QA failure'});
