name: Verify Varna Towers Real Final
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Build candidate contact sheet
        shell: bash
        run: |
          cat > compare.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Arial;margin:20px;background:#eee}.row{margin:0 0 24px;background:#fff;padding:12px}.label{font-size:22px;font-weight:bold;margin-bottom:8px}.hero{width:1456px;height:167px;object-fit:cover;object-position:center center;display:block;border:2px solid #111}</style></head><body>
          <div class="row"><div class="label">A — current v2 jpg</div><img class="hero" src="static/varna-towers-profile-hero-header-v2.jpg"></div>
          <div class="row"><div class="label">B — older header webp</div><img class="hero" src="static/varna-towers-profile-hero-header.webp"></div>
          <div class="row"><div class="label">C — older profile jpg</div><img class="hero" src="static/varna-towers-profile-hero.jpg"></div>
          <div class="row"><div class="label">D — final svg</div><img class="hero" src="static/varna-towers-profile-hero-final.svg"></div>
          </body></html>
          HTML
          cat > compare.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          const path=require('path');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--allow-file-access-from-files']});const p=await b.newPage({viewport:{width:1540,height:1000}});await p.goto('file://'+path.resolve('compare.html'));await p.waitForTimeout(1000);await p.screenshot({path:'varna-towers-candidates.png',fullPage:true});await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node compare.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: varna-towers-candidates
          path: varna-towers-candidates.png
