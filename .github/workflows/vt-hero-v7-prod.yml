name: Varna Towers Hero V7
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify production hero
        run: |
          cat > check.cjs <<'NODE'
          const { chromium }=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            let last='';
            for(let i=1;i<=24;i++){
              const page=await browser.newPage({viewport:{width:1680,height:720},deviceScaleFactor:1});
              try{
                await page.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=varna-towers',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2400);
                const state=await page.evaluate(()=>{
                  const el=document.querySelector('.topbar .client-photo-bg');
                  const html=document.documentElement.innerHTML;
                  if(!el)return {exists:false,hasVt7:html.includes('20260818-vt7')};
                  const cs=getComputedStyle(el),r=el.getBoundingClientRect();
                  return {exists:true,client:document.body.dataset.client,bg:cs.backgroundImage.slice(0,120),size:cs.backgroundSize,pos:cs.backgroundPosition,opacity:cs.opacity,w:r.width,h:r.height,ready:el.dataset.varnaTowersHero||'',hasVt7:html.includes('20260818-vt7')};
                });
                console.log('ATTEMPT',i,JSON.stringify(state));
                await page.screenshot({path:'varna-towers-hero-v7.png',fullPage:false});
                const ok=state.exists&&state.client==='varna-towers'&&state.hasVt7&&state.bg.includes('data:image/jpeg;base64')&&state.opacity==='1'&&state.w>1200&&state.h>150&&state.ready==='ready';
                if(!ok)throw new Error('V7 hero not active yet');
                await page.close();await browser.close();return;
              }catch(e){last=e.message;console.log('RETRY',i,last);await page.close();if(i<24)await new Promise(r=>setTimeout(r,10000));}
            }
            await browser.close();throw new Error(last||'verify failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: varna-towers-hero-v7
          path: varna-towers-hero-v7.png
