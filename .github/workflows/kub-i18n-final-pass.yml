          old="const mo=new MutationObserver(schedule);mo.observe(document.documentElement,{subtree:true,childList:true});\nsetInterval(patch,1200);"
          new="let finalTicks=0;const finalTimer=setInterval(()=>{finalTicks++;if(document.getElementById('attackmap'))patch();if(finalTicks>=12)clearInterval(finalTimer)},250);"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Add a final, text-only residual sanitizer to the last-loaded i18n runtime.
          q=Path('static/kub-i18n-full-v1.js')
          z=q.read_text(encoding='utf-8')
          marker='/* KUB_FINAL_RESIDUAL_SANITIZER_V2 */'
