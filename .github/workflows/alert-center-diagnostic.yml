name: Alert Center Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  production-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify production warning workflow
        run: |
          cat > alert-check.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          const target='https://blis-navigator-aroma.onrender.com/dashboard.html?client=aroma';
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            let last='';
            for(let attempt=1;attempt<=10;attempt++){
              const page=await browser.newPage({viewport:{width:1440,height:1000}});
              const errs=[];page.on('pageerror',e=>errs.push(e.message));
              try{
                await page.goto(target,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(3200);
                await page.locator('#nav button[data-page="live"]').first().click({force:true});
                await page.waitForTimeout(1600);
                const base=await page.evaluate(()=>({activity:!!document.querySelector('.lm-live-card .lm-live-stage'),geo:!!document.querySelector('.lm-geo-card .lm-map-real'),warningCard:!!document.querySelector('#live .lm-kpi[data-lm-kpi="warnings"]'),count:document.querySelector('#live .lm-kpi[data-lm-kpi="warnings"] strong')?.textContent.trim(),statuses:[...document.querySelectorAll('.lm-tablewrap .lm-status')].map(x=>x.textContent.trim())}));
                console.log('BASE',JSON.stringify(base));
                if(!base.activity||!base.geo||!base.warningCard)throw new Error('Live warning integration not deployed yet');
                if(base.statuses.some(x=>x!=='● Активен'))throw new Error('Source status regression');
                await page.locator('#live .lm-kpi[data-lm-kpi="warnings"]').click();await page.waitForTimeout(180);
                const detail=await page.evaluate(()=>({head:document.querySelector('#lmKpiDetail .lm-kpi-detail-head')?.textContent.trim(),rows:[...document.querySelectorAll('#lmKpiDetail .lm-alert-item')].map(x=>({priority:x.querySelector('.lm-alert-priority')?.textContent.trim(),title:x.querySelector('.lm-alert-copy b')?.textContent.trim(),action:x.querySelector('.lm-alert-action')?.textContent.trim()})),empty:document.querySelector('#lmKpiDetail .lm-kpi-detail-text')?.textContent.trim()||''}));
                console.log('DETAIL',JSON.stringify(detail));
                if(!detail.head?.includes('Активни предупреждения'))throw new Error('Actionable warning detail missing');
                if(detail.rows.length){
                  if(detail.rows.some(x=>!x.priority||!x.title||!x.action))throw new Error('Warning row lacks priority/title/action');
                  const beforeRoute=await page.evaluate(()=>document.querySelector('.page.active')?.id);
                  await page.locator('#lmKpiDetail .lm-alert-action').first().click();await page.waitForTimeout(700);
                  const routed=await page.evaluate(()=>({active:document.querySelector('.page.active')?.id,focus:document.querySelector('.page.active .blis-alert-focus')?.textContent.trim(),alertRoute:window.BLIS_ACTIVE_ALERT?.route,alertTitle:window.BLIS_ACTIVE_ALERT?.title}));
                  console.log('ROUTED',JSON.stringify(routed));
                  if(routed.active===beforeRoute||routed.active==='live')throw new Error('Warning action did not leave Live Monitoring');
                  if(routed.active!==routed.alertRoute)throw new Error('Warning action routed to wrong module');
                  if(!routed.focus||!routed.alertTitle)throw new Error('Warning context missing in target module');
                }
                if(errs.length)throw new Error('JS errors: '+errs.join(' | '));
                await page.close();await browser.close();return;
              }catch(e){last=e.message;console.log('RETRY',attempt,last);await page.close();if(attempt<10)await new Promise(r=>setTimeout(r,5000));}
            }
            await browser.close();throw new Error(last||'production warning check failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node alert-check.cjs
