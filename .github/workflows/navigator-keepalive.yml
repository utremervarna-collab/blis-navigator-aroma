name: Navigator 24-7 Availability Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/navigator-keepalive.yml'
      - 'migration_health.go'
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigator-availability-probe
  cancel-in-progress: true

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  MIGRATION_BUILD: code-run-migration-2026-09-09-v1

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify exact production migration and Navigator health
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          test -n "$BASE"
          echo "Probing production origin: $BASE"

          request() {
            local url="$1"
            local out="$2"
            curl --fail --silent --show-error \
              --connect-timeout 20 --max-time 90 \
              --retry 4 --retry-delay 4 --retry-all-errors \
              -H 'Accept: application/json' \
              "$url" -o "$out"
          }

          request "$BASE/api/migration-health?probe=1&ts=$(date +%s)" /tmp/migration-health.json
          cat /tmp/migration-health.json
          grep -q "$MIGRATION_BUILD" /tmp/migration-health.json
          grep -q '"storage_writable":true' /tmp/migration-health.json
          grep -q '"store_present":true' /tmp/migration-health.json

          request "$BASE/api/health?probe=1&ts=$(date +%s)" /tmp/app-health.json
          cat /tmp/app-health.json
          grep -q '"ok":true' /tmp/app-health.json

          request "$BASE/api/signals/health?client=kub&probe=1&ts=$(date +%s)" /tmp/kub-health.json
          cat /tmp/kub-health.json

          request "$BASE/api/signals?client=kub&limit=3&probe=1&ts=$(date +%s)" /tmp/signals.json
          cat /tmp/signals.json
          grep -q '"signals"' /tmp/signals.json

          echo 'NAVIGATOR_24_7_PRODUCTION_OK'
