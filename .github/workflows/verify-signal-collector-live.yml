name: Verify Signal Collector Live
on:
  push:
    branches:
      - milestone/navigator-production-stable-20260825
    paths:
      - .github/workflows/verify-signal-collector-live.yml
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Health before refresh
        run: |
          set -euo pipefail
          BASE='https://blis-navigator-milestone-20260825.onrender.com'
          curl --fail --show-error --silent --retry 4 --retry-delay 8 --retry-all-errors --max-time 120 "$BASE/api/signals/health" -o /tmp/health-before.json
          cat /tmp/health-before.json
      - name: Run live collection
        run: |
          set -euo pipefail
          BASE='https://blis-navigator-milestone-20260825.onrender.com'
          curl --fail --show-error --silent --retry 3 --retry-delay 10 --retry-all-errors --max-time 420 -X POST "$BASE/api/signals/refresh" -o /tmp/refresh.json
          cat /tmp/refresh.json
      - name: Validate existing clients only
        run: |
          set -euo pipefail
          BASE='https://blis-navigator-milestone-20260825.onrender.com'
          for C in aroma bolyarka mollox; do
            curl --fail --show-error --silent --max-time 120 "$BASE/api/signals?client=$C&scope=external&limit=20" -o "/tmp/$C.json"
            python3 - "$C" <<'PY'
          import json,sys
          client=sys.argv[1]
          d=json.load(open('/tmp/'+client+'.json',encoding='utf-8'))
          assert d.get('client')==client, d
          assert isinstance(d.get('signals'),list), d
          for s in d['signals']:
              assert s.get('client')==client
              assert s.get('scope')=='external'
              assert s.get('fingerprint')
              assert s.get('source_type') in ('news','social','web')
              assert 0 <= float(s.get('risk_score',0)) <= 100
          print(client,'external_signals=',len(d['signals']),'updated_at=',d.get('updated_at'))
          PY
          done
      - name: Confirm Everbet absent
        run: |
          BASE='https://blis-navigator-milestone-20260825.onrender.com'
          curl --fail --show-error --silent --max-time 120 "$BASE/api/signals?client=everbet&limit=5" -o /tmp/everbet.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/everbet.json',encoding='utf-8'))
          assert d.get('signals') == [], d
          print('everbet absent from collector')
          PY
