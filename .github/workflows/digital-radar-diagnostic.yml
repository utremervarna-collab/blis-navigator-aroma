name: Digital Radar Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build and start
        run: |
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:10000/api/health && break || sleep 1; done
          node --check static/navigator-digital-master.js
      - name: Browser test
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          cat > .diag-digital.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            const p=await b.newPage({viewport:{width:1600,height:1100}});
            const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.goto('http://127.0.0.1:10000/dashboard.html?client=aroma&page=digital',{waitUntil:'domcontentloaded'});
            await p.waitForTimeout(3000);
            const before=await p.evaluate(()=>({
              active:document.querySelector('.page.active')?.id,
              search:!!document.getElementById('dvSearchInput'),
              radar:!!document.getElementById('dvRadar'),
              sectors:document.querySelectorAll('#digitalBody .dv-radar-sector').length,
              kpis:document.querySelectorAll('#digitalBody .dv-kpi').length,
              detail:document.querySelector('#dvDetail h3')?.textContent?.trim(),
              css:[...document.styleSheets].some(s=>String(s.href||'').includes('navigator-digital-master.css?v=20260819-radar1')),
              js:[...document.scripts].some(s=>String(s.src||'').includes('navigator-digital-master.js?v=20260819-radar1')),
              sources:document.querySelectorAll('#dvSourceCards .dv-source-card').length
            }));
            console.log('BEFORE',before,'ERRORS',errors);
            if(errors.length||before.active!=='digital'||!before.search||!before.radar||before.sectors!==5||before.kpis!==4||!before.detail||!before.css||!before.js)throw new Error('Digital radar base render failed');
            await p.locator('#digitalBody .dv-radar-sector.external').click();
            await p.waitForTimeout(150);
            const ext=await p.locator('#dvDetail h3').textContent();
            console.log('EXTERNAL_DETAIL',ext);
            if(!/Външна видимост/.test(ext||''))throw new Error('External sector interaction failed');
            await p.locator('#digitalBody .dv-kpi.search').click();
            await p.waitForTimeout(250);
            const search=await p.locator('#dvDetail h3').textContent();
            if(!/Търсене/.test(search||''))throw new Error('Search KPI interaction failed');
            await p.locator('#dvSearchButton').click();
            const scanning=await p.locator('#dvRadar').evaluate(el=>el.classList.contains('is-scanning'));
            if(!scanning)throw new Error('Radar scan interaction failed');
            await p.screenshot({path:'digital-radar.png',fullPage:true});
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node .diag-digital.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-radar-screenshot
          path: digital-radar.png
