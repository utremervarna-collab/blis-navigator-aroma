name: Fix Signal Collector Compile
on:
  push:
    branches:
      - milestone/navigator-production-stable-20260825
    paths:
      - .github/workflows/fix-signal-collector-compile.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix helper collision and validate
        run: |
          sed -i 's/containsAny(/collectorContainsAny(/g' signal_collector.go
          gofmt -w signal_collector.go
          go test ./...
      - name: Commit fix
        run: |
          git config user.name 'BLIS Navigator Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add signal_collector.go
          git commit -m 'Fix Signal Collector helper collision'
          git push origin HEAD:milestone/navigator-production-stable-20260825
