name: Verify Varna Towers Real Final
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify exact production JPEG and screenshot
        shell: bash
        run: |
          cat > verify.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          const EXPECT='db2cfbcdd0709062829bcaf6dd79423f0585acba7a0b3a61bb76486c15d8a7f5';
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            let last='';
            for(let i=1;i<=30;i++){
              const page=await browser.newPage({viewport:{width:1680,height:720},deviceScaleFactor:1});
              try{
                await page.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=varna-towers&verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(1800);
                const state=await page.evaluate(async(expected)=>{
                  const top=document.querySelector('.topbar');
                  const cs=top?getComputedStyle(top):null;
                  const r=await fetch('/varna-towers-profile-hero-header-v2.jpg?v=20260818-real-final&verify='+Date.now(),{cache:'no-store'});
                  const b=await r.arrayBuffer();
                  const digest=await crypto.subtle.digest('SHA-256',b);
                  const hash=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');
                  const html=await (await fetch('/dashboard.html?verify='+Date.now(),{cache:'no-store'})).text();
                  return {client:document.body.dataset.client,bg:cs?.backgroundImage||'',size:cs?.backgroundSize||'',w:top?.getBoundingClientRect().width||0,h:top?.getBoundingClientRect().height||0,status:r.status,type:r.headers.get('content-type')||'',bytes:b.byteLength,hash,cssKey:html.includes('navigator-real-ui.css?v=20260818-vtreal-final'),expected};
                },EXPECT);
                console.log('ATTEMPT',i,JSON.stringify(state));
                const ok=state.client==='varna-towers'&&state.bg.includes('varna-towers-profile-hero-header-v2.jpg?v=20260818-real-final')&&state.size.includes('cover')&&state.h>=160&&state.status===200&&state.type.includes('image/jpeg')&&state.bytes===39362&&state.hash===EXPECT&&state.cssKey;
                if(!ok)throw new Error('real hero not live yet');
                await page.locator('.topbar').screenshot({path:'varna-towers-real-final.png'});
                await page.close();await browser.close();return;
              }catch(e){last=e.message;console.log('RETRY',i,last);await page.close();if(i<30)await new Promise(r=>setTimeout(r,10000));}
            }
            await browser.close();throw new Error(last||'verification failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: varna-towers-real-final
          path: varna-towers-real-final.png
