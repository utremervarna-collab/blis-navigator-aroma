name: Navigator Editorial Home QA

on:
  push:
    branches: [main]
    paths:
      - 'static/index.html'
      - 'static/navigator-decision-intelligence-v1.js'
      - 'static/navigator-decision-intelligence-v1.css'
      - 'static/migration-build.js'
      - '.github/workflows/home-intelligence-search-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-visual-architecture-qa
  cancel-in-progress: true

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  RELEASE_MARKER: navigator-editorial-flow-2026-09-27-v1

jobs:
  visual-home:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build current Navigator
        run: go build -tags netgo -ldflags '-s -w' -o app .

      - name: Validate complete editorial home
        run: |
          set -euo pipefail
          grep -Fq 'ed-hero-collage' static/index.html
          grep -Fq 'ed-journey-progress' static/index.html
          grep -Fq 'data-step="5"' static/index.html
          grep -Fq 'Наблюдение' static/index.html
          grep -Fq 'ed-sector-btn' static/index.html
          grep -Fq 'Интелиджънс Хъб' static/index.html
          grep -Fq 'editorial-flow-v6' static/index.html
          grep -Fq '/demo.html' static/index.html
          grep -Fq '/navigator' static/index.html
          grep -Fq '/intelligence-hub.html' static/index.html
          ! grep -Fq 'BLIS™ Quick Search' static/index.html
          ! grep -Fq 'intelSearchForm' static/index.html
          echo EDITORIAL_HOME_SOURCE_OK

      - name: Wait for and verify canonical production
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          ok=0
          for i in $(seq 1 48); do
            if curl -fsS --connect-timeout 12 --max-time 25 "$BASE/migration-build.js?ts=$(date +%s%N)" -o /tmp/build.js && grep -Fq "$RELEASE_MARKER" /tmp/build.js; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = "1"

          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 12 --max-time 30 "$BASE/?visualqa=$(date +%s%N)" -o /tmp/home.html
          grep -Fq 'ed-hero-collage' /tmp/home.html
          grep -Fq 'ed-journey-progress' /tmp/home.html
          grep -Fq 'data-step="5"' /tmp/home.html
          grep -Fq 'Интелиджънс Хъб' /tmp/home.html
          grep -Fq 'editorial-flow-v6' /tmp/home.html
          ! grep -Fq 'BLIS™ Quick Search' /tmp/home.html
          curl -fsS "$BASE/brandlab-office-hero.webp?ts=$(date +%s%N)" -o /tmp/hero.webp
          test -s /tmp/hero.webp
          echo EDITORIAL_HOME_PRODUCTION_OK
