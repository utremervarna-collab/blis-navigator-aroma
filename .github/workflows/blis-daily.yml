name: BLIS Daily Engine

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wake Render and run BLIS Engine
        run: |
          set -e
          curl --fail --retry 8 --retry-delay 12 --max-time 240 \
            -X POST "https://blis-navigator-aroma.onrender.com/api/clients/aroma/refresh" \
            -o /tmp/blis-refresh.json
          cat /tmp/blis-refresh.json | python -m json.tool | head -120

      - name: Export persistent BLIS store
        run: |
          mkdir -p data
          curl --fail --retry 5 --retry-delay 8 --max-time 120 \
            "https://blis-navigator-aroma.onrender.com/api/store/export" \
            -o data/live_store.json
          python - <<'PY'
          import json
          p='data/live_store.json'
          d=json.load(open(p,encoding='utf-8'))
          assert 'aroma' in d.get('clients',{}), 'Aroma missing from exported store'
          print('snapshots:',len(d['clients']['aroma'].get('snapshots',[])))
          print('observations:',len(d['clients']['aroma'].get('observations',[])))
          PY

      - name: Commit daily data snapshot
        run: |
          git config user.name "BLIS Engine"
          git config user.email "actions@users.noreply.github.com"
          git add data/live_store.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "BLIS daily data $(date -u +%F)"
            git push
          fi
