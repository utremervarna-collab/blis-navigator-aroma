name: Navigator Mention Production QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}

jobs:
  live-mention-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for live three-month mention UI build
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          ok=0
          for i in $(seq 1 36); do
            if curl -fsS --connect-timeout 15 --max-time 30 "$BASE/navigator-live-refresh-v1.js?ts=$(date +%s%N)" -o /tmp/live-refresh.js; then
              bytes=$(wc -c </tmp/live-refresh.js | tr -d ' ')
              marker_v6=$(grep -Fc '__BLIS_LIVE_REFRESH_V6' /tmp/live-refresh.js || true)
              lookback=$(grep -Fc 'LOOKBACK_MONTHS=3' /tmp/live-refresh.js || true)
              timeline=$(grep -Fc 'Хронология на споменаванията' /tmp/live-refresh.js || true)
              comp_timeline=$(grep -Fc 'Хронология на конкурентните споменавания' /tmp/live-refresh.js || true)
              ticker=$(grep -Fc 'blis-ms-ticker' /tmp/live-refresh.js || true)
              api=$(grep -Fc '/api/public/mentions' /tmp/live-refresh.js || true)
              echo "MENTION_UI_PROBE attempt=$i bytes=$bytes v6=$marker_v6 lookback3m=$lookback timeline=$timeline competitor_timeline=$comp_timeline ticker=$ticker api=$api"
              if test "$marker_v6" -gt 0 && test "$lookback" -gt 0 && test "$timeline" -gt 0 && test "$comp_timeline" -gt 0 && test "$ticker" -gt 0 && test "$api" -gt 0; then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          if test "$ok" != "1"; then
            echo 'LIVE_THREE_MONTH_MENTION_UI_NOT_READY'
            head -c 1000 /tmp/live-refresh.js || true
            exit 1
          fi
          echo LIVE_THREE_MONTH_MENTION_UI_OK

          # Varna Towers must be on the live backend runtime, not the old static
          # fetch-intercept bootstrap.
          varna_ok=0
          for i in $(seq 1 36); do
            if curl -fsS --connect-timeout 15 --max-time 30 "$BASE/varna-towers-runtime.js?ts=$(date +%s%N)" -o /tmp/varna-runtime.js && grep -Fq '__varnaLiveFetch' /tmp/varna-runtime.js; then
              varna_ok=1
              break
            fi
            sleep 10
          done
          test "$varna_ok" = "1"
          echo VARNA_TOWERS_LIVE_RUNTIME_OK

      - name: Validate Aroma Bolyarka and MOLLOX production streams
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          for CLIENT in aroma bolyarka mollox varna-towers; do
            curl -fsS "$BASE/api/public/mentions?client=$CLIENT&scope=brand&limit=300&ts=$(date +%s%N)" -o "/tmp/${CLIENT}-brand.json"
            curl -fsS "$BASE/api/public/mentions?client=$CLIENT&scope=competitor&limit=300&ts=$(date +%s%N)" -o "/tmp/${CLIENT}-competitor.json"
          done

          # MOLLOX has source-verified publications in the rolling 3-month
          # window. A 0/0 stream is therefore a pipeline failure, not a valid
          # empty result. Give the post-restore backfill a short bounded window.
          mollox_ok=0
          for i in $(seq 1 18); do
            curl -fsS "$BASE/api/public/mentions?client=mollox&scope=brand&limit=300&ts=$(date +%s%N)" -o /tmp/mollox-brand.json
            curl -fsS "$BASE/api/public/mentions?client=mollox&scope=competitor&limit=300&ts=$(date +%s%N)" -o /tmp/mollox-competitor.json
            if python - <<'PY'
          import json
          brand=json.load(open('/tmp/mollox-brand.json',encoding='utf-8')).get('signals') or []
          competitor=json.load(open('/tmp/mollox-competitor.json',encoding='utf-8')).get('signals') or []
          raise SystemExit(0 if len(brand)>=4 and len(competitor)>=1 else 1)
          PY
            then
              mollox_ok=1
              break
            fi
            sleep 5
          done
          test "$mollox_ok" = "1"
          echo MOLLOX_VERIFIED_RECENT_MINIMUM_OK
          curl -fsS "$BASE/api/store/export?ts=$(date +%s%N)" -o /tmp/mentions-store.json
          python - <<'PY'
          import json, re
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          clients=('aroma','bolyarka','mollox','varna-towers')
          store=json.load(open('/tmp/mentions-store.json',encoding='utf-8')).get('clients',{})

          def norm(v):
              return re.sub(r'\s+',' ',str(v or '')).strip().casefold()

          def configured_competitors(slug):
              out=set()
              for src in store.get(slug,{}).get('sources',[]):
                  key=norm(src.get('key'))
                  special_varna=slug=='varna-towers' and key in ('bpv','varna115','landmark','chayka')
                  if key.startswith('cmp_') or key.startswith('competitor_') or special_varna:
                      label=str(src.get('label') or '').strip()
                      if label:
                          out.add(norm(label))
              return out

          def source_inventory(slug):
              return [
                  {'key':str(x.get('key') or ''),'label':str(x.get('label') or ''),'url':str(x.get('url') or '')}
                  for x in store.get(slug,{}).get('sources',[])
              ]

          def parse_date(v):
              raw=str(v or '').strip()
              if not raw:
                  return None
              try:
                  return datetime.fromisoformat(raw.replace('Z','+00:00')).astimezone(timezone.utc)
              except Exception:
                  pass
              for fmt in ('%a, %d %b %Y %H:%M:%S %Z','%a, %d %b %Y %H:%M:%S %z'):
                  try:
                      return datetime.strptime(raw,fmt).astimezone(timezone.utc)
                  except Exception:
                      pass
              return None

          now=datetime.now(timezone.utc)
          # Diagnostics use 93 days as a conservative upper bound for three calendar months.
          recent_floor=now.timestamp()-93*86400
          summary={}
          for slug in clients:
              allowed=configured_competitors(slug)
              summary[slug]={
                  'configured_competitors':sorted(allowed),
                  'source_inventory':source_inventory(slug),
              }
              if slug=='varna-towers':
                  src_keys={norm(x.get('key')) for x in store.get(slug,{}).get('sources',[])}
                  required={'official_site','building','tenants','news','linkedin','google_business','google_news','bpv','varna115','landmark','chayka'}
                  assert required.issubset(src_keys), ('varna-towers','missing live sources',sorted(required-src_keys))
                  observations=store.get(slug,{}).get('observations',[])
                  assert any(norm(x.get('source_key'))=='ownership_2026' and norm(x.get('metric_key'))=='reported_owner_change' for x in observations), ('varna-towers','verified 2026 ownership event missing from durable store')
              for scope in ('brand','competitor'):
                  data=json.loads(Path(f'/tmp/{slug}-{scope}.json').read_text(encoding='utf-8'))
                  assert data.get('client')==slug, (slug,scope,'wrong response client',data.get('client'))
                  rows=data.get('signals') or []
                  assert isinstance(rows,list), (slug,scope,'signals is not a list')
                  seen=set()
                  for row in rows:
                      assert norm(row.get('client'))==slug, (slug,scope,'cross-client leak',row)
                      rs=norm(row.get('scope'))
                      fp=norm(row.get('fingerprint') or row.get('url'))
                      assert fp not in seen, (slug,scope,'duplicate signal',row)
                      seen.add(fp)
                      if scope=='competitor':
                          assert rs=='competitor', (slug,scope,'wrong scope',row)
                          b=norm(row.get('brand'))
                          assert b, (slug,scope,'competitor brand missing',row)
                          if allowed:
                              assert b in allowed, (slug,scope,'unconfigured competitor brand',row.get('brand'),sorted(allowed))
                      else:
                          assert rs in ('external','owned'), (slug,scope,'wrong brand scope',row)
                      assert re.match(r'^https?://',str(row.get('url') or ''),re.I), (slug,scope,'bad URL',row)
                      assert str(row.get('source') or '').strip(), (slug,scope,'source missing',row)
                      assert str(row.get('title') or '').strip(), (slug,scope,'title missing',row)

                  if scope=='brand' and slug=='bolyarka':
                      for row in rows:
                          hay=norm((row.get('title') or '')+' '+(row.get('text') or ''))
                          assert 'мебелна къща' not in hay, ('bolyarka','false positive: furniture house',row)
                          assert 'дгс „болярка“' not in hay and 'дгс “болярка”' not in hay and 'дгс болярка' not in hay, ('bolyarka','false positive: state forestry',row)

                  if scope=='competitor' and slug=='bolyarka':
                      company_evidence=(
                          'пивоварна загорка','пивоварната загорка','загорка ад','загорка а.д.',
                          'бира загорка','бирата загорка','загорка beer','загорка пивовар',
                          'организиран от загорка','организира от загорка','организирано от загорка',
                          'организатор загорка','съорганизатор загорка','съорганизира загорка',
                          'партньор загорка','с подкрепата на загорка','zagorka brewery','zagorka company'
                      )
                      for row in rows:
                          if norm(row.get('brand'))!='загорка':
                              continue
                          hay=norm((row.get('title') or '')+' '+(row.get('text') or ''))
                          if 'парк загорка' in hay:
                              contextual=('загорка' in hay and 'организ' in hay and any(x in hay for x in ('бира','beer','пивовар')))
                              assert any(x in hay for x in company_evidence) or contextual, ('bolyarka','false positive: park Zagorka',row)

                  recent=[]
                  for row in rows:
                      d=parse_date(row.get('published_at') or row.get('observed_at') or row.get('date'))
                      if d and d.timestamp() >= recent_floor:
                          recent.append(row)
                  brands=Counter(str(x.get('brand') or '') for x in recent) if scope=='competitor' else Counter()
                  summary[slug][scope]={
                      'count':len(rows),
                      'recent_3m_date_verified_count':len(recent),
                      'recent_3m_brands':dict(brands),
                      'updated_at':data.get('updated_at') or '',
                      'recent_samples':[{'brand':str(x.get('brand') or ''),'published_at':str(x.get('published_at') or ''),'title':str(x.get('title') or '')[:160]} for x in recent[:12]],
                      'sample_titles':[str(x.get('title') or '')[:160] for x in rows[:8]],
                      'sample_sources':[str(x.get('source') or '') for x in rows[:8]],
                  }

          print('LIVE_MENTION_STREAM_QA_OK')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
