name: Retrigger BLIS Signal Collector v1
on:
  push:
    branches:
      - milestone/navigator-production-stable-20260825
    paths:
      - .github/workflows/install-signal-collector-v1-retrigger.yml
permissions:
  contents: write
jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-run installer payload
        run: |
          python3 - <<'PY'
          import yaml, pathlib
          p=pathlib.Path('.github/workflows/install-signal-collector-v1.yml')
          d=yaml.safe_load(p.read_text())
          script=d['jobs']['install']['steps'][1]['run']
          pathlib.Path('/tmp/install.sh').write_text(script)
          PY
          bash /tmp/install.sh
      - name: Commit collector
        run: |
          git config user.name 'BLIS Navigator Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add signal_collector.go
          git commit -m 'Add BLIS Signal Collector with 10 minute discovery' || exit 0
          git push origin HEAD:milestone/navigator-production-stable-20260825
