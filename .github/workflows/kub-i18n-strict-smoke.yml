name: KUB EN RU Strict Browser Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kub-i18n-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify complete EN and RU KUB UI on production
        shell: bash
        run: |
          cat > /tmp/kub-i18n-strict.cjs <<'NODE'
          const { chromium } = require(process.env.GITHUB_WORKSPACE + '/node_modules/playwright');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const bgMarkers=[
            'Къде е текущият','Радарът','Как да се чете','Какво е ново','Показват се','Защо е важно','Следят се',
            'ПОСЛЕДНИ ПОТВЪРДЕНИ','ИЗТОЧНИК ↗','Корпорация КУБ търси','Конкуриращи се наративи',
            'Карта на натиска','Картата показва','СХОДЯЩ СЕ НАТИСК','Мрежа: произход','Натисни върху възел',
            'Доказателствена граница','Основен политически','ОСНОВЕН МОТИВ','ОСНОВНИ НАРАТИВИ','Следващи тригери',
            'Кризисен риск-регистър','Информационна нужда','Какво следим:','Заповеди за премахване','Хронология на кризата',
            'Нов съдебен етап','Кризисен ситуационен обзор','Какво реално се е променило','Кои теми нарастват',
            'Актуален статус по обект','Източници и канали','Покритие: новини','Текущ цикъл на наблюдение',
            'Какво се класифицира','Граница на покритието','Оперативен принцип','Развитие / Доклади','Настройки на наблюдението'
          ];
          const navExpected={
            en:{overview:'Overview',monitoring:'Monitoring',environment:'Environment / Narratives',attackmap:'Pressure map',reputation:'Reputation',risks:'Risks',stakeholders:'Stakeholders',evidence:'Evidence',timeline:'Timeline',reports:'Development / Reports',sources:'Sources',settings:'Monitoring settings'},
            ru:{overview:'Общий обзор',monitoring:'Мониторинг',environment:'Среда / Нарративы',attackmap:'Карта давления',reputation:'Репутация',risks:'Риски',stakeholders:'Заинтересованные стороны',evidence:'Доказательства',timeline:'Хронология',reports:'Развитие / Отчёты',sources:'Источники',settings:'Настройки мониторинга'}
          };
          function residue(text){return bgMarkers.filter(x=>text.includes(x));}
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const lang of ['en','ru']){
                let p,last='';
                for(let attempt=1;attempt<=30;attempt++){
                  p=await browser.newPage({viewport:{width:390,height:844}});
                  try{
                    await p.goto(`https://blis-navigator-aroma.onrender.com/kub-client?lang=${lang}&strict=${Date.now()}&attempt=${attempt}`,{waitUntil:'domcontentloaded',timeout:30000});
                    await p.waitForTimeout(2200);
                    const ready=await p.evaluate(()=>({i18n:window.__KUB_FULL_I18N||'',title:document.title,body:document.body?.innerText||''}));
                    if(ready.i18n===lang && /КУБ|KUB/.test(ready.body) && !/MOLLOX/i.test(ready.body))break;
                    last=JSON.stringify(ready);await p.close();p=null;await sleep(5000);
                  }catch(e){last=e.message;await p.close();p=null;await sleep(5000)}
                }
                assert(p,`production never reached full i18n runtime for ${lang}: ${last}`);
                const nav=await p.$$eval('#nav button[data-page]',els=>Object.fromEntries(els.map(e=>[e.dataset.page,(e.innerText||'').trim()])));
                console.log('NAV',lang,JSON.stringify(nav));
                for(const [k,v] of Object.entries(navExpected[lang]))assert(nav[k]===v,`${lang} nav ${k} expected ${v} got ${nav[k]}`);
                const expectedTitle=lang==='en'?'KUB Corporation · Crisis Monitoring':'Корпорация КУБ · Кризисный мониторинг';
                assert(documentTitle=await p.title(),`${lang} title missing`);assert(documentTitle.includes(expectedTitle),`${lang} title wrong: ${documentTitle}`);
                const pages=Object.keys(navExpected[lang]);
                for(const page of pages){
                  await p.click(`#nav button[data-page="${page}"]`);await p.waitForTimeout(650);
                  const text=await p.$eval(`#${page}.active`,el=>(el.innerText||'').replace(/\s+/g,' ').trim());
                  const bad=residue(text);
                  if(bad.length)console.log(`RESIDUE ${lang} ${page}`,JSON.stringify(bad),text.slice(0,3500));
                  assert(!bad.length,`${lang} ${page} Bulgarian residue: ${bad.join(' | ')}`);
                }
                await p.click('#nav button[data-page="attackmap"]');await p.waitForTimeout(500);
                const nodes=await p.$$('#attackmap .kubam-node');assert(nodes.length===7,`${lang} expected 7 nodes got ${nodes.length}`);
                for(let i=0;i<nodes.length;i++){
                  await p.locator('#attackmap .kubam-node').nth(i).click({force:true});await p.waitForTimeout(350);
                  const detail=await p.$eval('#kubamDetail',el=>(el.innerText||'').replace(/\s+/g,' ').trim());
                  const bad=residue(detail);
                  if(bad.length)console.log(`RESIDUE ${lang} actor ${i}`,JSON.stringify(bad),detail);
                  assert(!bad.length,`${lang} attack actor ${i} Bulgarian residue: ${bad.join(' | ')}`);
                  const aria=await p.locator('#attackmap .kubam-node').nth(i).getAttribute('aria-label');
                  if(lang==='en')assert(/click for details/i.test(aria||''),`EN actor ${i} aria not localized: ${aria}`);
                  if(lang==='ru')assert(/нажмите для подробностей/i.test(aria||''),`RU actor ${i} aria not localized: ${aria}`);
                }
                const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
                assert(overflow<=24,`${lang} mobile overflow ${overflow}`);
                console.log(`KUB_I18N_STRICT_OK ${lang}`,JSON.stringify({pages:pages.length,nodes:nodes.length,overflow,title:await p.title()}));
                await p.close();
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/kub-i18n-strict.cjs
