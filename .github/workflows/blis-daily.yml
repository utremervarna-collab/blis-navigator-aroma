name: BLIS Daily Persistence Snapshot

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blis-daily-persistence
  cancel-in-progress: true

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  MIGRATION_BUILD: code-run-migration-2026-09-09-v1

jobs:
  snapshot-production-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Export healthy production store without mutating web runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"

          curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 90 \
            --retry 8 --retry-delay 8 --retry-all-errors \
            "$BASE/migration-build.js?daily-persistence=1&ts=$(date +%s)" \
            -o /tmp/migration-build.js
          grep -q "$MIGRATION_BUILD" /tmp/migration-build.js

          curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 120 \
            --retry 8 --retry-delay 8 --retry-all-errors \
            "$BASE/api/store/export?daily-persistence=1&ts=$(date +%s)" \
            -o /tmp/live_store.json

          python - <<'PY'
          import json
          d=json.load(open('/tmp/live_store.json',encoding='utf-8'))
          clients=d.get('clients',{})
          for slug in ('aroma','bolyarka','astor-garden','mollox','kub'):
              assert slug in clients, f'{slug} missing from production store'
          print('DAILY_PRODUCTION_STORE_OK', {
              k:(len(v.get('snapshots') or []),len(v.get('observations') or []))
              for k,v in clients.items()
          })
          PY

      - uses: actions/checkout@v4
        with:
          ref: runtime-data
          fetch-depth: 1

      - name: Merge durable KUB history and publish runtime-data snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          if [ -f data/live_store.json ]; then
            cp data/live_store.json /tmp/runtime-data-before.json
          fi
          cp /tmp/live_store.json data/live_store.json

          python - <<'PY'
          import json, os

          path='data/live_store.json'
          candidate=json.load(open(path,encoding='utf-8'))
          clients=candidate.get('clients',{})

          for slug in ('aroma','bolyarka','astor-garden','mollox','kub'):
              if slug not in clients:
                  raise SystemExit(f'daily snapshot refused: {slug} missing')

          def is_kub_signal(o):
              return o.get('source_key') == 'signal_collector' and str(o.get('metric_key','')).startswith('signal_event_')

          prev_path='/tmp/runtime-data-before.json'
          if os.path.exists(prev_path):
              previous=json.load(open(prev_path,encoding='utf-8'))
              pc=previous.get('clients',{})

              for slug in ('aroma','bolyarka','astor-garden','mollox'):
                  if slug in pc:
                      old=len(pc[slug].get('snapshots') or [])
                      new=len(clients[slug].get('snapshots') or [])
                      if new < old:
                          raise SystemExit(f'daily snapshot regression refused: {slug} snapshots {old}->{new}')

              prev_kub=pc.get('kub',{})
              cand_kub=clients['kub']
              cand_obs=cand_kub.get('observations')
              if cand_obs is None:
                  cand_obs=[]
                  cand_kub['observations']=cand_obs
              if not isinstance(cand_obs,list):
                  raise SystemExit('daily snapshot refused: kub observations must be a list')
              keys={o.get('metric_key') for o in cand_obs if is_kub_signal(o)}
              restored=0
              for o in (prev_kub.get('observations') or []):
                  if not is_kub_signal(o):
                      continue
                  key=o.get('metric_key')
                  if key and key not in keys:
                      cand_obs.append(o)
                      keys.add(key)
                      restored += 1
              print('KUB_RUNTIME_HISTORY_PRESERVED', restored)

          # A cold-start snapshot must never overwrite richer durable client history.
          if os.path.exists('/tmp/runtime-data-before.json'):
              previous_all=json.load(open('/tmp/runtime-data-before.json',encoding='utf-8')).get('clients',{})
              current_all=candidate.get('clients',{})
              for slug, old_client in previous_all.items():
                  if slug not in current_all:
                      raise SystemExit(f'snapshot refused: durable client {slug} missing')
                  for field in ('snapshots','observations'):
                      old_rows=old_client.get(field)
                      new_rows=current_all[slug].get(field)
                      if old_rows is None:
                          old_rows=[]
                      if new_rows is None:
                          if old_rows:
                              raise SystemExit(f'daily snapshot refused: {slug} {field} null while durable history exists')
                          new_rows=[]
                      if not isinstance(old_rows,list) or not isinstance(new_rows,list):
                          raise SystemExit(f'daily snapshot refused: {slug} {field} must be an array or null')
                      old_count=len(old_rows)
                      new_count=len(new_rows)
                      if new_count < old_count:
                          raise SystemExit(f'snapshot regression refused: {slug} {field} {old_count}->{new_count}')

          with open(path,'w',encoding='utf-8') as f:
              json.dump(candidate,f,ensure_ascii=False,separators=(',',':'))
          print('DAILY_RUNTIME_DATA_READY')
          PY

          git config user.name 'BLIS Daily Persistence'
          git config user.email 'actions@users.noreply.github.com'
          git add data/live_store.json
          if git diff --cached --quiet; then
            echo 'RUNTIME_DATA_UNCHANGED'
          else
            git commit -m "runtime: daily production snapshot $(date -u +%F)"
            git push origin HEAD:runtime-data
          fi
