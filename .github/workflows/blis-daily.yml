name: BLIS Daily Engine v2 Multi-client

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  MIGRATION_BUILD: code-run-migration-2026-09-09-v1

jobs:
  refresh-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Verify active code.run production before refresh
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          test -n "$BASE"
          curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 90 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$BASE/api/migration-health?daily=1&ts=$(date +%s)" \
            -o /tmp/migration-health.json
          cat /tmp/migration-health.json
          grep -q "$MIGRATION_BUILD" /tmp/migration-health.json
          grep -q '"storage_writable":true' /tmp/migration-health.json
          grep -q '"store_present":true' /tmp/migration-health.json

      - name: Refresh all persistent client profiles on active production
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          for CLIENT in aroma bolyarka astor-garden mollox; do
            echo "Refreshing $CLIENT"
            curl --fail --retry 5 --retry-delay 10 --retry-all-errors --max-time 240 \
              -X POST "$BASE/api/clients/$CLIENT/refresh" \
              -o "/tmp/blis-$CLIENT.json"
            python - <<PY
          import json
          p='/tmp/blis-$CLIENT.json'
          d=json.load(open(p,encoding='utf-8'))
          e=d.get('engine',{})
          print('$CLIENT', 'successful=',e.get('successful'), 'failed=',e.get('failed'), 'version=',e.get('version'))
          PY
          done

      - name: Export persistent BLIS store
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          mkdir -p data
          curl --fail --retry 5 --retry-delay 8 --retry-all-errors --max-time 120 \
            "$BASE/api/store/export" \
            -o data/live_store.json
          python - <<'PY'
          import json
          p='data/live_store.json'
          d=json.load(open(p,encoding='utf-8'))
          clients=d.get('clients',{})
          for slug in ('aroma','bolyarka','astor-garden','mollox'):
              assert slug in clients, f'{slug} missing from exported store'
              print(slug, 'snapshots=',len(clients[slug].get('snapshots',[])), 'observations=',len(clients[slug].get('observations',[])))
          PY

      - name: Commit daily data snapshot
        run: |
          git config user.name "BLIS Engine"
          git config user.email "actions@users.noreply.github.com"
          git add data/live_store.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "BLIS daily multi-client data $(date -u +%F)"
            git push
          fi
