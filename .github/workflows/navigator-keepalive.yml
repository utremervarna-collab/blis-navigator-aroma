name: Navigator 24-7 Availability Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/navigator-keepalive.yml'
      - 'static/migration-build.js'
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigator-availability-probe
  cancel-in-progress: true

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  MIGRATION_BUILD: code-run-migration-2026-09-09-v1

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact production migration and Navigator health
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          test -n "$BASE"
          echo "Probing production origin: $BASE"

          request() {
            local url="$1"
            local out="$2"
            curl --fail --silent --show-error \
              --connect-timeout 20 --max-time 45 \
              --retry 4 --retry-delay 4 --retry-all-errors \
              "$url" -o "$out"
          }

          # Public entry points must render actual HTML, not only API health.
          request "$BASE/?probe=1&ts=$(date +%s)" /tmp/home.html
          test -s /tmp/home.html
          grep -Eqi 'BLIS Navigator|Brand Lab Intelligence System' /tmp/home.html

          request "$BASE/client-login?probe=1&ts=$(date +%s)" /tmp/client-login.html
          test -s /tmp/client-login.html
          grep -Eqi 'BLIS|client|клиент' /tmp/client-login.html

          request "$BASE/migration-build.js?probe=1&ts=$(date +%s)" /tmp/migration-build.js
          grep -q "$MIGRATION_BUILD" /tmp/migration-build.js

          request "$BASE/api/health?probe=1&ts=$(date +%s)" /tmp/app-health.json
          grep -q '"ok":true' /tmp/app-health.json

          # Availability monitoring must never download/encode the full multi-MB
          # store. Use the lightweight production metadata route instead.
          request "$BASE/api/store/meta?probe=1&ts=$(date +%s)" /tmp/store-meta.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/store-meta.json',encoding='utf-8'))
          assert d.get('ok') is True
          for slug in ('aroma','bolyarka','mollox','astor-garden','kub'):
              assert slug in d.get('clients',{}), f'{slug} missing from production store metadata'
          PY

          # KUB's crisis surface is reachable, but signal data is intentionally protected.
          request "$BASE/kub-home.html?probe=1&ts=$(date +%s)" /tmp/kub-home.html
          grep -q 'Корпорация КУБ' /tmp/kub-home.html

          code=$(curl -sS -o /tmp/kub-health.json -w '%{http_code}' \
            --connect-timeout 20 --max-time 45 \
            "$BASE/api/signals/health?client=kub&probe=1&ts=$(date +%s)")
          test "$code" = "401" -o "$code" = "403"

          code=$(curl -sS -o /tmp/signals.json -w '%{http_code}' \
            --connect-timeout 20 --max-time 45 \
            "$BASE/api/signals?client=kub&limit=3&probe=1&ts=$(date +%s)")
          test "$code" = "401" -o "$code" = "403"

          # Sustained-health soak. Do not retry these requests: a single 503 is a
          # real availability failure and must not be hidden by curl retries.
          for i in $(seq 1 8); do
            TS=$(date +%s%N)
            echo "SOAK_SAMPLE=$i timestamp=$TS"

            curl --fail --silent --show-error --connect-timeout 10 --max-time 25 \
              "$BASE/api/health?soak=$i&ts=$TS" -o "/tmp/soak-health-$i.json"
            grep -q '"ok":true' "/tmp/soak-health-$i.json"

            curl --fail --silent --show-error --connect-timeout 10 --max-time 25 \
              "$BASE/?soak=$i&ts=$TS" -o "/tmp/soak-home-$i.html"
            grep -Eqi 'BLIS Navigator|Brand Lab Intelligence System' "/tmp/soak-home-$i.html"

            curl --fail --silent --show-error --connect-timeout 10 --max-time 25 \
              "$BASE/dashboard.html?client=aroma&page=overview&soak=$i&ts=$TS" -o "/tmp/soak-aroma-$i.html"
            grep -Fq 'blisDashboardPrepaintV5' "/tmp/soak-aroma-$i.html"

            curl --fail --silent --show-error --connect-timeout 10 --max-time 25 \
              "$BASE/kub-home.html?soak=$i&ts=$TS" -o "/tmp/soak-kub-$i.html"
            grep -q 'Корпорация КУБ' "/tmp/soak-kub-$i.html"

            if [ "$i" -lt 8 ]; then sleep 15; fi
          done

          echo 'NAVIGATOR_24_7_PRODUCTION_OK'
