name: Navigator Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  MIGRATION_BUILD: code-run-migration-2026-09-09-v1

jobs:
  local-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and start Navigator gateway
        run: |
          set -euxo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app > /tmp/blis-smoke-server.log 2>&1 &
          echo $! > /tmp/blis-smoke.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10000/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/api/health
          curl -fsS http://127.0.0.1:10000/migration-build.js | tee /tmp/migration-build.js
          grep -q "$MIGRATION_BUILD" /tmp/migration-build.js

      - name: Verify gateway access contracts
        run: |
          set -euo pipefail

          code=$(curl -sS -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:10000/client-login)
          test "$code" = "200"
          grep -Eqi 'BLIS|client|клиент' /tmp/login.html

          code=$(curl -sS -D /tmp/dashboard.headers -o /tmp/dashboard.body -w '%{http_code}' 'http://127.0.0.1:10000/dashboard.html?client=aroma&page=overview')
          test "$code" = "302"
          grep -Eqi '^location: /client-login' /tmp/dashboard.headers

          code=$(curl -sS -o /tmp/kub-home.html -w '%{http_code}' http://127.0.0.1:10000/kub-home.html)
          test "$code" = "200"
          grep -q 'Корпорация КУБ' /tmp/kub-home.html

          code=$(curl -sS -o /tmp/kub-crisis.html -w '%{http_code}' 'http://127.0.0.1:10000/kub-crisis.html?lang=en')
          test "$code" = "200"
          grep -Eqi 'KUB|crisis' /tmp/kub-crisis.html

          code=$(curl -sS -D /tmp/kub-dashboard.headers -o /tmp/kub-dashboard.body -w '%{http_code}' 'http://127.0.0.1:10000/dashboard.html?client=kub&page=overview')
          test "$code" = "302"
          grep -Eqi '^location: /kub-crisis\.html' /tmp/kub-dashboard.headers

          code=$(curl -sS -o /tmp/wirello.html -w '%{http_code}' http://127.0.0.1:10000/wirello)
          test "$code" = "200"
          grep -Eqi 'Wirello' /tmp/wirello.html

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Renderer browser regression
        run: |
          cat > /tmp/navigator-smoke.cjs <<'NODE'
          const { chromium } = require(process.env.GITHUB_WORKSPACE + '/node_modules/playwright');
          const fs=require('fs');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const origin='http://127.0.0.1:10001';
          const clients=['aroma','bolyarka','mollox','varna-towers','everbet','astor-garden'];
          const analytical=['overview','social','market','competition','history'];
          const resources=['hub','calendar'];
          const pages=[...analytical,...resources];
          const labels=['Общ изглед','Мониторинг','Среда','Конкуренти','Развитие/Доклади','Intelligence HUB','Календар'];
          const expectedNames={aroma:'Aroma',bolyarka:'Болярка',mollox:'MOLLOX','varna-towers':'Varna Towers',everbet:'Everbet','astor-garden':'Astor Garden'};
          const visualSelector={overview:'#overview .ovh-gauge',social:'#social .dv-radar-wrap',market:'#market .pm-stage,#market .pm-canvas',competition:'#competition .vs-comp-axis',history:'#history .vs-history-board',hub:'#hub .n3-resource-card',calendar:'#calendar .n3-resource-card'};
          let phase='startup';
          const watchdog=setTimeout(()=>{const msg=`watchdog timeout at ${phase}`;try{fs.writeFileSync('/tmp/navigator-smoke-error.txt',msg)}catch(_){};console.error(msg);process.exit(2)},120000);
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const client of clients){
                phase=`${client}:open`;
                const p=await browser.newPage({viewport:{width:1440,height:1000}});
                const errs=[];
                p.on('pageerror',e=>errs.push('PAGEERROR '+e.message));
                p.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource|ERR_NAME_NOT_RESOLVED|net::ERR_/i.test(m.text()))errs.push('CONSOLE '+m.text())});
                p.on('response',r=>{try{const u=new URL(r.url());if(u.origin===origin&&r.status()>=400&&u.pathname!=='/favicon.ico')errs.push(`HTTP ${r.status()} ${u.pathname}`)}catch(_){}});
                await p.goto(`${origin}/dashboard.html?client=${client}&page=overview`,{waitUntil:'domcontentloaded',timeout:20000});
                phase=`${client}:runtime-ready`;
                await p.waitForFunction(()=>typeof window.refGo==='function' && !!window.BLISClientUIV5 && Array.isArray(window.BLIS_VISIBLE_CLIENTS),null,{timeout:20000});
                await p.waitForFunction(()=>document.querySelectorAll('#nav [data-n3-page]').length===7,null,{timeout:12000});
                await p.waitForFunction(()=>document.querySelector('.page.active')?.innerText.trim().length>20,null,{timeout:15000});
                await p.waitForFunction(()=>document.body.dataset.blisLoading!=='true',null,{timeout:12000});
                const boot=await p.evaluate(()=>({client:document.body.dataset.client||'',name:document.querySelector('.bch3-name')?.textContent||document.querySelector('.client-brand-name')?.textContent||'',nav:[...document.querySelectorAll('#nav [data-n3-page]')].map(x=>x.dataset.n3Page),labels:[...document.querySelectorAll('#nav [data-n3-page] .navtxt')].map(x=>x.textContent.trim()),lang:document.documentElement.lang,language:window.BLIS_LANGUAGE,refGo:typeof window.refGo==='function',clientUI:!!window.BLISClientUIV5,legacy:[...document.querySelectorAll('#nav [data-page]')].length,services:!!document.querySelector('[data-blis-commerce-open]'),visibleClients:[...(window.BLIS_VISIBLE_CLIENTS||[])],menuClients:[...document.querySelectorAll('.client-switch-menu .client-option[data-client-key]')].map(x=>x.dataset.clientKey)}));
                assert(boot.client===client,`${client}: body client ${boot.client}`);
                assert(boot.name.includes(expectedNames[client]),`${client}: wrong client identity ${JSON.stringify(boot)}`);
                assert(boot.nav.join(',')===pages.join(','),`${client}: wrong Navigator nav ${boot.nav.join(',')}`);
                assert(boot.labels.join('|')===labels.join('|'),`${client}: wrong Navigator labels ${boot.labels.join('|')}`);
                assert(boot.refGo&&boot.clientUI,`${client}: canonical runtime contract incomplete`);
                assert(boot.lang==='bg'&&boot.language==='bg',`${client}: Bulgarian lock missing`);
                assert(boot.legacy===0,`${client}: legacy navigation leaked`);
                assert(!boot.services,`${client}: Services launcher leaked into client dashboard`);
                assert(boot.visibleClients.join(',')==='kub,mollox,aroma,bolyarka,wirello',`${client}: visible registry mismatch ${boot.visibleClients}`);
                assert(boot.menuClients.join(',')==='kub,mollox,aroma,bolyarka,wirello',`${client}: client menu leaked hidden profiles ${boot.menuClients}`);
                for(const id of pages){
                  phase=`${client}:${id}:render`;
                  await p.evaluate(id=>window.refGo(id),id);
                  await p.waitForFunction(id=>document.querySelector('.page.active')?.id===id,id,{timeout:9000});
                  await p.waitForTimeout(250);
                  const x=await p.evaluate(({id,sel})=>{const root=document.getElementById(id),r=root?.getBoundingClientRect(),cs=root?getComputedStyle(root):null;const visual=document.querySelector(sel),vr=visual?.getBoundingClientRect(),vs=visual?getComputedStyle(visual):null;return {id:document.querySelector('.page.active')?.id,text:(root?.innerText||'').trim().length,height:r?.height||0,visible:!!root&&cs.display!=='none'&&cs.visibility!=='hidden'&&Number(cs.opacity||1)>.01,overflow:document.documentElement.scrollWidth-window.innerWidth,loading:/\bLoading\b|Зареждане\.{2,}/i.test(root?.innerText||''),visual:!!visual&&vs.display!=='none'&&vs.visibility!=='hidden'&&Number(vs.opacity||1)>.01,visualW:vr?.width||0,visualH:vr?.height||0};},{id,sel:visualSelector[id]});
                  assert(x.id===id,`${client}/${id}: wrong active route ${x.id}`);
                  assert(x.visible&&x.height>70&&x.text>20,`${client}/${id}: blank/collapsed ${JSON.stringify(x)}`);
                  assert(!x.loading,`${client}/${id}: loading state remained`);
                  assert(x.overflow<=8,`${client}/${id}: horizontal overflow ${x.overflow}`);
                  assert(x.visual&&x.visualW>70&&x.visualH>30,`${client}/${id}: canonical visual missing ${JSON.stringify(x)}`);
                }
                assert(errs.length===0,`${client}: runtime errors ${errs.join(' | ')}`);
                await p.close();
              }
              clearTimeout(watchdog);
              console.log('NAVIGATOR_LOCAL_RENDERER_REGRESSION_OK');
            } finally {await browser.close();}
          })().catch(e=>{try{fs.writeFileSync('/tmp/navigator-smoke-error.txt',String(e.message||e))}catch(_){};console.error(e);process.exit(1)});
          NODE
          node /tmp/navigator-smoke.cjs

      - name: Show server log on failure
        if: failure()
        run: |
          cat /tmp/navigator-smoke-error.txt || true
          cat /tmp/blis-smoke-server.log || true

  production-origin:
    needs: local-regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for exact migration build on production
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          echo "Waiting for $MIGRATION_BUILD on $BASE"
          found=0
          for i in $(seq 1 42); do
            if curl -fsS --connect-timeout 15 --max-time 30 "$BASE/migration-build.js?ts=$(date +%s)" -o /tmp/migration-build.js; then
              if grep -q "$MIGRATION_BUILD" /tmp/migration-build.js; then
                found=1
                break
              fi
            fi
            sleep 10
          done
          cat /tmp/migration-build.js 2>/dev/null || true
          test "$found" = "1"

      - name: Verify production health, auth, KUB, store and Wirello
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"

          curl -fsS "$BASE/api/health?ts=$(date +%s)" -o /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

          curl -fsS "$BASE/api/store/export?ts=$(date +%s)" -o /tmp/store.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/store.json',encoding='utf-8'))
          clients=d.get('clients',{})
          for slug in ('aroma','bolyarka','mollox','astor-garden'):
              assert slug in clients, f'{slug} missing from production store'
          print('STORE_OK', ','.join(sorted(clients)))
          PY

          code=$(curl -sS -o /tmp/login.html -w '%{http_code}' "$BASE/client-login?ts=$(date +%s)")
          test "$code" = "200"
          grep -Eqi 'BLIS|client|клиент' /tmp/login.html

          code=$(curl -sS -D /tmp/dashboard.headers -o /tmp/dashboard.body -w '%{http_code}' "$BASE/dashboard.html?client=aroma&page=overview&ts=$(date +%s)")
          test "$code" = "302"
          grep -Eqi '^location: /client-login' /tmp/dashboard.headers

          code=$(curl -sS -o /tmp/kub-home.html -w '%{http_code}' "$BASE/kub-home.html?ts=$(date +%s)")
          test "$code" = "200"
          grep -q 'Корпорация КУБ' /tmp/kub-home.html

          code=$(curl -sS -o /tmp/kub-crisis.html -w '%{http_code}' "$BASE/kub-crisis.html?lang=en&ts=$(date +%s)")
          test "$code" = "200"
          grep -Eqi 'KUB|crisis' /tmp/kub-crisis.html

          code=$(curl -sS -D /tmp/kub-dashboard.headers -o /tmp/kub-dashboard.body -w '%{http_code}' "$BASE/dashboard.html?client=kub&page=overview&ts=$(date +%s)")
          test "$code" = "302"
          grep -Eqi '^location: /kub-crisis\.html' /tmp/kub-dashboard.headers

          curl -fsS "$BASE/api/signals/health?client=kub&ts=$(date +%s)" -o /tmp/kub-health.json
          curl -fsS "$BASE/api/signals?client=kub&limit=3&ts=$(date +%s)" -o /tmp/kub-signals.json
          grep -q '"signals"' /tmp/kub-signals.json

          code=$(curl -sS -o /tmp/wirello.html -w '%{http_code}' "$BASE/wirello?ts=$(date +%s)")
          test "$code" = "200"
          grep -Eqi 'Wirello' /tmp/wirello.html

          echo "NAVIGATOR_PRODUCTION_MIGRATION_OK"

      - name: Publish migration status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state='${{ job.status }}'==='success'?'success':'failure';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'navigator-code-run-production',description:state==='success'?'code.run production migration passed':'code.run production migration failed'});
