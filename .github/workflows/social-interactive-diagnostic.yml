name: Social Interactive Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build and start
        run: |
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:10000/api/health && break || sleep 1; done
          node --check static/navigator-social-interactive.js
      - name: Browser test
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          cat > .diag.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']});const p=await b.newPage();const errors=[];p.on('pageerror',e=>errors.push(e.message));await p.goto('http://127.0.0.1:10000/dashboard.html?client=aroma&page=social',{waitUntil:'domcontentloaded'});await p.waitForTimeout(2600);const before=await p.evaluate(()=>({active:document.querySelector('.page.active')?.id,kpis:document.querySelectorAll('#socialBody .sm-kpi[data-sm-destination]').length,points:document.querySelectorAll('#socialBody .sm-measured-chart .sm-point').length,readout:!!document.getElementById('smChartReadout'),trend:!!document.getElementById('socialTrend'),channels:!!document.getElementById('socialChannels'),posts:!!document.getElementById('socialPosts')}));console.log('BEFORE',before,errors);if(errors.length||before.active!=='social'||before.kpis<5||before.points<2||!before.readout||!before.trend||!before.channels||!before.posts)throw new Error('interactive social patch failed');await p.locator('#socialBody .sm-kpi[data-sm-destination="part:socialChannels"]').click();await p.waitForTimeout(300);const channelsTop=await p.evaluate(()=>Math.round(document.getElementById('socialChannels').getBoundingClientRect().top));console.log('CHANNELS_TOP',channelsTop);await p.locator('#socialBody .sm-kpi[data-sm-destination="page:signals"]').click();await p.waitForTimeout(500);const active=await p.evaluate(()=>document.querySelector('.page.active')?.id);console.log('ACTIVE_AFTER_MENTIONS',active);if(active!=='signals')throw new Error('mentions KPI did not navigate to signals');await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node .diag.cjs
