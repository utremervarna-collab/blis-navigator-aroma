name: Live Period Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  test-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Start Navigator
        run: |
          PORT=10000 go run . >/tmp/blis.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10000/dashboard.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/blis.log
          exit 1
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify Live statuses periods and visuals
        run: |
          cat > live-period-check.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:10000/dashboard.html?client=aroma',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(3000);
            const liveBtn=page.locator('#nav button[data-page="live"]').first();
            if(!await liveBtn.count()) throw new Error('Live Monitoring navigation missing');
            await liveBtn.click({force:true});
            await page.waitForTimeout(1800);
            const before=await page.evaluate(()=>({
              active:document.querySelector('.page.active')?.id,
              activityCard:!!document.querySelector('.lm-live-card .lm-live-stage'),
              geoCard:!!document.querySelector('.lm-geo-card .lm-map-real'),
              statuses:[...document.querySelectorAll('.lm-tablewrap .lm-status')].map(x=>x.textContent.trim()),
              kpis:[...document.querySelectorAll('.lm-kpi')].map(x=>({label:x.querySelector('span')?.textContent.trim(),value:x.querySelector('strong')?.textContent.trim()})),
              periodDays:window.BLISPeriod?.days,
              datebox:document.querySelector('.datebox')?.textContent.trim()
            }));
            console.log('BEFORE',JSON.stringify(before,null,2));
            if(before.active!=='live') throw new Error('Live section not active');
            if(!before.activityCard) throw new Error('Interactive Activity card missing');
            if(!before.geoCard) throw new Error('Interactive Geo card missing');
            if(!before.statuses.length || before.statuses.some(x=>x!=='● Активен')) throw new Error('Not all source statuses are Active');
            if(before.periodDays!==30) throw new Error('Default period is not 30 days');
            await page.locator('.datebox').click({force:true});
            await page.waitForTimeout(200);
            const options=await page.locator('#blisPeriodMenu [data-days]').allTextContents();
            console.log('OPTIONS',options);
            if(options.length!==3 || !options.some(x=>x.includes('30')) || !options.some(x=>x.includes('60')) || !options.some(x=>x.includes('90'))) throw new Error('30/60/90 period options missing');
            await page.locator('#blisPeriodMenu [data-days="60"]').click({force:true});
            await page.waitForTimeout(900);
            const after=await page.evaluate(()=>({
              periodDays:window.BLISPeriod?.days,
              datebox:document.querySelector('.datebox')?.textContent.trim(),
              selectedKpi:[...document.querySelectorAll('.lm-kpi')].map(x=>({label:x.querySelector('span')?.textContent.trim(),value:x.querySelector('strong')?.textContent.trim()})).find(x=>x.label==='ИЗБРАН ПЕРИОД'),
              newItems:[...document.querySelectorAll('.lm-kpi')].map(x=>({label:x.querySelector('span')?.textContent.trim(),value:x.querySelector('strong')?.textContent.trim()})).find(x=>x.label?.startsWith('НОВИ ЕЛЕМЕНТИ')),
              statuses:[...document.querySelectorAll('.lm-tablewrap .lm-status')].map(x=>x.textContent.trim()),
              activityCard:!!document.querySelector('.lm-live-card .lm-live-stage'),
              geoCard:!!document.querySelector('.lm-geo-card .lm-map-real')
            }));
            console.log('AFTER',JSON.stringify(after,null,2));
            if(after.periodDays!==60 || !after.datebox.includes('60')) throw new Error('Period did not switch to 60 days');
            if(!after.selectedKpi?.value?.includes('60')) throw new Error('Selected-period KPI did not rerender');
            if(!after.newItems?.label?.includes('60')) throw new Error('New-items KPI did not rerender for 60 days');
            if(after.statuses.some(x=>x!=='● Активен')) throw new Error('Source statuses changed away from Active');
            if(!after.activityCard || !after.geoCard) throw new Error('Interactive cards were lost after period switch');
            if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node live-period-check.cjs
