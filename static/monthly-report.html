<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLIS месечен анализ</title><style>
:root{--ink:#173652;--muted:#718399;--line:#dfe8f0;--soft:#f6f9fc;--blue:#2164a1}*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:var(--ink);font-family:Segoe UI,Arial,sans-serif;line-height:1.62}.report{max-width:1050px;margin:28px auto;background:#fff;box-shadow:0 18px 55px rgba(32,60,88,.12)}header{padding:44px 52px 32px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:var(--blue)}h1{font-size:34px;line-height:1.14;margin:8px 0 10px}header p{max-width:800px;color:var(--muted);margin:0}.demo{margin-top:18px;padding:12px 15px;border:1px solid #e2bd75;background:#fff8e9;border-radius:10px;color:#77510e;font-weight:700}.meta{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.meta div{padding:18px 20px;border-right:1px solid var(--line)}.meta div:last-child{border-right:0}.meta span,.kpi span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.meta b{display:block;margin-top:4px;font-size:14px}.body{padding:14px 52px 52px}section{padding:27px 0;border-bottom:1px solid var(--line)}section:last-child{border-bottom:0}h2{font-size:21px;margin:0 0 14px}h3{font-size:14px;margin:18px 0 6px}p{margin:7px 0 11px}.lead{font-size:16px;color:#31526f}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:18px 0}.kpi{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft)}.kpi b{display:block;margin:4px 0;font-size:22px}.kpi small{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid var(--line);border-radius:12px;padding:16px}.card strong{display:block;margin-bottom:5px}.signal{padding:11px 0;border-bottom:1px solid #edf2f6}.signal:last-child{border-bottom:0}.signal small{display:block;color:var(--muted);margin-top:3px}.priority{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #edf2f6}.priority b{font-size:10px;text-transform:uppercase;color:var(--blue)}.method{font-size:11px;color:var(--muted)}.empty{padding:12px;background:var(--soft);border-radius:10px;color:var(--muted)}footer{padding:20px 52px;background:#163550;color:#dfeaf4;font-size:11px}@media(max-width:760px){.report{margin:0}.body,header{padding-left:22px;padding-right:22px}.meta,.kpis,.grid{grid-template-columns:1fr}.meta div{border-right:0;border-bottom:1px solid var(--line)}}@media print{body{background:#fff}.report{box-shadow:none;margin:0;max-width:none}}
</style></head><body><main id="report" class="report"><header><div class="eyebrow">BLIS™ Brand Lab Intelligence System</div><h1 id="title">Месечен анализ</h1><p id="subtitle">Зареждане на аналитичната база...</p><div id="demo"></div></header><div id="meta" class="meta"></div><div id="body" class="body"></div><footer>Brand Lab · BLIS™ Navigator · Аналитичен документ, генериран от наличната база на клиентския профил.</footer></main><script>
(function(){'use strict';
const A=v=>Array.isArray(v)?v:[],E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),N=v=>Number.isFinite(Number(v))?Number(v):null,F=v=>N(v)==null?'няма надеждна стойност':N(v).toLocaleString('bg-BG',{maximumFractionDigits:1});
const k=(new URLSearchParams(location.search).get('client')||'aroma').toLowerCase(),allowed=['aroma','bolyarka','wirello'];if(!allowed.includes(k)){document.getElementById('body').innerHTML='<section><div class="empty">За този профил все още няма публикуван първи месечен доклад.</div></section>';return}
const stamp=x=>{const v=x?.published_at||x?.detected_at||x?.observed_at||x?.created_at||x?.time||x?.date;const t=Date.parse(v||'');return Number.isFinite(t)?t:null},txt=x=>[x?.title,x?.label,x?.description,x?.detail,x?.topic,x?.category,x?.kind,x?.metric_key,x?.metric].filter(Boolean).join(' ').replace(/\s+/g,' ').trim(),idx=(p,key)=>{p=p?.payload||p||{};if(key==='blis')return N(p.blis_index);return N(A(p.indices).find(x=>x.key===key)?.value)};
const names={blis:'BLIS индекс',digital:'Дигитална видимост',reputation:'Репутация',social:'Социална активност',presence:'Социално присъствие',market:'Пазарни сигнали',competitive:'Конкурентна позиция',content:'Съдържание и сигнали'};
async function get(path,fallback){try{const r=await fetch(path,{cache:'no-store'});return r.ok?await r.json():fallback}catch{return fallback}}
function nearest(h,target){const x=A(h).map(s=>({t:stamp(s),p:s.payload||s})).filter(s=>s.t);return x.length?x.reduce((a,b)=>Math.abs(b.t-target)<Math.abs(a.t-target)?b:a,x[0]):null}
function useful(all){const re=/(website_active|profile_active|reachable|response_ms|source_key|metric_key|sitemap_|followers?$|public_platform_profiles)/i;return all.filter(x=>txt(x)&&!re.test(txt(x))).sort((a,b)=>(stamp(b)||0)-(stamp(a)||0))}
function classify(x){const t=txt(x).toLowerCase();if(/critical|high|криз|риск|негатив|жалб|санкц|скандал/.test(t))return'Риск';if(/compet|конкур|кампан|промоц/.test(t))return'Конкурент';if(/rating|review|репутац|отзив|оценк/.test(t))return'Репутация';if(/digital|search|site|ecommerce|търсен|откриваем/.test(t))return'Дигитално';if(/market|пазар|категор|сектор|интерес|цена/.test(t))return'Пазар';if(/social|facebook|instagram|linkedin|youtube|публикац/.test(t))return'Социално';return'Сигнал'}
function delta(now,old){return now!=null&&old!=null?now-old:null}function dtext(v){return v==null?'без надеждна сравнима база':Math.abs(v)<.4?'стабилно':v>0?`+${v.toFixed(1)} т.`:`${v.toFixed(1)} т.`}function tone(v){return v==null?'Няма достатъчно историческа база за оценка на движението.':v>2?'Положително движение, което трябва да бъде проверено за устойчивост.':v<-2?'Негативно движение, което изисква разлагане по компоненти и източници.':'Без съществено отклонение спрямо сравнимата точка.'}
function topSignals(rows,n=8){return rows.slice(0,n).map(x=>`<div class="signal"><b>${E(classify(x))}</b> · ${E(txt(x).slice(0,260))}<small>${stamp(x)?new Date(stamp(x)).toLocaleDateString('bg-BG'):'дата не е налична'}</small></div>`).join('')||'<div class="empty">Не са налични достатъчно съдържателни сигнали за надежден списък.</div>'}
function forecast(deltas,rows){const vals=deltas.filter(x=>x.v!=null),avg=vals.length?vals.reduce((a,x)=>a+x.v,0)/vals.length:null,risk=rows.filter(x=>classify(x)==='Риск').length,comp=rows.filter(x=>classify(x)==='Конкурент').length;if(avg==null)return'Прогнозата остава неутрална поради недостатъчна сравнима историческа база. Следващият период трябва да се използва за натрупване и валидация на тенденцията.';if(avg>1.5&&risk===0)return'Базовият сценарий за следващия месец е умерено положителен. Наличните индекси се движат нагоре без концентриран рисков поток. Ключовата проверка е дали подобрението ще се потвърди в повече от един източник и ще остане видимо през целия следващ период.';if(avg<-1.5||risk>2)return'Базовият сценарий за следващия месец е предпазлив. Наличната динамика или концентрацията на рискови сигнали създават вероятност от допълнителен натиск. Приоритет е ранната проверка на причината, а не механичното следване на агрегирания индекс.';if(comp>2)return'Базовият сценарий е стабилен, но конкурентната среда е активна. Най-голямата вероятност за промяна през следващия месец идва от външни конкурентни действия, затова те трябва да се следят по честота, тема и ефект върху собствената видимост.';return'Базовият сценарий е относително стабилен. Не се вижда достатъчно силна еднопосочна промяна за агресивна прогноза. Следващият месец трябва да потвърди дали текущите сигнали са начална тенденция или краткосрочно колебание.'}
function recs(ds,rows){const out=[],weak=ds.filter(x=>x.now!=null).sort((a,b)=>a.now-b.now)[0],fall=ds.filter(x=>x.v!=null).sort((a,b)=>a.v-b.v)[0];if(rows.some(x=>classify(x)==='Риск'))out.push(['Незабавно','Валидирайте рисковите сигнали по източник, мащаб и повторяемост. Определете кои изискват комуникационна, продуктова или оперативна реакция.']);if(fall&&fall.v<-1)out.push(['Висок','Разложете спада в '+(names[fall.key]||fall.key)+' по компонентите, които го формират, и сравнете с предходните 30 дни.']);if(weak&&weak.now<70)out.push(['Висок','Приоритетно подобрете областта „'+(names[weak.key]||weak.key)+'“, защото тя е най-слабата измерима част от текущия профил.']);if(rows.some(x=>classify(x)==='Конкурент'))out.push(['Среден','Съпоставете конкурентните действия с вашата текуща активност и определете кои движения могат реално да променят share of voice, интереса или репутационната позиция.']);out.push(['Постоянен','Запазете месечното сравнение по еднакви критерии. Не променяйте метриките между периодите без методологична причина, за да остане тенденцията съпоставима.']);return out.slice(0,5).map(x=>`<div class="priority"><b>${E(x[0])}</b><span>${E(x[1])}</span></div>`).join('')}
Promise.all([get(`/api/clients/${k}/dashboard`,{}),get(`/api/clients/${k}/sources`,[]),get(`/api/clients/${k}/activity`,[]),get(`/api/clients/${k}/history`,[]),get(`/api/signals?client=${k}&limit=500`,{})]).then(([d,s,a,h,g])=>{
 const name=d.name||({aroma:'Aroma',bolyarka:'Болярка',wirello:'Wirello Market'}[k]);document.title=`BLIS месечен анализ · ${name}`;document.getElementById('title').textContent=`Първи месечен анализ · ${name}`;document.getElementById('subtitle').textContent='Анализ на последните 30 дни с историческа съпоставка, интерпретация на сигналите, прогноза и приоритети за следващия период.';
 if(k==='wirello')document.getElementById('demo').innerHTML='<div class="demo">ДЕМО АНАЛИТИЧЕН ПРОФИЛ. Всички стойности, организации и сигнали в Wirello Market са синтетични и служат само за демонстрация на аналитичния процес.</div>';
 const end=Date.now(),start=end-30*864e5,prev=nearest(h,start),rows=useful([...A(d.signals),...A(g.signals),...A(a)]).filter(x=>!stamp(x)||stamp(x)>=start),keys=['blis','digital','reputation','social','presence','market','competitive','content'];const ds=[];for(const key of keys){const now=idx(d,key),old=idx(prev?.p,key);if(now!=null||old!=null)ds.push({key,now,old,v:delta(now,old)})}const main=ds.find(x=>x.key==='blis');
 const meta=document.getElementById('meta');meta.innerHTML=`<div><span>Период</span><b>${new Date(start).toLocaleDateString('bg-BG')} - ${new Date(end).toLocaleDateString('bg-BG')}</b></div><div><span>Източници</span><b>${A(s).length}</b></div><div><span>Исторически записи</span><b>${A(h).length}</b></div><div><span>Релевантни сигнали</span><b>${rows.length}</b></div>`;
 const kpis=ds.slice(0,5).map(x=>`<div class="kpi"><span>${E(names[x.key]||x.key)}</span><b>${E(F(x.now))}</b><small>${E(dtext(x.v))}</small></div>`).join('');
 const risks=rows.filter(x=>classify(x)==='Риск').length,comps=rows.filter(x=>classify(x)==='Конкурент').length,reps=rows.filter(x=>classify(x)==='Репутация').length;
 const exec=main?`Текущият BLIS индекс е ${F(main.now)}/100 и спрямо най-близката сравнима точка около 30 дни назад е ${dtext(main.v)}. ${tone(main.v)} През периода са идентифицирани ${rows.length} съдържателни наблюдения, от които ${risks} са с рисков контекст, ${comps} са свързани с конкурентната среда и ${reps} с репутация.`:`За периода няма достатъчно сравнима база за надеждна стойност на общия BLIS индекс. Анализът затова се опира на наличните доказателства и не замества липсващите стойности с нули.`;
 const byCat={};rows.forEach(x=>byCat[classify(x)]=(byCat[classify(x)]||0)+1);const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="card"><strong>${E(x[0])}</strong><span>${x[1]} релевантни наблюдения през периода</span></div>`).join('')||'<div class="empty">Недостатъчно класифицирани наблюдения.</div>';
 document.getElementById('body').innerHTML=`
 <section><h2>1. Резюме за периода</h2><p class="lead">${E(exec)}</p><div class="kpis">${kpis}</div><p>Основният управленски извод не е броят на събраните записи, а дали наличните промени са достатъчно последователни и потвърдени, за да изискват действие. Индекси без надеждна база не се интерпретират като реална нула.</p></section>
 <section><h2>2. Какво се промени</h2><div class="grid">${ds.map(x=>`<div class="card"><strong>${E(names[x.key]||x.key)}</strong><p>Текущо: <b>${E(F(x.now))}</b>. Спрямо сравнимия исторически период: <b>${E(dtext(x.v))}</b>.</p><small>${E(tone(x.v))}</small></div>`).join('')||'<div class="empty">Няма достатъчно сравними индексни стойности.</div>'}</div></section>
 <section><h2>3. Информационна среда и ключови сигнали</h2><p>Тук са включени само съдържателни наблюдения. Технически статуси от типа „сайтът работи“, сурови ключове и абсолютни follower counts без сравнителен контекст са изключени от аналитичния разказ.</p>${topSignals(rows)}</section>
 <section><h2>4. Репутация, дигитална видимост и потребителска среда</h2><div class="grid">${cats}</div><p>Разпределението показва къде е концентриран значимият поток през периода. То не е sentiment score и не трябва да се интерпретира като автоматична оценка на марката. Значението идва от съдържанието, източника, повторяемостта и промяната спрямо предходния период.</p></section>
 <section><h2>5. Конкурентна среда</h2><p>${comps?`Идентифицирани са ${comps} релевантни конкурентни наблюдения. Те трябва да се оценяват според потенциала им да променят видимостта, потребителския интерес, ценовото възприятие или комуникационната позиция на ${E(name)}.`:'Наличната база не съдържа достатъчно съдържателни конкурентни наблюдения за силен извод. Това е ограничение на доказателствата, а не доказателство за липса на конкурентна активност.'}</p>${topSignals(rows.filter(x=>classify(x)==='Конкурент'),5)}</section>
 <section><h2>6. Рискове и възможности</h2><div class="grid"><div class="card"><strong>Рискове</strong><p>${risks?`${risks} сигнала изискват допълнителна проверка. Приоритет се дава на повтарящи се негативни теми, рязко влошаване на индекс и конкурентни действия с пряк пазарен ефект.`:'Няма концентриран рисков поток над текущия праг. Това не отменя наблюдението.'}</p></div><div class="card"><strong>Възможности</strong><p>Положителните или стабилизиращи движения трябва да се използват само когато са подкрепени от повече от една измерима компонента. Най-силните текущи индекси могат да служат като база за по-видимо комуникационно или продуктово позициониране.</p></div></div></section>
 <section><h2>7. Прогноза за следващия период</h2><p class="lead">${E(forecast(ds,rows))}</p><p>Прогнозата е аналитичен сценарий на база текущата посока и наличните сигнали. Тя не е статистическа гаранция и трябва да се актуализира при ново съществено събитие.</p></section>
 <section><h2>8. Приоритетни насоки</h2>${recs(ds,rows)}</section>
 <section><h2>9. Методологична бележка и ограничения</h2><p class="method">Докладът използва текущия dashboard, конфигурираните източници, наличната activity база, историческите snapshots и сигналния поток на BLIS Navigator. Сравнението е спрямо най-близката налична историческа точка около 30 дни назад. Липсваща метрика не се приема за нула. Слаб или едноизточников сигнал не се превръща автоматично в извод. Препоръките са приоритизирани според измеримата промяна, съдържателните сигнали и практическата им стойност за клиента.</p></section>`;
}).catch(()=>{document.getElementById('body').innerHTML='<section><div class="empty">Докладът не може да бъде генериран, защото клиентската база не е достъпна в момента.</div></section>'});
})();</script></body></html>
