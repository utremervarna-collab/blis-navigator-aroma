name: Live Period Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  production-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify production Render Live Monitoring
        run: |
          cat > prod-live-check.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          const target='https://blis-navigator-aroma.onrender.com/dashboard.html?client=aroma';
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            let last='';
            for(let attempt=1;attempt<=8;attempt++){
              const page=await browser.newPage({viewport:{width:1440,height:1000}});
              try{
                await page.goto(target,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2500);
                const liveBtn=page.locator('#nav button[data-page="live"]').first();
                if(!await liveBtn.count()) throw new Error('Live navigation missing');
                await liveBtn.click({force:true});
                await page.waitForTimeout(1200);
                const state=await page.evaluate(()=>({
                  activity:!!document.querySelector('.lm-live-card .lm-live-stage'),
                  geo:!!document.querySelector('.lm-geo-card .lm-map-real'),
                  statuses:[...document.querySelectorAll('.lm-tablewrap .lm-status')].map(x=>x.textContent.trim()),
                  labels:[...document.querySelectorAll('.lm-kpi span')].map(x=>x.textContent.trim()),
                  period:window.BLISPeriod?.days,
                  datebox:document.querySelector('.datebox')?.textContent.trim()
                }));
                console.log('ATTEMPT',attempt,JSON.stringify(state));
                const ok=state.activity&&state.geo&&state.statuses.length>0&&state.statuses.every(x=>x==='● Активен')&&state.labels.includes('ПОКРИТИЕ НА ДАННИТЕ')&&state.labels.includes('ИЗБРАН ПЕРИОД')&&state.period===30;
                if(!ok) throw new Error('Production has not picked up confirmed source/period build yet');
                await page.locator('.datebox').click({force:true});
                await page.waitForTimeout(150);
                const opts=await page.locator('#blisPeriodMenu [data-days]').allTextContents();
                if(opts.length!==3||!opts.some(x=>x.includes('30'))||!opts.some(x=>x.includes('60'))||!opts.some(x=>x.includes('90')))throw new Error('Production period menu is not 30/60/90');
                await page.locator('#blisPeriodMenu [data-days="60"]').click({force:true});
                await page.waitForTimeout(700);
                const after=await page.evaluate(()=>({period:window.BLISPeriod?.days,datebox:document.querySelector('.datebox')?.textContent.trim(),selected:[...document.querySelectorAll('.lm-kpi')].map(x=>({l:x.querySelector('span')?.textContent.trim(),v:x.querySelector('strong')?.textContent.trim()})).find(x=>x.l==='ИЗБРАН ПЕРИОД'),statuses:[...document.querySelectorAll('.lm-tablewrap .lm-status')].map(x=>x.textContent.trim()),activity:!!document.querySelector('.lm-live-card .lm-live-stage'),geo:!!document.querySelector('.lm-geo-card .lm-map-real')}));
                console.log('AFTER',JSON.stringify(after));
                if(after.period!==60||!after.datebox.includes('60')||!after.selected?.v?.includes('60')||after.statuses.some(x=>x!=='● Активен')||!after.activity||!after.geo)throw new Error('Production 60-day rerender failed');
                await page.close();
                await browser.close();
                return;
              }catch(e){last=e.message;console.log('RETRY',attempt,last);await page.close();if(attempt<8)await new Promise(r=>setTimeout(r,5000));}
            }
            await browser.close();throw new Error(last||'Production verification failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node prod-live-check.cjs
