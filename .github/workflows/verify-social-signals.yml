name: Verify Social Signals Production
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify Bulgarian Social Signals page
        run: |
          cat > check.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            let last='';
            for(let i=1;i<=24;i++){
              const page=await browser.newPage({viewport:{width:1680,height:1050},deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              try{
                await page.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=aroma',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2500);
                const btn=page.locator('#nav button[data-page="social"]');
                await btn.click();
                await page.waitForTimeout(1200);
                const state=await page.evaluate(()=>{
                  const host=document.getElementById('socialBody');
                  const text=(host?.innerText||'').replace(/\s+/g,' ').trim();
                  const nav=document.querySelector('#nav button[data-page="social"]')?.innerText||'';
                  const channels=[...document.querySelectorAll('[data-sm-channel]')];
                  const names=channels.map(x=>x.querySelector('.sm-channel-name')?.textContent?.trim()||'');
                  return {
                    nav,
                    title:host?.querySelector('h2')?.textContent||'',
                    kpis:host?.querySelectorAll('.sm-kpi').length||0,
                    channelCount:channels.length,
                    channelNames:names,
                    uniqueChannelNames:new Set(names).size,
                    activeChannels:host?.querySelectorAll('[data-sm-channel].active').length||0,
                    detail:host?.querySelector('#smChannelDetail')?.innerText||'',
                    text,
                    hasCss:!![...document.styleSheets].find(x=>x.href&&x.href.includes('navigator-social-master.css')),
                    hasScript:!![...document.scripts].find(x=>x.src&&x.src.includes('navigator-social-master.js'))
                  };
                });
                console.log('ATTEMPT',i,JSON.stringify(state));
                const required=['Социален индекс','Социална динамика','Публична аудитория','Ангажираност','Дял на споменаванията','Социални предупреждения','Канали и принос','Съдържание и активност','Разговори за марката','Конкурентна позиция'];
                const bad=['Share of Voice','Competitive Social','Конкурентна социална позиция','Дял от разговора'];
                let ok=state.nav.includes('Социални сигнали')&&state.title==='Социални сигнали'&&state.kpis===5&&state.hasCss&&state.hasScript&&required.every(x=>state.text.toLowerCase().includes(x.toLowerCase()))&&!bad.some(x=>state.text.includes(x))&&state.channelCount===state.uniqueChannelNames;
                if(state.channelCount>1){
                  const second=page.locator('[data-sm-channel]').nth(1);
                  await second.click();
                  await page.waitForTimeout(250);
                  const interactive=await second.evaluate(el=>el.classList.contains('active'));
                  ok=ok&&interactive;
                }
                if(errors.length)console.log('PAGE_ERRORS',JSON.stringify(errors));
                if(!ok)throw new Error('Social Signals production state not ready');
                await page.locator('#social').screenshot({path:'social-signals-production.png',fullPage:true});
                await page.close();await browser.close();return;
              }catch(e){last=e.message;console.log('RETRY',i,last);await page.close();if(i<24)await new Promise(r=>setTimeout(r,10000));}
            }
            await browser.close();throw new Error(last||'verification failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-signals-production
          path: social-signals-production.png
