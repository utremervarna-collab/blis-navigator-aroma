name: Navigator Video Capture

on:
  push:
    branches:
      - video-capture
    paths:
      - '.github/workflows/navigator-video-capture.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Capture live Navigator and Wirello
        env:
          ORIGIN: https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run
        run: |
          mkdir -p /tmp/navigator-video
          cat >/tmp/capture.cjs <<'NODE'
          const { chromium } = require(process.env.GITHUB_WORKSPACE + '/node_modules/playwright');
          const path = require('path');
          const origin = process.env.ORIGIN;
          const out = '/tmp/navigator-video';
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function gotoRetry(p,url,tries=12){
            let last;
            for(let i=0;i<tries;i++){
              try{
                const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                if(r && r.status() < 500){ return r; }
                last=new Error('HTTP '+(r?.status()||'no response'));
              }catch(e){ last=e; }
              await sleep(5000);
            }
            throw last;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const home=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
              await gotoRetry(home,origin+'/');
              await home.waitForTimeout(3500);
              await home.screenshot({path:path.join(out,'01-home.png'),fullPage:false});
              await home.close();

              const p=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
              await gotoRetry(p,origin+'/dashboard.html?client=wirello&page=overview');
              await p.waitForFunction(()=>window.__BLIS_NAVIGATOR_3_ARCHITECTURE_V1,{timeout:20000}).catch(()=>{});
              await p.waitForTimeout(3000);
              const pages=[
                ['overview','02-wirello-overview.png'],
                ['social','03-wirello-monitoring.png'],
                ['market','04-wirello-environment.png'],
                ['competition','05-wirello-competition.png'],
                ['history','06-wirello-reports.png']
              ];
              for(const [id,file] of pages){
                if(typeof await p.evaluate(()=>typeof window.refGo)==='string'){}
                await p.evaluate(id=>{ if(typeof window.refGo==='function') window.refGo(id); },id);
                await p.waitForFunction(id=>document.querySelector('.page.active')?.id===id,id,{timeout:12000}).catch(()=>{});
                await p.waitForTimeout(2200);
                await p.screenshot({path:path.join(out,file),fullPage:false});
              }
              await p.close();
            } finally { await browser.close(); }
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
          node /tmp/capture.cjs
      - name: Upload video screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigator-wirello-video-shots
          path: /tmp/navigator-video/*.png
          if-no-files-found: error
          retention-days: 7
