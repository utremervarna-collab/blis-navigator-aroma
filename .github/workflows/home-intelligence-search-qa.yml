name: Navigator Approved Home QA

on:
  push:
    branches: [main]
    paths:
      - 'static/index.html'
      - 'static/home.html'
      - 'static/analyses.html'
      - 'static/migration-build.js'
      - '.github/workflows/home-intelligence-search-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigator-approved-home-qa
  cancel-in-progress: true

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  RELEASE_MARKER: navigator-functional-home-2026-09-27-v4

jobs:
  approved-home:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate functional Home source
        run: |
          set -euo pipefail
          grep -Fq 'Информацията е предимство' static/index.html
          grep -Fq 'използвайте вашето' static/index.html
          grep -Fq 'Влез в Навигатор' static/index.html
          grep -Fq 'Клиентски профил' static/index.html
          grep -Fq 'Поръчай анализ' static/index.html
          grep -Fq 'Интелиджънс Хъб' static/index.html
          grep -Fq 'Последни анализи и статии' static/index.html
          grep -Fq 'Събиране' static/index.html
          grep -Fq 'Подреждане' static/index.html
          grep -Fq 'Проследяване' static/index.html
          grep -Fq '>Анализ<' static/index.html
          grep -Fq '>Извод<' static/index.html
          grep -Fq 'monitorScene' static/index.html
          grep -Fq 'heroRadar' static/index.html
          grep -Fq 'meeting reveal' static/index.html
          grep -Fq 'analysisMedia reveal' static/index.html
          grep -Fq 'href="/navigator"' static/index.html
          grep -Fq 'href="/analyses.html#order"' static/index.html
          grep -Fq 'href="/intelligence-hub.html"' static/index.html
          grep -Fq '/intelligence-hub-more-data-less-clarity.html' static/index.html
          grep -Fq '/intelligence-ai-search.html' static/index.html
          grep -Fq '/intelligence-reputation-trust.html' static/index.html
          grep -Fq '/intelligence-retail-bulgaria-2026.html' static/index.html
          grep -Fq 'navigator-functional-home-2026-09-27-v4' static/index.html
          grep -Fq '/home-2026.css' static/index.html
          grep -Fq '/home-2026.js' static/index.html
          cmp -s static/index.html static/home.html
          grep -Fq 'analysisOrder' static/analyses.html
          echo FUNCTIONAL_HOME_SOURCE_OK
      - name: Wait for approved production release
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 15 --max-time 30 "$BASE/migration-build.js?ts=$(date +%s%N)" -o /tmp/build.js && grep -Fq "$RELEASE_MARKER" /tmp/build.js; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = "1"
      - name: Verify functional production Home
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          curl --retry 6 --retry-all-errors --retry-delay 2 -fsS "$BASE/?functional-home=$(date +%s%N)" -o /tmp/home.html
          grep -Fq 'Информацията е предимство' /tmp/home.html
          grep -Fq 'използвайте вашето' /tmp/home.html
          grep -Fq 'Влез в Навигатор' /tmp/home.html
          grep -Fq 'Клиентски профил' /tmp/home.html
          grep -Fq 'Поръчай анализ' /tmp/home.html
          grep -Fq 'Интелиджънс Хъб' /tmp/home.html
          grep -Fq 'Последни анализи и статии' /tmp/home.html
          grep -Fq 'monitorScene' /tmp/home.html
          grep -Fq 'heroRadar' /tmp/home.html
          grep -Fq 'navigator-functional-home-2026-09-27-v4' /tmp/home.html
          curl --retry 6 --retry-all-errors --retry-delay 2 -fsS "$BASE/home-2026.css?ts=$(date +%s%N)" -o /tmp/home.css
          grep -Fq '.monitorScene' /tmp/home.css
          grep -Fq '@keyframes flow' /tmp/home.css
          grep -Fq '@keyframes radarSpin' /tmp/home.css
          curl --retry 6 --retry-all-errors --retry-delay 2 -fsS "$BASE/home-2026.js?ts=$(date +%s%N)" -o /tmp/home.js
          grep -Fq 'is-active' /tmp/home.js
          curl --retry 6 --retry-all-errors --retry-delay 2 -fsS "$BASE/home?ts=$(date +%s%N)" -o /tmp/home-mirror.html
          grep -Fq 'navigator-functional-home-2026-09-27-v4' /tmp/home-mirror.html
          curl --retry 6 --retry-all-errors --retry-delay 2 -fsS "$BASE/analyses.html?ts=$(date +%s%N)" -o /tmp/analyses.html
          grep -Fq 'analysisOrder' /tmp/analyses.html
          echo FUNCTIONAL_HOME_PRODUCTION_OK
