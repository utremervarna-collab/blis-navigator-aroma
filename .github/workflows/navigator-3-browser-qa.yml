name: Navigator 3 Browser QA

on:
  push:
    branches:
      - feature/navigator-3-bg-client-clarity
    paths:
      - 'static/navigator-3-*.js'
      - 'static/navigator-production-entry-v1.js'
      - 'static/navigator-system-structure-v1.js'
      - '.github/workflows/navigator-3-browser-qa.yml'
  workflow_dispatch:

jobs:
  browser-client-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and start feature server
        run: |
          set -euo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app >/tmp/nav3-browser-server.log 2>&1 &
          echo $! >/tmp/nav3-browser.pid
          ready=0
          for i in $(seq 1 60); do
            if curl --max-time 3 -fsS http://127.0.0.1:10000/api/health >/tmp/nav3-health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/nav3-browser-server.log || true; exit 1; fi

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Verify simplified Bulgarian client experience
        run: |
          cat >/tmp/nav3-browser.cjs <<'NODE'
          const { chromium }=require(process.env.GITHUB_WORKSPACE+'/node_modules/playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const origin='http://127.0.0.1:10000';
          const clients=['aroma','bolyarka','mollox','varna-towers','astor-garden','wirello','everbet'];
          const pages=['overview','social','market','competition','history','hub','calendar'];
          const labels=['Общ преглед','Сигнали и наблюдение','Пазар и репутация','Конкуренция','Развитие и доклади','Intelligence HUB','Календар'];
          const core=['overview','social','market','competition','history'];
          const visualState=async p=>p.evaluate(()=>({
            active:document.querySelector('.page.active')?.id||'',
            overview:!!document.querySelector('#overview .vs-gauge-card,#overview .vs-gauge-svg'),
            socialRadar:!!document.querySelector('#social [data-n3-radar-shell] .dv-radar-wrap'),
            socialNow:!!document.querySelector('#social .n3-now'),
            marketMap:!!document.querySelector('#market .pm-stage,#market .pm-canvas'),
            marketContext:!!document.querySelector('#market [data-n3-market-context]'),
            competitionAxis:!!document.querySelector('#competition .vs-comp-axis'),
            competitionChanges:!!document.querySelector('#competition [data-n3-competition-changes]'),
            historyChart:!!document.querySelector('#history .n3-dev-chart'),
            historyReports:!!document.querySelector('#history [data-n3-reports]'),
            hub:!!document.querySelector('#hub .n3-resource-card'),
            calendar:!!document.querySelector('#calendar .n3-resource-card'),
            architecture:document.documentElement.dataset.navigatorArchitecture||'',
            stability:document.documentElement.dataset.navigatorVisualStability||''
          }));
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const client of clients){
                const p=await browser.newPage({viewport:{width:1440,height:1000}});
                const errors=[];
                p.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
                p.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource|ERR_NAME_NOT_RESOLVED|net::ERR_/i.test(m.text()))errors.push('CONSOLE '+m.text())});
                await p.goto(`${origin}/dashboard.html?client=${client}&page=overview`,{waitUntil:'domcontentloaded',timeout:25000});
                await p.waitForFunction(()=>window.__BLIS_NAVIGATOR_3_ARCHITECTURE_V1&&window.__BLIS_NAVIGATOR_3_CLIENT_CLARITY_V1&&window.__BLIS_NAVIGATOR_3_CLIENT_PROOF_V1,null,{timeout:16000});
                await p.waitForFunction(()=>document.querySelectorAll('#nav [data-n3-page]').length===7,null,{timeout:10000});
                const start=await p.evaluate(()=>({lang:document.documentElement.lang,language:window.BLIS_LANGUAGE,switcher:!!document.querySelector('.bch3-lang'),labels:[...document.querySelectorAll('#nav [data-n3-page] .navtxt')].map(x=>x.textContent.trim()),legacy:document.querySelectorAll('#nav [data-page]').length,version:document.documentElement.dataset.navigatorVersion}));
                assert(start.lang==='bg'&&start.language==='bg',`${client}: Bulgarian lock missing`);
                assert(!start.switcher,`${client}: language switcher visible`);
                assert(start.labels.join('|')===labels.join('|'),`${client}: wrong simplified navigation ${start.labels.join('|')}`);
                assert(start.legacy===0,`${client}: legacy navigation buttons remain visible`);
                assert(start.version==='3.0-simplified-five-plus-two',`${client}: simplified architecture marker missing ${start.version}`);

                for(const id of pages){
                  console.log('CHECK_PAGE',client,id);
                  await p.evaluate(id=>window.refGo(id),id);
                  await p.waitForFunction(id=>document.querySelector('.page.active')?.id===id,id,{timeout:8000});
                  try{
                    await p.waitForFunction(id=>({
                      overview:()=>!!document.querySelector('#overview .vs-gauge-card,#overview .vs-gauge-svg'),
                      social:()=>!!document.querySelector('#social [data-n3-radar-shell] .dv-radar-wrap')&&!!document.querySelector('#social .n3-now'),
                      market:()=>!!document.querySelector('#market .pm-stage,#market .pm-canvas')&&!!document.querySelector('#market [data-n3-market-context]'),
                      competition:()=>!!document.querySelector('#competition .vs-comp-axis')&&!!document.querySelector('#competition [data-n3-competition-changes]'),
                      history:()=>!!document.querySelector('#history .n3-dev-chart')&&!!document.querySelector('#history [data-n3-reports]'),
                      hub:()=>!!document.querySelector('#hub .n3-resource-card'),
                      calendar:()=>!!document.querySelector('#calendar .n3-resource-card')
                    }[id]?.()),id,{timeout:9000});
                  }catch(e){
                    const state=await visualState(p);
                    throw new Error(`${client}/${id}: visual contract timeout ${JSON.stringify(state)} | ${e.message}`);
                  }
                  if(core.includes(id)){
                    await p.waitForFunction(id=>!!document.querySelector(`#${id}.page.active .nv3-story [data-n3p-open]`),id,{timeout:5000});
                    const count=await p.locator(`#${id}.page.active .n3-summary3 .n3-summary-card`).count();
                    if(id==='social'||id==='history')assert(count<=3,`${client}/${id}: too many primary summary cards ${count}`);
                  }
                  if(id==='market'){
                    const hidden=await p.evaluate(()=>{const el=document.querySelector('#market .pm-kpis');return !el||getComputedStyle(el).display==='none'});
                    assert(hidden,`${client}/market: old KPI wall remains visible`);
                  }
                  const english=await p.evaluate(()=>[...document.querySelectorAll('.page.active .vs-vhead em,.page.active .sv2-ch em,.page.active .pm-client-badge i')].some(x=>/\bLIVE\b/i.test(x.textContent.trim())));
                  assert(!english,`${client}/${id}: LIVE remains visible`);
                }

                const aliases={digital:'social',opportunities:'social',live:'social',reputation:'market',reports:'history',timeline:'history'};
                for(const [oldId,newId] of Object.entries(aliases)){
                  await p.evaluate(id=>window.refGo(id),oldId);
                  await p.waitForFunction(id=>document.querySelector('.page.active')?.id===id,newId,{timeout:5000});
                }

                await p.evaluate(()=>window.refGo('overview'));
                await p.waitForFunction(()=>!!document.querySelector('#overview.page.active .nv3-story [data-n3p-open]'),null,{timeout:5000});
                await p.locator('#overview.page.active .nv3-story [data-n3p-open]').click();
                await p.waitForFunction(()=>document.getElementById('n3pDrawer')?.classList.contains('open'),null,{timeout:4000});
                const proof=await p.locator('#n3pDrawer').innerText();
                const proofState=await p.evaluate(()=>{const d=document.getElementById('n3pDrawer');return{owner:d?.dataset?.n3pOwner||'',proofOwner:document.documentElement.dataset.navigatorProof||'',openOwner:document.documentElement.dataset.navigatorProofOpen||'',html:(d?.innerHTML||'').slice(0,500)}});
                assert(/Фактология и източници/i.test(proof)&&/Какво стои зад тази страница/i.test(proof),`${client}: evidence drawer incomplete text=${JSON.stringify(proof.slice(0,500))} state=${JSON.stringify(proofState)}`);
                await p.locator('[data-n3p-close]').click();
                await p.waitForFunction(()=>!document.getElementById('n3pDrawer')?.classList.contains('open'),null,{timeout:3000});
                assert(errors.length===0,`${client}: runtime errors ${errors.join(' | ')}`);
                await p.close();
              }
              console.log('NAVIGATOR_3_SIMPLIFIED_BROWSER_QA_OK');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/nav3-browser.cjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/nav3-browser-server.log || true
