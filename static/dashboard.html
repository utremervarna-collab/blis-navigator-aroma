<title>BLIS Navigator</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:258px 1fr}.side{background:linear-gradient(180deg,var(--nav),#0c1d30);color:#fff;padding:22px 15px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:2px 12px 18px;border-bottom:1px solid rgba(255,255,255,.12)}.brand b{font:600 30px Georgia,serif;color:#e2ad46;display:block}.brand small{font-size:9px;letter-spacing:.12em;color:#aebbd0}.homeTop{display:flex;align-items:center;gap:9px;margin:14px 3px 16px;padding:10px 11px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.055);color:#eef4fb;text-decoration:none;font-size:11px;font-weight:700}.homeTop:hover{background:rgba(255,255,255,.1)}.client{margin:0 3px 16px;padding:11px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(255,255,255,.045)}.client label{display:block;font-size:8px;color:#91a5bf;margin-bottom:6px}.client select{width:100%;background:#fff;border:0;border-radius:8px;padding:9px;color:#1c2c44;font-weight:750}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#c9d4e4;text-align:left;padding:10px 11px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:11px;font-weight:650}.nav button:hover,.nav button.active{background:rgba(255,255,255,.11);color:#fff}.navico{width:22px;text-align:center;color:#8fb4ff}.main{min-width:0}.shell{max-width:1500px;margin:auto;padding:22px 28px 42px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}.topbar h1{margin:0;font-size:26px}.topbar p{margin:4px 0 0;color:var(--muted);font-size:11px}.topactions{display:flex;align-items:center;gap:10px}.datebox{border:1px solid #dfe5ee;background:#fff;border-radius:9px;padding:9px 12px;color:#536176;font-size:10px}.status{display:flex;align-items:center;gap:7px;background:#eef8f3;border:1px solid #d5eee1;color:#23684c;padding:9px 11px;border-radius:10px;font-size:10px}.dot{width:7px;height:7px;border-radius:50%;background:#22a06b;box-shadow:0 0 0 5px rgba(34,160,107,.12)}.systembar{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 15px;margin-bottom:16px;box-shadow:0 3px 14px rgba(20,48,92,.024)}.systembar b{font-size:10px}.systembar span{font-size:9px;color:var(--muted)}.build{font-weight:800;color:var(--blue)!important}.page{display:none}.page.active{display:block}.pageTitle{margin-bottom:15px}.pageTitle h2{font-size:21px;margin:0 0 5px}.pageTitle p{font-size:11px;color:var(--muted);margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 3px 14px rgba(20,48,92,.024)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}.panel{padding:18px}.kpiSimple small{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.kpiSimple strong{display:block;font-size:30px;margin:8px 0 3px}.rows{display:grid}.row{display:grid;grid-template-columns:1fr auto;gap:15px;padding:10px 0;border-bottom:1px solid #edf1f6}.row:last-child{border-bottom:0}.row b{font-size:10px}.row p{font-size:9px;color:var(--muted);margin:3px 0 0}.row .v{font-size:10px;font-weight:800}.placeholder{min-height:120px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:10px;border:1px dashed #d9e0e9;border-radius:10px;background:#fafbfd;padding:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #edf0f4;text-align:left;font-size:9px}.table th{color:#66748a;text-transform:uppercase}.btn{border:1px solid #d8dfe8;background:#fff;border-radius:8px;padding:8px 10px;font-size:9px;font-weight:750;cursor:pointer}
/* canonical Overview */
#overview{padding:0 0 42px}.ov-screen{display:grid;gap:17px;color:#122b59}.ov-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}.ov-card{background:#fff;border:1px solid #e1e7f0;border-radius:13px;box-shadow:0 3px 14px rgba(20,48,92,.024);min-width:0}.ov-kpi{padding:17px 18px 15px;min-height:168px;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px}.ov-kpi-head{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:720;color:#243b63;min-height:38px}.ov-ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:0 0 38px}.ov-kpi-value{display:flex;align-items:baseline;gap:4px;margin-left:48px;font-variant-numeric:tabular-nums}.ov-kpi-value strong{font-size:39px;line-height:1;font-weight:720;letter-spacing:-.045em;color:#12294d}.ov-kpi-value small{font-size:10px;color:#8491a5}.ov-delta{margin-left:auto;font-size:10px;font-weight:750;color:#0aa358}.ov-delta.down{color:#e33d3d}.ov-delta.flat{color:#697997}.ov-spark{height:39px;overflow:hidden}.ov-spark svg{width:100%;height:100%;display:block}.ov-kpi-foot{font-size:8.7px;line-height:1.35;color:#8591a4}.ov-row-main{display:grid;grid-template-columns:1.36fr 1fr .92fr;gap:13px}.ov-panel{padding:18px}.ov-panel h3{margin:0;color:#17335c;font-size:12px;font-weight:760}.ov-panel-sub{margin-top:4px;font-size:9px;color:#7c899d}.ov-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}.ov-link{border:0;background:transparent;padding:0;color:#1766e8;font-size:9px;font-weight:720;cursor:pointer}.ov-pill{font-size:8px;font-weight:650;background:#f5f8fc;border:1px solid #e8edf4;border-radius:999px;padding:5px 8px;color:#728097}.ov-trend{height:235px}.ov-trend svg{width:100%;height:100%;display:block}.ov-chart-grid{stroke:#e9eef5;stroke-width:1}.ov-chart-line{fill:none;stroke:#2674f2;stroke-width:2.5}.ov-chart-label{font-size:9px;fill:#74839a}.ov-signal{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #edf1f6}.ov-signal:last-child{border-bottom:0}.ov-signal-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:800}.ov-signal b{display:block;font-size:10px;color:#203a63}.ov-signal small{display:block;font-size:8.5px;color:#7d8a9d;margin-top:3px;line-height:1.4}.ov-prio{font-size:8px;white-space:nowrap;font-weight:650}.ov-prio.high{color:#e33d3d}.ov-prio.medium{color:#f08a00}.ov-prio.good{color:#0aa358}.ov-pulse{display:grid}.ov-pulse-row{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:11px 0;border-bottom:1px solid #edf1f6}.ov-pulse-row:last-child{border-bottom:0}.ov-pulse-time{font-size:8.7px;font-weight:650;color:#5e7396}.ov-pulse-row b{display:block;font-size:9.6px;color:#203a63}.ov-pulse-row small{display:block;font-size:8.4px;color:#7e8a9c;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ov-row-mid{display:grid;grid-template-columns:.86fr .96fr 1.18fr;gap:13px}.clarity-bar-row{margin-bottom:11px}.clarity-bar-label{display:flex;justify-content:space-between;font-size:9px;margin-bottom:5px}.clarity-track{height:7px;background:#edf1f6;border-radius:99px;overflow:hidden}.clarity-track i{display:block;height:100%;background:#2674f2;border-radius:99px}.clarity-explain,.clarity-message{font-size:8.7px;color:#7b889a;margin-top:10px}.clarity-digital{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.clarity-metric small{display:block;font-size:8px;color:#7c899d}.clarity-metric strong{display:block;font-size:25px;margin-top:5px}.clarity-metric em{font-style:normal;font-size:9px;color:#8290a4}.clarity-arrow{color:#8da0b7}.clarity-change{margin-top:13px;padding:10px;border-radius:9px;background:#f5f8fc}.clarity-change small{display:block;font-size:8px;color:#7c899d}.clarity-change strong{font-size:16px}.ov-leading-signals{position:relative;border-color:#d6e4f8;background:linear-gradient(180deg,#fbfdff,#f2f7fd)}.ov-lead-grid{display:grid;gap:8px}.ov-lead-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:9px;align-items:flex-start;padding:10px 11px;border:1px solid #d5e2f4;border-radius:10px;background:rgba(255,255,255,.92)}.ov-lead-num{width:26px;height:26px;border-radius:8px;background:#e9f1fc;color:#1d5ece;display:grid;place-items:center;font-size:10px;font-weight:800}.ov-lead-copy b{display:block;font-size:9.7px}.ov-lead-copy small{display:block;font-size:8.5px;color:#6f8098;line-height:1.4;margin-top:3px}.ov-lead-tag{font-size:7.8px;color:#1d5ece;background:#edf4ff;border-radius:999px;padding:4px 6px}.ov-row-bottom{display:grid;grid-template-columns:1fr 1.18fr;gap:13px}.ov-source-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.ov-source{border:1px solid #e5ebf4;border-radius:10px;padding:11px;min-height:82px;background:#fff}.ov-source b{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ov-source small{display:block;font-size:8px;color:#7e8a9e;margin-top:4px;line-height:1.35}.ov-source-meta{display:flex;gap:6px;margin-top:7px;font-size:7.8px;color:#687993}.ov-no-data{height:100%;min-height:90px;display:grid;place-items:center;text-align:center;color:#7f8da0;font-size:9px;padding:15px}
@media(max-width:1350px){.ov-kpis{grid-template-columns:repeat(3,1fr)}.ov-row-main{grid-template-columns:1fr 1fr}.ov-row-main>.ov-card:last-child{grid-column:1/-1}.ov-row-mid{grid-template-columns:1fr 1fr}.ov-row-mid>.ov-card:last-child{grid-column:1/-1}}@media(max-width:980px){.app{grid-template-columns:210px 1fr}.ov-kpis{grid-template-columns:repeat(2,1fr)}.ov-row-main,.ov-row-mid,.ov-row-bottom{grid-template-columns:1fr}.ov-source-strip{grid-template-columns:repeat(2,1fr)}.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}@media(max-width:720px){.app{display:block}.side{position:relative;height:auto}.nav{grid-template-columns:1fr 1fr}.shell{padding:16px 13px}.topbar{display:block}.topactions{margin-top:10px}.ov-kpis{grid-template-columns:1fr}.ov-kpi-value{margin-left:0}.ov-source-strip{grid-template-columns:1fr}.ov-lead-item{grid-template-columns:26px 1fr}.ov-lead-tag{grid-column:2;justify-self:start}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><b>BLIS™</b><small>BLIS NAVIGATOR</small></div>
<a class="homeTop" href="/">← <span>Начален екран</span></a>
<div class="client"><label>КЛИЕНТСКИ ПРОФИЛ</label><select id="clientSel"><option value="aroma">AROMA</option><option value="bolyarka">Болярка</option><option value="astor-garden">Astor Garden</option></select></div>
<nav id="nav" class="nav"></nav>
</aside>
<main class="main"><div class="shell">
<div class="topbar"><div><h1 id="clientTitle">AROMA</h1><p>BLIS Navigator · Intelligence monitoring environment</p></div><div class="topactions"><button class="datebox">Последните 30 дни ⌄</button><div class="status"><i class="dot"></i><span>Интерфейс и данни активни</span></div></div></div>
<div class="systembar"><div><b>BLIS LIVE · <span id="activeModule">Общ изглед</span></b><br><span id="syncText">Синхронизиране на активните показатели</span></div><span class="build">BUILD 18.08.PREMIUM</span></div>
<section id="overview" class="page active"></section><section id="live" class="page"></section><section id="social" class="page"></section><section id="digital" class="page"></section><section id="reputation" class="page"></section><section id="market" class="page"></section><section id="competition" class="page"></section><section id="signals" class="page"></section><section id="reports" class="page"></section><section id="sources" class="page"></section><section id="history" class="page"></section><section id="timeline" class="page"></section><section id="profile" class="page"></section><section id="settings" class="page"></section><section id="help" class="page"></section>
</div></main></div>
<script>
(function(){'use strict';
const NAV=[['overview','⌂','Общ изглед'],['live','◉','Live Monitoring'],['social','✣','Социални канали'],['digital','◎','Дигитална видимост'],['reputation','◇','Репутация'],['market','↗','Пазарни сигнали'],['competition','⚑','Конкуренти'],['signals','!','Сигнали'],['reports','▤','Месечни доклади'],['sources','▥','Източници на данни'],['history','◷','История'],['timeline','◫','Intelligence Timeline'],['profile','♙','Клиентски профил'],['settings','⚙','Настройки'],['help','?','Помощ']];
const names={aroma:'AROMA',bolyarka:'Болярка','astor-garden':'Astor Garden'};let slug=new URLSearchParams(location.search).get('client')||'aroma';if(!names[slug])slug='aroma';let D={},S=[],H=[],A=[],Q={};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),num=v=>{const n=Number(v);return Number.isFinite(n)?n:null},fmt=v=>v==null?'—':Number(v).toLocaleString('bg-BG',{maximumFractionDigits:1});
function metric(k,obj=D){if(k==='blis')return num(obj?.blis_index);const x=(obj?.indices||[]).find(i=>i.key===k);return x?num(x.value):null}
function series(k){return (H||[]).map(s=>{const p=s.payload||s;const v=metric(k,p);const t=s.created_at||s.observed_at||s.time||s.timestamp;return v==null?null:{date:t?new Date(t).toISOString().slice(0,10):'',value:v}}).filter(Boolean).slice(-30)}
function marketNow(){const c=metric('content'),p=metric('presence'),q=metric('competitive');return [c,p,q].some(v=>v==null)?null:Math.round((c*.4+p*.25+q*.35)*10)/10}
function delta(k){const a=series(k);if(a.length<2)return{txt:'—',cls:'flat'};const d=a[a.length-1].value-a[a.length-2].value;return{txt:`${d>0?'↑':d<0?'↓':'–'} ${Math.abs(d).toFixed(1)}`,cls:d>0?'':d<0?'down':'flat'}}
function spark(k,color){const a=series(k).map(x=>x.value);if(a.length<2)return '<div class="ov-no-data">Историята се натрупва</div>';const w=210,h=42,p=3,min=Math.min(...a),max=Math.max(...a),sp=max-min||1,pts=a.map((v,i)=>`${p+i*(w-2*p)/(a.length-1)},${h-p-(v-min)*(h-2*p)/sp}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.4"/></svg>`}
function kpi(k,label,color,icon,valueOverride){const d=delta(k),v=valueOverride!==undefined?valueOverride:metric(k);return `<div class="ov-card ov-kpi"><div class="ov-kpi-head"><span class="ov-ico" style="background:${color}18;color:${color}">${icon}</span><span>${label}</span></div><div class="ov-kpi-value"><strong>${fmt(v)}</strong><small>/100</small><span class="ov-delta ${d.cls}">${d.txt}</span></div><div class="ov-spark">${spark(k,color)}</div><div class="ov-kpi-foot">текуща стойност · ${series(k).length} дневни точки</div></div>`}
function trend(){const s=series('blis'),a=s.map(x=>x.value);if(a.length<2)return '<div class="ov-no-data">Нужни са поне две дневни BLIS измервания за реална крива.</div>';const w=620,h=220,l=34,r=18,t=16,b=30,x=i=>l+i*(w-l-r)/(a.length-1),y=v=>t+(100-v)*(h-t-b)/100,pts=a.map((v,i)=>`${x(i)},${y(v)}`).join(' '),area=`M ${x(0)} ${h-b} L ${a.map((v,i)=>`${x(i)} ${y(v)}`).join(' L ')} L ${x(a.length-1)} ${h-b} Z`;return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="ovArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2674f2" stop-opacity=".18"/><stop offset="1" stop-color="#2674f2" stop-opacity="0"/></linearGradient></defs>${[0,25,50,75,100].map(v=>`<line class="ov-chart-grid" x1="${l}" y1="${y(v)}" x2="${w-r}" y2="${y(v)}"/><text class="ov-chart-label" x="2" y="${y(v)+3}">${v}</text>`).join('')}<path d="${area}" fill="url(#ovArea)"/><polyline points="${pts}" class="ov-chart-line"/>${a.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="#2674f2"/>`).join('')}</svg>`}
function signalRows(){const s=(D.signals||[]).slice(0,3);if(!s.length)return '<div class="ov-no-data">Няма нови сигнали в текущия период.</div>';return s.map((x,i)=>`<div class="ov-signal"><span class="ov-signal-ico" style="background:${['#e7f7ed','#fdebed','#fff3df'][i]};color:${['#14a05d','#ec3043','#f39200'][i]}">${['↗','↓','◎'][i]}</span><div><b>${esc(x.title||x.label||'Сигнал')}</b><small>${esc(x.description||x.detail||'Промяна в наблюдаваната среда')}</small></div><span class="ov-prio ${i===1?'high':i===2?'medium':'good'}">${i===2?'Среден':'Висок'}</span></div>`).join('')}
function pulse(){let arr=[];(A||[]).slice(0,20).forEach(x=>arr.push({t:x.time||x.observed_at,title:x.metric||'Измерена промяна',txt:x.source||''}));arr=arr.slice(0,5);if(!arr.length)return '<div class="ov-no-data">Няма нови измерени промени.</div>';return arr.map(x=>`<div class="ov-pulse-row"><span class="ov-pulse-time">${x.t?new Date(x.t).toLocaleTimeString('bg-BG',{hour:'2-digit',minute:'2-digit'}):'—'}</span><div><b>${esc(x.title)}</b><small>${esc(x.txt)}</small></div></div>`).join('')}
function competitive(){const arr=(D.competitors||[]).filter(x=>num(x.score)!=null).sort((a,b)=>num(b.score)-num(a.score));if(!arr.length)return '<div class="ov-no-data">Няма достатъчно сравними данни.</div>';const mx=Math.max(...arr.map(x=>num(x.score)||0),1);return arr.slice(0,6).map(x=>`<div class="clarity-bar-row"><div class="clarity-bar-label"><b>${esc(x.name||'Конкурент')}</b><span>${fmt(x.score)}/100</span></div><div class="clarity-track"><i style="width:${Math.max(4,(num(x.score)||0)/mx*100)}%"></i></div></div>`).join('')+'<div class="clarity-explain">Съпоставка по еднакъв набор от публично измерими показатели.</div>'}
function digital(){const a=series('digital'),last=a.length?a[a.length-1].value:metric('digital'),prev=a.length>1?a[a.length-2].value:null,d=last!=null&&prev!=null?last-prev:null;return `<div class="clarity-digital"><div class="clarity-metric"><small>Последен ден</small><strong>${fmt(last)}<em>/100</em></strong></div><div class="clarity-arrow">→</div><div class="clarity-metric"><small>Предходен ден</small><strong>${fmt(prev)}<em>/100</em></strong></div></div><div class="clarity-change"><small>Промяна</small><strong>${d==null?'—':`${d>0?'+':''}${d.toFixed(1)}`}</strong></div><div class="clarity-message">Последна измерена дневна динамика.</div>`}
function leading(){const arr=(D.signals||[]).slice(0,5);if(!arr.length)return '<div class="ov-no-data">Няма нови регистрирани сигнали.</div>';return `<div class="ov-lead-grid">${arr.map((x,i)=>`<div class="ov-lead-item"><span class="ov-lead-num">${i+1}</span><div class="ov-lead-copy"><b>${esc(x.title||x.label||'Наблюдаван сигнал')}</b><small>${esc(x.description||x.detail||'Промяна в наблюдаваната среда')}</small></div></div>`).join('')}</div>`}
function sources(){const arr=(S||[]).slice(0,5);if(!arr.length)return '<div class="ov-no-data">Няма активни източници.</div>';return arr.map(s=>`<div class="ov-source"><b>${esc(s.label||s.name||s.key)}</b><small>${esc(s.method||'Публичен източник')}</small><div class="ov-source-meta"><span>${Math.round((Number(s.reliability)||0)*100)}%</span><span>надеждност</span></div></div>`).join('')}
function renderOverview(){const market=marketNow();return `<div class="ov-screen"><div class="ov-kpis">${kpi('blis','BLIS общ индекс','#2674f2','↗')}${kpi('presence','Социален индекс','#34aa67','◎')}${kpi('digital','Дигитална видимост','#7a4fd7','◉')}${kpi('reputation','Репутационен индекс','#ff7a21','◇')}${kpi('market','Пазарни сигнали','#ef4f79','♡',market)}</div><div class="ov-row-main"><div class="ov-card ov-panel"><div class="ov-head"><div><h3>Тенденция на BLIS индекса</h3><div class="ov-panel-sub">Една реална стойност за всеки календарен ден</div></div><span class="ov-pill">30 дни</span></div><div class="ov-trend">${trend()}</div></div><div class="ov-card ov-panel"><div class="ov-head"><div><h3>Ключови сигнали</h3><div class="ov-panel-sub">Какво изисква внимание</div></div></div>${signalRows()}</div><div class="ov-card ov-panel"><div class="ov-head"><div><h3>BLIS Pulse</h3><div class="ov-panel-sub">Последни реално измерени промени</div></div><span class="ov-pill" style="color:#0a9c57">● LIVE</span></div><div class="ov-pulse">${pulse()}</div></div></div><div class="ov-row-mid"><div class="ov-card ov-panel"><div class="ov-head"><div><h3>Позиция спрямо конкурентите</h3><div class="ov-panel-sub">Съпоставка по наблюдаваните публични показатели</div></div></div>${competitive()}</div><div class="ov-card ov-panel"><div class="ov-head"><div><h3>Промяна в дигиталната видимост</h3><div class="ov-panel-sub">Последен ден спрямо предходния</div></div></div>${digital()}</div><div class="ov-card ov-panel ov-leading-signals"><div class="ov-head"><div><h3>Водещи сигнали</h3><div class="ov-panel-sub">Най-важното за клиента</div></div></div>${leading()}</div></div><div class="ov-row-bottom"><div class="ov-card ov-panel"><div class="ov-head"><div><h3>Активни източници</h3><div class="ov-panel-sub">Проверени публични канали</div></div></div><div class="ov-source-strip">${sources()}</div></div><div class="ov-card ov-panel"><div class="ov-head"><div><h3>Аналитичен контекст</h3><div class="ov-panel-sub">Обобщение на текущата картина</div></div></div><div style="font-size:10px;line-height:1.65;color:#617187">BLIS обединява текущите измервания, историята, конкурентния контекст и активните сигнали в една последователна картина. Стойностите се обновяват от наличните публични източници и не се допълват с фиктивни данни.</div></div></div></div>`}
function title(t,s){return `<div class="pageTitle"><h2>${esc(t)}</h2><p>${esc(s)}</p></div>`}function rows(items){return `<div class="rows">${items.map(x=>`<div class="row"><div><b>${esc(x[0])}</b><p>${esc(x[1]||'')}</p></div><div class="v">${esc(x[2]||'')}</div></div>`).join('')}</div>`}function srcRows(n=10){return S.length?rows(S.slice(0,n).map(x=>[x.label,x.method||'', 'Активен'])):'<div class="placeholder">Няма налични източници.</div>'}function simple(t,s,body){return title(t,s)+`<div class="card panel">${body}</div>`}
const R={overview:renderOverview,live:()=>simple('Live Monitoring','Текущ статус на източниците и постъпващите измервания.',srcRows(15)),social:()=>simple('Социални канали','Публични профили, съдържание и активност.',srcRows(12)),digital:()=>simple('Дигитална видимост','Сайт, търсене и публична онлайн видимост.',rows([['Дигитален индекс','Текуща стойност',fmt(metric('digital'))],['Съдържание','Индекс /100',fmt(metric('content'))]])),reputation:()=>simple('Репутация','Оценки, мнения и публични репутационни сигнали.',rows([['Репутационен индекс','Текуща стойност',fmt(metric('reputation'))]])),market:()=>simple('Пазарни сигнали','Динамика на интереса и пазарния контекст.',signalRows()),competition:()=>simple('Конкуренти','Съпоставка с наблюдаваните конкурентни марки.',competitive()),signals:()=>simple('Сигнали','Активни отклонения, рискове и възможности.',leading()),reports:()=>simple('Месечни доклади','Архив и генериране на аналитични доклади.','<div class="placeholder">Докладите се подготвят в отделен аналитичен цикъл.</div>'),sources:()=>simple('Източници на данни','Активни публични и референтни източници.',srcRows(30)),history:()=>simple('История','Натрупани дневни измервания и snapshots.',`<div class="placeholder">Налични snapshots: ${H.length}</div>`),timeline:()=>simple('Intelligence Timeline','Хронология на значими измерени промени.',pulse()),profile:()=>simple('Клиентски профил','Основна информация за активния клиент.',rows([['Клиент',names[slug],'Активен'],['Профил',slug,'BLIS']])),settings:()=>simple('Настройки','Настройки на визуализацията и профила.','<div class="placeholder">Настройките не влияят на събирането на данни.</div>'),help:()=>simple('Помощ','Кратко ръководство за работа с Navigator.','<div class="placeholder">Използвай менюто вляво за преминаване между аналитичните модули.</div>')};
function render(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));$('activeModule').textContent=(NAV.find(x=>x[0]===id)||[])[2]||'';$(id).innerHTML=(R[id]||R.help)();history.replaceState(null,'',`?client=${encodeURIComponent(slug)}#${id}`)}
function buildNav(){const n=$('nav');n.innerHTML=NAV.map((x,i)=>`<button type="button" data-page="${x[0]}" class="${i?'':'active'}"><span class="navico">${x[1]}</span><span>${x[2]}</span></button>`).join('');n.onclick=e=>{const b=e.target.closest('button[data-page]');if(b)render(b.dataset.page)}}
async function get(url){const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);try{const r=await fetch(url,{cache:'no-store',signal:c.signal});return r.ok?await r.json():null}catch(e){return null}finally{clearTimeout(t)}}
async function load(){const base=`/api/clients/${slug}`;const [d,s,h,a,q]=await Promise.all([get(base+'/dashboard'),get(base+'/sources'),get(base+'/history'),get(base+'/activity'),get(base+'/data-quality')]);D=d||{};S=Array.isArray(s)?s:[];H=Array.isArray(h)?h:[];A=Array.isArray(a)?a:[];Q=q||{};$('syncText').textContent=d?'Данните са синхронизирани':'Интерфейсът е активен · част от данните не са достъпни';render((location.hash||'#overview').slice(1))}
$('clientSel').value=slug;$('clientTitle').textContent=names[slug];$('clientSel').onchange=e=>{location.href=`/dashboard.html?client=${encodeURIComponent(e.target.value)}#overview`};buildNav();render((location.hash||'#overview').slice(1));load();
})();
</script>
</body></html>
