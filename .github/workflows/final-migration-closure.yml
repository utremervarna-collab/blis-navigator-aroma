name: Navigator Final Migration Closure

on:
  push:
    branches: [main]
    paths:
      - 'static/migration-build.js'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  FINAL_BUILD: code-run-migration-2026-09-09-final-v2

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read durable floors
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 20 --max-time 90 \
            "https://raw.githubusercontent.com/utremervarna-collab/blis-navigator-aroma/runtime-data/data/live_store.json?ts=$(date +%s)" \
            -o /tmp/runtime-floor.json
          curl -fsSL --connect-timeout 20 --max-time 90 \
            "https://raw.githubusercontent.com/utremervarna-collab/blis-navigator-aroma/main/data/live_store.json?ts=$(date +%s)" \
            -o /tmp/main-floor.json
          python - <<'PY'
          import json
          runtime=json.load(open('/tmp/runtime-floor.json',encoding='utf-8'))
          main=json.load(open('/tmp/main-floor.json',encoding='utf-8'))
          rc=runtime.get('clients',{})
          mc=main.get('clients',{})
          kub=rc.get('kub')
          assert kub is not None, 'runtime-data has no KUB persistence record'
          kub_floor=sum(1 for o in kub.get('observations',[]) if o.get('source_key')=='signal_collector' and str(o.get('metric_key','')).startswith('signal_event_'))
          assert kub_floor>0, 'runtime-data has no durable KUB signals'
          for slug in ('aroma','bolyarka','mollox','astor-garden'):
              assert slug in mc, f'{slug} missing from main durable floor'
          counts={k:{'snapshots':len(v.get('snapshots',[])),'observations':len(v.get('observations',[]))} for k,v in mc.items()}
          open('/tmp/kub_floor.txt','w',encoding='utf-8').write(str(kub_floor))
          json.dump(counts,open('/tmp/main-floor-counts.json','w',encoding='utf-8'),separators=(',',':'),sort_keys=True)
          print('KUB_FLOOR',kub_floor)
          print('MAIN_FLOOR',json.dumps(counts,separators=(',',':'),sort_keys=True))
          PY

      - name: Wait for exact final production build
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 15 --max-time 45 "$BASE/migration-build.js?final=1&ts=$(date +%s)" -o /tmp/build.js; then
              if grep -Fq "window.__BLIS_MIGRATION_BUILD__='${FINAL_BUILD}'" /tmp/build.js; then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" = "1"

      - name: Prove cold-start durable store restore
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          KUB_FLOOR=$(cat /tmp/kub_floor.txt)
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 15 --max-time 90 "$BASE/api/store/export?cold=1&ts=$(date +%s)" -o /tmp/cold-live.json; then
              if python - "$KUB_FLOOR" <<'PY'
          import json,sys
          kub_floor=int(sys.argv[1])
          main_floor=json.load(open('/tmp/main-floor-counts.json',encoding='utf-8'))
          live=json.load(open('/tmp/cold-live.json',encoding='utf-8')).get('clients',{})
          for slug,f in main_floor.items():
              c=live.get(slug)
              assert c is not None, f'{slug} missing after cold deploy'
              assert len(c.get('snapshots',[]))>=f['snapshots'], (slug,'snapshots',len(c.get('snapshots',[])),f['snapshots'])
              assert len(c.get('observations',[]))>=f['observations'], (slug,'observations',len(c.get('observations',[])),f['observations'])
          kub=live.get('kub')
          assert kub is not None, 'KUB persistence record missing after cold deploy'
          n=sum(1 for o in kub.get('observations',[]) if o.get('source_key')=='signal_collector' and str(o.get('metric_key','')).startswith('signal_event_'))
          assert n>=kub_floor, (n,kub_floor)
          print('COLD_START_STORE_RESTORE_OK',{'kub_signal_observations':n,'floor':kub_floor})
          PY
              then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Prove final health and KUB access isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          curl -fsS "$BASE/api/health?final=1&ts=$(date +%s)" -o /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          code=$(curl -sS -o /tmp/kub-signals.json -w '%{http_code}' "$BASE/api/signals?client=kub&limit=3&final=1&ts=$(date +%s)")
          test "$code" = "401" -o "$code" = "403"
          echo 'NAVIGATOR_FINAL_MIGRATION_HEALTH_OK'

      - name: Prove unsupported manual refresh is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          curl -sS -c /tmp/wirello.cookies "$BASE/wirello?final=1&ts=$(date +%s)" -o /tmp/wirello.html
          code=$(curl -sS -b /tmp/wirello.cookies -X POST -o /tmp/wirello-refresh.json -w '%{http_code}' "$BASE/api/clients/wirello/refresh?final=1&ts=$(date +%s)")
          test "$code" = "409"
          grep -Fq 'metric engine unavailable for this client' /tmp/wirello-refresh.json
          echo 'UNSUPPORTED_MANUAL_REFRESH_FAIL_CLOSED_OK'

      - name: Publish final migration status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const state='${{ job.status }}'==='success'?'success':'failure';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'navigator-final-migration',description:state==='success'?'full migration closure passed':'full migration closure failed'});
