<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BLIS Navigator — Общ вход за клиенти</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f6f8fb;color:#17324c}body{min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(135deg,#fff 0%,#f5f8fb 65%,#eef3f7 100%)}.wrap{width:min(100%,430px)}.brand{text-align:center;margin-bottom:26px}.brand strong{display:block;font:600 38px/1 Georgia,serif;color:#153652}.brand span{display:block;margin-top:8px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#708095}.card{background:#fff;border:1px solid #e0e6ec;border-radius:18px;padding:34px;box-shadow:0 24px 70px rgba(20,48,73,.12)}.neutral{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid #d7e5ef;border-radius:999px;background:#f4f9fc;color:#41657f;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:13px}.neutral i{width:6px;height:6px;border-radius:50%;background:#53a978}h1{font:500 28px/1.15 Georgia,serif;margin:0 0 8px;color:#153652}.sub{font-size:12px;line-height:1.55;color:#718196;margin:0 0 20px}.field{margin:0 0 15px}.field label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#52677b;margin-bottom:7px}.field input{width:100%;height:48px;border:1px solid #d7e0e8;border-radius:9px;padding:0 13px;font-size:14px;outline:none;background:#fff;color:#17324c}.field input:focus{border-color:#2e6f9d;box-shadow:0 0 0 3px rgba(46,111,157,.10)}button{width:100%;height:50px;border:0;border-radius:9px;background:#153652;color:#fff;font-weight:800;cursor:pointer;margin-top:4px}button:hover{background:#1d4769}.back{display:block;text-align:center;margin-top:18px;color:#60788c;font-size:11px;text-decoration:none}.lock{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:20px;color:#8593a1;font-size:9px}.lock i{width:6px;height:6px;border-radius:50%;background:#53a978}.note{font-size:10px;line-height:1.5;color:#8593a1;margin:0 0 17px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><strong>BLIS™</strong><span>Brand Lab Intelligence System</span></div>
  <div class="card">
    <div class="neutral"><i></i> Неутрален достъп</div>
    <h1>Общ вход за клиенти</h1>
    <p class="sub">Въведете предоставените от Brand Lab данни за достъп до профила на вашата организация.</p>
    <p class="note">Тази страница не избира и не възстановява автоматично клиентски профил.</p>
    <form id="clientAccessV2" method="post" action="/api/client-login" autocomplete="off">
      <input type="hidden" id="realUsername" name="username" value="">
      <input type="hidden" id="realPassword" name="password" value="">
      <div class="field"><label for="accessUser">Потребителско име</label><input id="accessUser" name="access_user_v2" type="text" value="" autocomplete="off" autocapitalize="none" spellcheck="false" readonly required></div>
      <div class="field"><label for="accessKey">Парола</label><input id="accessKey" name="access_key_v2" type="password" value="" autocomplete="new-password" readonly required></div>
      <button type="submit">Вход в Navigator</button>
    </form>
    <div class="lock"><i></i> Защитена клиентска сесия</div>
  </div>
  <a class="back" href="/">← Към началната страница</a>
</div>
<script>
(function(){
  const u=document.getElementById('accessUser'),p=document.getElementById('accessKey'),f=document.getElementById('clientAccessV2');
  function unlock(el){el.removeAttribute('readonly');el.value='';}
  u.addEventListener('focus',()=>unlock(u),{once:true});
  p.addEventListener('focus',()=>unlock(p),{once:true});
  f.addEventListener('submit',function(e){
    document.getElementById('realUsername').value=u.value.trim();
    document.getElementById('realPassword').value=p.value;
    if(!u.value.trim()||!p.value){e.preventDefault();return;}
  });
})();
</script>
</body>
</html>
