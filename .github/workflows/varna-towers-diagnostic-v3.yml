name: Varna Towers Diagnostic v3
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Start Navigator
        run: |
          PORT=10000 go run . >/tmp/blis.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10000/dashboard.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/blis.log
          exit 1
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify all Varna Towers screens
        run: |
          cat > vt-final.cjs <<'NODE'
          const { chromium }=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const p=await b.newPage({viewport:{width:1500,height:1100}});const errs=[];p.on('pageerror',e=>errs.push(e.message));
            await p.goto('http://127.0.0.1:10000/dashboard.html?client=varna-towers',{waitUntil:'domcontentloaded'});await p.waitForTimeout(3500);
            const st=await p.evaluate(()=>({slug,name:D?.name,blis:D?.blis_index,idx:D?.indices?.length,cmp:D?.competitors?.length,src:S?.length,act:A?.length,client:document.querySelector('.client-brand-name')?.textContent,theme:document.body.dataset.client,market:document.querySelector('#nav button[data-page="market"] span:last-child')?.textContent}));console.log('STATE',st);
            if(st.slug!=='varna-towers'||st.name!=='Varna Towers'||st.blis!==81||st.idx<7||st.cmp<5||st.src!==28||st.act!==25||st.client!=='Varna Towers'||st.theme!=='varna-towers'||st.market!=='Пазарни сигнали')throw new Error('Base state failed '+JSON.stringify(st));
            const checks={overview:['Varna Towers','81.0','70%','8%','Business Park Varna'],social:['LinkedIn','Native reach / engagement'],digital:['88.0','Google Business','varnatowers.bg'],reputation:['3.9 /5','349','Несъответствие'],market:['70%','8%','15 074','30+'],competition:['Business Park Varna','Varna 115','Landmark Centre','Chayka Center','Varna Towers'],signals:['Несъответствие в Google Business статуса','Ниска публично заявена запълняемост'],profile:['81 506','47 604','18 537','29 067','15 074','600','3.9/5','349']};
            for(const [id,needles] of Object.entries(checks)){
              if(id!=='overview'){await p.locator(`#nav button[data-page="${id}"]`).click({force:true});await p.waitForTimeout(350)}
              const target=id==='overview'?'#overviewPremium':`#${id}Body`;const txt=await p.locator(target).innerText();console.log(id,txt.slice(0,350));for(const n of needles)if(!txt.includes(n))throw new Error(id+' missing '+n);if(txt.includes('AROMA')||txt.includes('811'))throw new Error('Foreign client data leaked in '+id);
            }
            await p.locator('#nav button[data-page="sources"]').click({force:true});await p.waitForTimeout(350);const srcTxt=await p.locator('#sourcesBody').innerText();if(!srcTxt.includes('28'))throw new Error('Sources not 28');
            await p.locator('#nav button[data-page="live"]').click({force:true});await p.waitForTimeout(700);const live=await p.evaluate(()=>({activity:!!document.querySelector('.lm-live-card .lm-live-stage'),geo:!!document.querySelector('.lm-geo-card'),statuses:[...document.querySelectorAll('.lm-tablewrap .lm-status')].map(x=>x.textContent.trim())}));if(!live.activity||!live.geo||live.statuses.some(x=>x!=='● Активен'))throw new Error('Live regression '+JSON.stringify(live));
            if(errs.length)throw new Error('Page errors '+errs.join(' | '));await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node vt-final.cjs
