name: Navigator Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  MIGRATION_BUILD: code-run-migration-2026-09-09-v1

jobs:
  local-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and start Navigator gateway
        run: |
          set -euxo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app >/tmp/blis-smoke-server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:10000/api/health >/tmp/health.json && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/api/health
          curl -fsS http://127.0.0.1:10000/migration-build.js -o /tmp/build.js
          grep -q "$MIGRATION_BUILD" /tmp/build.js

      - name: Verify public read-only gateway contracts
        run: |
          set -euo pipefail
          test "$(curl -sS -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:10000/client-login)" = "200"
          test "$(curl -sS -o /tmp/aroma.html -w '%{http_code}' 'http://127.0.0.1:10000/dashboard.html?client=aroma&page=overview')" = "200"
          test "$(curl -sS -o /tmp/aroma.json -w '%{http_code}' 'http://127.0.0.1:10000/api/clients/aroma/dashboard')" = "200"
          code=$(curl -sS -D /tmp/kub.headers -o /tmp/kub.body -w '%{http_code}' 'http://127.0.0.1:10000/dashboard.html?client=kub&page=overview')
          test "$code" = "302"
          grep -Eqi '^location: /kub-crisis\.html' /tmp/kub.headers
          test "$(curl -sS -o /tmp/admin.body -w '%{http_code}' http://127.0.0.1:10000/admin.html)" = "404"
          test "$(curl -sS -o /tmp/refresh.body -w '%{http_code}' -X POST http://127.0.0.1:10000/api/clients/wirello/refresh)" = "409"
          curl -fsS http://127.0.0.1:10000/kub-home.html | grep -q 'Корпорация КУБ'
          curl -fsS http://127.0.0.1:10000/wirello | grep -Eqi 'Wirello'
          echo GATEWAY_CONTRACT_OK

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Verify Navigator routes and catalogue in a real browser
        run: |
          cat >/tmp/navigator-smoke.cjs <<'NODE'
          const {chromium}=require(process.env.GITHUB_WORKSPACE+'/node_modules/playwright');
          const fs=require('fs');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const origin='http://127.0.0.1:10000';
          const clients=['aroma','bolyarka','mollox','varna-towers','everbet','astor-garden'];
          const names={aroma:'Aroma',bolyarka:'Болярка',mollox:'MOLLOX','varna-towers':'Varna Towers',everbet:'Everbet','astor-garden':'Astor Garden'};
          const visible='kub,mollox,aroma,bolyarka,wirello';
          let phase='startup';
          const watchdog=setTimeout(()=>{console.error('watchdog',phase);process.exit(2)},150000);
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const client of clients){
                phase=`${client}:open`;
                const p=await browser.newPage({viewport:{width:1440,height:1000}});
                const errors=[];
                p.on('pageerror',e=>errors.push(`PAGEERROR ${e.message}`));
                p.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource|ERR_NAME_NOT_RESOLVED|net::ERR_/i.test(m.text()))errors.push(`CONSOLE ${m.text()}`)});
                await p.goto(`${origin}/dashboard.html?client=${client}&page=overview`,{waitUntil:'domcontentloaded',timeout:25000});
                await p.waitForFunction(()=>window.BLISClientUIV5&&Array.isArray(window.BLIS_VISIBLE_CLIENTS)&&document.querySelector('.page.active'),null,{timeout:25000});
                await p.waitForFunction(()=>document.body.dataset.blisLoading!=='true',null,{timeout:15000});
                const boot=await p.evaluate(()=>({
                  client:document.body.dataset.client||'',
                  name:document.querySelector('.bch3-name')?.textContent||document.querySelector('.client-brand-name')?.textContent||'',
                  nav:[...document.querySelectorAll('#nav button[data-page]')].map(x=>x.dataset.page),
                  visible:[...(window.BLIS_VISIBLE_CLIENTS||[])],
                  menu:[...document.querySelectorAll('.client-switch-menu .client-option[data-client-key]')].map(x=>x.dataset.clientKey),
                  services:!!document.querySelector('[data-blis-commerce-open],#commerce,.blis-commerce-launch'),
                  lang:document.documentElement.lang,
                  language:window.BLIS_LANGUAGE
                }));
                console.log('NAV_RUNTIME',client,JSON.stringify(boot));
                assert(boot.client===client,`${client}: body client ${boot.client}`);
                assert(boot.name.includes(names[client]),`${client}: identity ${boot.name}`);
                assert(boot.visible.join(',')===visible,`${client}: visible registry ${boot.visible}`);
                assert(boot.menu.join(',')===visible,`${client}: selector ${boot.menu}`);
                assert(!boot.services,`${client}: Services leaked`);
                assert(boot.lang==='bg'&&boot.language==='bg',`${client}: BG default missing`);
                assert(new Set(boot.nav).size===boot.nav.length,`${client}: duplicate routes`);
                for(const required of ['overview','social','market','competition','history']) assert(boot.nav.includes(required),`${client}: missing ${required}`);

                for(const id of boot.nav){
                  phase=`${client}:${id}`;
                  const active=await p.locator('.page.active').getAttribute('id');
                  if(active!==id){
                    const button=p.locator(`#nav button[data-page="${id}"]:visible`).first();
                    assert(await button.count()===1,`${client}/${id}: no visible nav control`);
                    await button.click({timeout:10000});
                    await p.waitForFunction(x=>document.querySelector('.page.active')?.id===x,id,{timeout:10000});
                  }
                  await p.waitForTimeout(250);
                  const state=await p.evaluate(id=>{
                    const root=document.getElementById(id),r=root?.getBoundingClientRect(),cs=root&&getComputedStyle(root),text=(root?.innerText||'').trim();
                    return {active:document.querySelector('.page.active')?.id,text:text.length,height:r?.height||0,visible:!!root&&cs.display!=='none'&&cs.visibility!=='hidden',overflow:Math.max(0,document.documentElement.scrollWidth-window.innerWidth),loading:/\bLoading\b|Зареждане\.{2,}/i.test(text)};
                  },id);
                  assert(state.active===id,`${client}/${id}: active=${state.active}`);
                  assert(state.visible&&state.height>70&&state.text>20,`${client}/${id}: blank ${JSON.stringify(state)}`);
                  assert(!state.loading,`${client}/${id}: loading remained`);
                  assert(state.overflow<=12,`${client}/${id}: overflow ${state.overflow}`);
                }
                assert(errors.length===0,`${client}: ${errors.join(' | ')}`);
                await p.close();
              }
              clearTimeout(watchdog);
              console.log('NAVIGATOR_BROWSER_SMOKE_OK');
            } finally {await browser.close();}
          })().catch(e=>{try{fs.writeFileSync('/tmp/navigator-smoke-error.txt',`${phase}: ${e.message||e}`)}catch(_){};console.error(phase,e);process.exit(1)});
          NODE
          node /tmp/navigator-smoke.cjs

      - name: Show diagnostics on failure
        if: failure()
        run: |
          cat /tmp/navigator-smoke-error.txt || true
          cat /tmp/blis-smoke-server.log || true

  production-origin:
    needs: local-regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for migration build on canonical production
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          ok=0
          for i in $(seq 1 42); do
            if curl -fsS --connect-timeout 15 --max-time 30 "$BASE/migration-build.js?ts=$(date +%s)" -o /tmp/build.js && grep -q "$MIGRATION_BUILD" /tmp/build.js; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"

      - name: Verify live code.run migration contracts
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          curl -fsS "$BASE/api/health?ts=$(date +%s)" -o /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          curl -fsS "$BASE/api/store/export?ts=$(date +%s)" -o /tmp/store.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/store.json',encoding='utf-8'))
          clients=d.get('clients',{})
          for slug in ('aroma','bolyarka','mollox','astor-garden'):
              assert slug in clients, f'{slug} missing from production store'
          print('STORE_OK', {k:(len(v.get('snapshots',[])),len(v.get('observations',[]))) for k,v in clients.items()})
          PY
          test "$(curl -sS -o /tmp/aroma.html -w '%{http_code}' "$BASE/dashboard.html?client=aroma&page=overview&ts=$(date +%s)")" = "200"
          test "$(curl -sS -o /tmp/aroma.json -w '%{http_code}' "$BASE/api/clients/aroma/dashboard?ts=$(date +%s)")" = "200"
          code=$(curl -sS -D /tmp/kub.headers -o /tmp/kub.body -w '%{http_code}' "$BASE/dashboard.html?client=kub&page=overview&ts=$(date +%s)")
          test "$code" = "302"
          grep -Eqi '^location: /kub-crisis\.html' /tmp/kub.headers
          code=$(curl -sS -o /tmp/kub-signals.json -w '%{http_code}' "$BASE/api/signals?client=kub&limit=3&ts=$(date +%s)")
          test "$code" = "401" -o "$code" = "403"
          curl -fsS "$BASE/wirello?ts=$(date +%s)" | grep -Eqi 'Wirello'
          echo NAVIGATOR_CODE_RUN_PRODUCTION_OK

      - name: Publish production migration status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state='${{ job.status }}'==='success'?'success':'failure';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'navigator-code-run-production',description:state==='success'?'code.run production migration passed':'code.run production migration failed'});
