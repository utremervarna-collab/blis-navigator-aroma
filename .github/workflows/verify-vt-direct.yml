name: Verify Varna Towers Direct Hero
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify direct JPEG in production
        run: |
          cat > verify.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            let last='';
            for(let i=1;i<=30;i++){
              const page=await browser.newPage({viewport:{width:1680,height:720},deviceScaleFactor:1});
              try{
                await page.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=varna-towers',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(1800);
                const state=await page.evaluate(async()=>{
                  const el=document.querySelector('.topbar .client-photo-bg');
                  const cs=el?getComputedStyle(el):null;
                  const r=el?el.getBoundingClientRect():null;
                  let image={ok:false,width:0,height:0,error:''};
                  try{
                    const im=new Image();
                    im.src='/varna-towers-profile-hero-header-v2.jpg?v=20260818-direct';
                    await im.decode();
                    image={ok:true,width:im.naturalWidth,height:im.naturalHeight,error:''};
                  }catch(e){image.error=e.message}
                  return {
                    client:document.body.dataset.client,
                    ready:el?.dataset.varnaTowersHero||'',
                    bg:cs?.backgroundImage||'',
                    size:cs?.backgroundSize||'',
                    pos:cs?.backgroundPosition||'',
                    opacity:cs?.opacity||'',
                    w:r?.width||0,h:r?.height||0,
                    image
                  };
                });
                console.log('ATTEMPT',i,JSON.stringify(state));
                const ok=state.client==='varna-towers'&&state.ready==='ready-direct'&&state.bg.includes('varna-towers-profile-hero-header-v2.jpg')&&state.image.ok&&state.image.width===1456&&state.image.height===167&&state.opacity==='1'&&state.w>1200&&state.h>150;
                if(!ok)throw new Error('direct hero not live yet');
                await page.locator('.topbar').screenshot({path:'varna-towers-direct.png'});
                await page.close();await browser.close();return;
              }catch(e){last=e.message;console.log('RETRY',i,last);await page.close();if(i<30)await new Promise(r=>setTimeout(r,10000));}
            }
            await browser.close();throw new Error(last||'verification failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: varna-towers-direct
          path: varna-towers-direct.png
