name: Navigator Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  MIGRATION_BUILD: code-run-migration-2026-09-09-v1

jobs:
  local-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify public full client catalogue contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('static/navigator-client-ui.js','utf8');
          const m=src.match(/const ownerVisibleOrder=(\[[^;]+\]);/);
          if(!m) throw new Error('ownerVisibleOrder missing');
          const actual=Function(`return ${m[1]}`)();
          const expected=['aroma','bolyarka','mollox','wirello','astor-garden','varna-towers','everbet','black-sea-center','kub'];
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`public client catalogue mismatch ${JSON.stringify(actual)}`);
          for(const required of expected){
            if(!actual.includes(required)) throw new Error(`${required} missing from public client catalogue`);
          }
          if(!/kub:\{/.test(src)) throw new Error('KUB registry entry missing');
          if(!/'varna-towers':\{/.test(src)) throw new Error('Varna Towers registry entry missing');
          if(!/function visibleOrder\(\)\{return ownerVisibleOrder\.slice\(\)\}/.test(src)) throw new Error('full public visibleOrder contract missing');
          console.log('PUBLIC_CLIENT_CATALOGUE_OK',actual.join(','));
          NODE
          node --check static/navigator-client-ui.js
          node --check static/kub-client-stabilizer-v1.js
          grep -q "2026-09-10T00:00:00+03:00" static/kub-live-feed-v3.js
          grep -q "Радио Варна / БНР" static/kub-live-feed-v3.js
          grep -q "Парламентът отхвърли искане за изслушване относно корпорация КУБ" static/kub-live-feed-v3.js
          ! grep -q "refreshMonitoring" static/kub-client-stabilizer-v1.js
          ! grep -q "feed.innerHTML" static/kub-client-stabilizer-v1.js
          grep -q "Monitoring feed ownership belongs exclusively to kub-live-feed-v3.js" static/kub-client-stabilizer-v1.js

      - name: Build and start Navigator gateway
        run: |
          set -euxo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app > /tmp/blis-smoke-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10000/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/api/health
          curl -fsS http://127.0.0.1:10000/migration-build.js -o /tmp/build.js
          grep -q "$MIGRATION_BUILD" /tmp/build.js

      - name: Verify public gateway access contracts
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:10000/client-login)
          test "$code" = "200"
          for client in aroma bolyarka mollox wirello astor-garden varna-towers everbet black-sea-center; do
            code=$(curl -sS -D /tmp/$client.headers -o /tmp/$client.body -w '%{http_code}' "http://127.0.0.1:10000/dashboard.html?client=$client&page=overview")
            test "$code" = "200"
            ! grep -qi 'client-login' /tmp/$client.body
            code=$(curl -sS -o /tmp/$client.json -w '%{http_code}' "http://127.0.0.1:10000/api/clients/$client/dashboard")
            test "$code" = "200"
          done
          code=$(curl -sS -D /tmp/kub.headers -o /tmp/kub.body -w '%{http_code}' 'http://127.0.0.1:10000/dashboard.html?client=kub&page=overview')
          test "$code" = "302"
          grep -Eqi '^location: /kub-crisis\.html' /tmp/kub.headers
          curl -fsS http://127.0.0.1:10000/kub-home.html -o /tmp/kub-home.html
          grep -q 'Корпорация КУБ' /tmp/kub-home.html
          curl -fsS 'http://127.0.0.1:10000/kub-crisis.html?lang=en' -o /tmp/kub-en.html
          grep -Eqi 'KUB|crisis' /tmp/kub-en.html

  production-origin:
    needs: local-regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for exact migration build
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          ok=0
          for i in $(seq 1 42); do
            if curl -fsS --connect-timeout 15 --max-time 30 "$BASE/migration-build.js?ts=$(date +%s)" -o /tmp/build.js && grep -q "$MIGRATION_BUILD" /tmp/build.js; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"

      - name: Verify live code.run public-client and KUB contracts
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          curl -fsS "$BASE/api/health?ts=$(date +%s)" -o /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          curl -fsS "$BASE/api/store/export?ts=$(date +%s)" -o /tmp/store.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/store.json',encoding='utf-8'))
          clients=d.get('clients',{})
          for slug in ('aroma','bolyarka','mollox'):
              assert slug in clients, f'{slug} missing from production store'
          print('ACTIVE_STORE_OK', {k:(len(clients[k].get('snapshots') or []),len(clients[k].get('observations') or [])) for k in ('aroma','bolyarka','mollox')})
          PY
          code=$(curl -sS -o /tmp/login.html -w '%{http_code}' "$BASE/client-login?ts=$(date +%s)")
          test "$code" = "200"
          for client in aroma bolyarka mollox wirello astor-garden varna-towers everbet black-sea-center; do
            code=$(curl -sS -o /tmp/$client.body -w '%{http_code}' "$BASE/dashboard.html?client=$client&page=overview&ts=$(date +%s)")
            test "$code" = "200"
            ! grep -qi 'client-login' /tmp/$client.body
            code=$(curl -sS -o /tmp/$client.json -w '%{http_code}' "$BASE/api/clients/$client/dashboard?ts=$(date +%s)")
            test "$code" = "200"
          done
          curl -fsS "$BASE/kub-home.html?ts=$(date +%s)" -o /tmp/kub-home.html
          grep -q 'Корпорация КУБ' /tmp/kub-home.html
          code=$(curl -sS -D /tmp/kub.headers -o /tmp/kub.body -w '%{http_code}' "$BASE/dashboard.html?client=kub&page=overview&ts=$(date +%s)")
          test "$code" = "302"
          grep -Eqi '^location: /kub-crisis\.html' /tmp/kub.headers

          # KUB signal data remains protected from unauthenticated traffic.
          code=$(curl -sS -o /tmp/kub-health.json -w '%{http_code}' "$BASE/api/signals/health?client=kub&ts=$(date +%s)")
          test "$code" = "401" -o "$code" = "403"
          code=$(curl -sS -o /tmp/kub-signals.json -w '%{http_code}' "$BASE/api/signals?client=kub&limit=3&ts=$(date +%s)")
          test "$code" = "401" -o "$code" = "403"

          curl -fsS "$BASE/navigator-client-ui.js?ts=$(date +%s)" -o /tmp/client-ui.js
          grep -Fq "const ownerVisibleOrder=['aroma','bolyarka','mollox','wirello','astor-garden','varna-towers','everbet','black-sea-center','kub'];" /tmp/client-ui.js
          grep -Fq "function visibleOrder(){return ownerVisibleOrder.slice()}" /tmp/client-ui.js
          grep -Fq "async function select(key){if(!valid(key))return;" /tmp/client-ui.js

          # Verify the actual production KUB Monitoring renderer includes the restored backfill.
          curl -fsS "$BASE/kub-live-feed-v3.js?ts=$(date +%s)" -o /tmp/kub-feed.js
          grep -q "2026-09-10T00:00:00+03:00" /tmp/kub-feed.js
          grep -q "Радио Варна / БНР" /tmp/kub-feed.js
          grep -q "Парламентът отхвърли искане за изслушване относно корпорация КУБ" /tmp/kub-feed.js
          grep -q "2026-09-09T14:58:00+03:00" /tmp/kub-feed.js

          # The legacy KUB stabilizer must never overwrite the canonical Monitoring feed.
          curl -fsS "$BASE/kub-client-stabilizer-v1.js?ts=$(date +%s)" -o /tmp/kub-stabilizer.js
          ! grep -q "refreshMonitoring" /tmp/kub-stabilizer.js
          ! grep -q "feed.innerHTML" /tmp/kub-stabilizer.js
          grep -q "Monitoring feed ownership belongs exclusively to kub-live-feed-v3.js" /tmp/kub-stabilizer.js
          echo 'KUB_SINGLE_FEED_OWNER_PRODUCTION_OK'
          echo 'KUB_BACKFILL_PRODUCTION_OK'
          echo 'NAVIGATOR_CODE_RUN_PRODUCTION_OK'

      - name: Publish production migration status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state='${{ job.status }}'==='success'?'success':'failure';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'navigator-code-run-production',description:state==='success'?'public full clients + KUB production passed':'public full clients + KUB production failed'});
