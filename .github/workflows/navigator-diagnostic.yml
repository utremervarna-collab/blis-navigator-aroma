name: Navigator Social v6 Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build and start Navigator
        run: |
          set -euxo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app > /tmp/blis-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:10000/dashboard.html?client=aroma&page=social' >/tmp/dashboard.html
          grep -q 'navigator-social-master.js?v=20260819-socialmaster6' /tmp/dashboard.html
          grep -q 'navigator-temporal-ui.js?v=20260819-temporal3' /tmp/dashboard.html
          curl -fsS http://127.0.0.1:10000/navigator-social-master.js >/tmp/social.js
          curl -fsS http://127.0.0.1:10000/navigator-temporal-ui.js >/tmp/temporal.js
          node --check /tmp/social.js
          node --check /tmp/temporal.js

      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Browser Social Signals test
        run: |
          cat > .diag-social.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            await page.goto('http://127.0.0.1:10000/dashboard.html?client=aroma&page=social',{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForTimeout(3000);
            const snap=()=>page.evaluate(()=>({
              active:document.querySelector('.page.active')?.id||null,
              channels:document.querySelectorAll('#socialBody .sm-channel').length,
              feeds:document.querySelectorAll('#socialBody .sm-network-feed').length,
              posts:document.querySelectorAll('#socialBody .sm-network-post').length,
              linkedinPosts:[...document.querySelectorAll('#socialBody .sm-network-feed')].filter(x=>(x.querySelector('b')?.textContent||'').includes('LinkedIn')).reduce((n,x)=>n+x.querySelectorAll('.sm-network-post').length,0),
              text:document.getElementById('socialBody')?.innerText||'',
              header:[...document.querySelectorAll('#socialBody .sm-card-head .sm-pill')].map(x=>x.textContent||'').find(x=>x.includes('наблюдавани'))||''
            }));
            const before=await snap();
            console.log('BEFORE',JSON.stringify({...before,text:before.text.slice(0,2500)},null,2));
            if(errors.length)throw new Error(errors.join('\n'));
            if(before.active!=='social')throw new Error('Social page not active');
            if(before.channels<1||before.feeds<1)throw new Error('Social cards did not render');
            if(before.linkedinPosts<3)throw new Error('LinkedIn verified posts did not render');
            if(before.text.includes('аналитична микродинамика'))throw new Error('Synthetic social history is still visible');
            if(!before.header.includes('наблюдавани'))throw new Error('Active/observed channel distinction missing');

            await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
            await page.waitForTimeout(500);
            const afterScroll=await snap();
            if(afterScroll.active!=='social'||afterScroll.posts!==before.posts)throw new Error('Social layout changed or broke after scroll');

            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForTimeout(2500);
            const afterReload=await snap();
            console.log('AFTER_RELOAD',JSON.stringify({...afterReload,text:afterReload.text.slice(0,1200)},null,2));
            if(afterReload.active!=='social')throw new Error('Reload did not preserve social page');
            if(afterReload.linkedinPosts<3)throw new Error('Posts disappeared after reload');
            if(afterReload.text.includes('аналитична микродинамика'))throw new Error('Synthetic social history returned after reload');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node .diag-social.cjs

      - name: Print server log
        if: always()
        run: cat /tmp/blis-server.log || true
