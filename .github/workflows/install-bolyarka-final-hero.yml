name: Install approved Bolyarka hero

on:
  push:
    branches: [main]
    paths:
      - '.hero-upload/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild approved hero binary
        shell: bash
        run: |
          set -euxo pipefail
          cat .hero-upload/part-*.txt | tr -d '\n\r' | base64 -d > static/bolyarka-profile-hero-final.webp
          file static/bolyarka-profile-hero-final.webp
          test "$(stat -c%s static/bolyarka-profile-hero-final.webp)" -gt 30000
          sed -i 's/20260818-final1/20260818-final2/g' static/navigator-real-ui.css
          sed -i 's/20260818-finalhero1/20260818-finalhero2/g' static/dashboard.html
      - name: Commit approved hero and cleanup installer
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/bolyarka-profile-hero-final.webp static/navigator-real-ui.css static/dashboard.html
          git rm -r .hero-upload .github/workflows/install-bolyarka-final-hero.yml
          git commit -m 'Install approved generated Bolyarka profile hero'
          git push origin main
