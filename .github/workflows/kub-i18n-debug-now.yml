name: KUB I18N Debug Now
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Inspect production EN runtime
        run: |
          cat > /tmp/debug.cjs <<'NODE'
          const { chromium }=require(process.env.GITHUB_WORKSPACE+'/node_modules/playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']});const p=await b.newPage({viewport:{width:1440,height:1000}});await p.goto('https://blis-navigator-aroma.onrender.com/kub-client?lang=en&dbg='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(3500);console.log('FLAGS',await p.evaluate(()=>({full:window.__KUB_FULL_I18N,final:window.__KUB_FINAL_FRAGMENTS,polish:window.__KUB_I18N_POLISH,href:location.href})));console.log('SCRIPTS',await p.$$eval('script[src]',x=>x.map(s=>s.src)));console.log('BAD',await p.$$eval('#overview *',els=>els.filter(e=>/ТЕКУЩО СЪСТОЯНИЕ|КРИЗИСНО НИВО|МЕДИЕН ОДИТ|ПОКРИТИЕ НА ПОЗИЦИЯТА/.test(e.innerText||'')&&!els.some(c=>c!==e&&e.contains(c)&&/ТЕКУЩО СЪСТОЯНИЕ|КРИЗИСНО НИВО|МЕДИЕН ОДИТ|ПОКРИТИЕ НА ПОЗИЦИЯТА/.test(c.innerText||''))).slice(0,20).map(e=>({tag:e.tagName,cls:e.className,text:(e.innerText||'').trim(),html:e.outerHTML.slice(0,500)}))));const src=await p.evaluate(async()=>{const r=await fetch('/kub-i18n-final-fragments-v1.js?dbg='+Date.now(),{cache:'no-store'});const t=await r.text();return {status:r.status,len:t.length,has:t.includes('MEDIA RADAR · ТЕКУЩО СЪСТОЯНИЕ'),head:t.slice(0,100)}});console.log('FINALFILE',src);await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/debug.cjs
