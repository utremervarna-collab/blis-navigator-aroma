name: Home Intelligence Search QA

on:
  push:
    branches: [main]
    paths:
      - 'static/index.html'
      - 'home_intelligence_search_v1.go'
      - 'static/migration-build.js'
      - '.github/workflows/home-intelligence-search-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-intelligence-search-qa
  cancel-in-progress: true

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  RELEASE_MARKER: home-intelligence-search-2026-09-26-v4

jobs:
  home-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build current Navigator
        run: go build -tags netgo -ldflags '-s -w' -o app .

      - name: Validate Home Search source contract
        run: |
          set -euo pipefail
          grep -Fq 'BLIS™ Quick Search · функция на Navigator' static/index.html
          grep -Fq 'intelSearchForm' static/index.html
          grep -Fq '/api/intelligence/search' static/index.html
          grep -Fq 'intelScope' static/index.html
          grep -Fq '.intelResult.navigator' static/index.html
          ! grep -Fq 'data-search-mode=' static/index.html
          grep -Fq '"/api/intelligence/search"' home_intelligence_search_v1.go
          echo HOME_SEARCH_SOURCE_CONTRACT_OK

      - name: Wait for and verify canonical production
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          ok=0
          for i in $(seq 1 48); do
            if curl -fsS --connect-timeout 12 --max-time 25 "$BASE/migration-build.js?ts=$(date +%s%N)" -o /tmp/build.js && grep -Fq "$RELEASE_MARKER" /tmp/build.js; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = "1"

          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 12 --max-time 30 "$BASE/?searchqa=$(date +%s%N)" -o /tmp/home.html
          grep -Fq 'BLIS™ Quick Search · функция на Navigator' /tmp/home.html
          grep -Fq 'intelSearchForm' /tmp/home.html

          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 12 --max-time 30 "$BASE/api/intelligence/search?q=Aroma%20Cosmetics&mode=all&ts=$(date +%s%N)" -o /tmp/search.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/search.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('mode')=='all', d.get('mode')
          rows=d.get('results') or []
          assert isinstance(rows,list)
          assert rows, 'Home search returned no results for Aroma Cosmetics'
          offer=d.get('analysis_offer') or {}
          assert offer.get('show') is True, offer
          assert 'пълен анализ' in str(offer.get('cta') or '').lower(), offer
          assert '/contact.html?analysis=1&topic=' in str(offer.get('url') or ''), offer
          answer=str(d.get('answer') or '')
          assert len(answer) <= 305, len(answer)
          print('HOME_INTELLIGENCE_SEARCH_PRODUCTION_OK', len(rows), len(answer), offer.get('cta'))
          PY
