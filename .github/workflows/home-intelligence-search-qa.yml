name: Home Product Architecture QA

on:
  push:
    branches: [main]
    paths:
      - 'static/index.html'
      - 'static/navigator-decision-intelligence-v1.js'
      - 'static/navigator-decision-intelligence-v1.css'
      - 'static/migration-build.js'
      - '.github/workflows/home-intelligence-search-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-product-architecture-qa
  cancel-in-progress: true

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  RELEASE_MARKER: home-intelligence-architecture-2026-09-27-v2

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build current Navigator
        run: go build -tags netgo -ldflags '-s -w' -o app .

      - name: Validate public home and contextual search contract
        run: |
          set -euo pipefail
          grep -Fq 'productPreview' static/index.html
          grep -Fq 'Три intelligence задачи' static/index.html
          grep -Fq 'flowGrid' static/index.html
          grep -Fq 'Ask Navigator · само в клиентските профили' static/index.html
          grep -Fq 'clientCompact' static/index.html
          ! grep -Fq 'intelSearchForm' static/index.html
          ! grep -Fq 'BLIS™ Quick Search' static/index.html
          grep -Fq 'diContextSearch' static/navigator-decision-intelligence-v1.js
          grep -Fq '/api/decision/ask' static/navigator-decision-intelligence-v1.js
          grep -Fq '.di-context-search' static/navigator-decision-intelligence-v1.css
          echo HOME_PRODUCT_ARCHITECTURE_SOURCE_OK

      - name: Wait for and verify canonical production
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          ok=0
          for i in $(seq 1 48); do
            if curl -fsS --connect-timeout 12 --max-time 25 "$BASE/migration-build.js?ts=$(date +%s%N)" -o /tmp/build.js && grep -Fq "$RELEASE_MARKER" /tmp/build.js; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = "1"

          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 12 --max-time 30 "$BASE/?homeqa=$(date +%s%N)" -o /tmp/home.html
          grep -Fq 'productPreview' /tmp/home.html
          grep -Fq 'Три intelligence задачи' /tmp/home.html
          grep -Fq 'Ask Navigator · само в клиентските профили' /tmp/home.html
          ! grep -Fq 'intelSearchForm' /tmp/home.html
          ! grep -Fq 'BLIS™ Quick Search' /tmp/home.html

          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 12 --max-time 30 "$BASE/navigator-decision-intelligence-v1.js?ts=$(date +%s%N)" -o /tmp/decision.js
          grep -Fq 'diContextSearch' /tmp/decision.js
          grep -Fq '/api/decision/ask' /tmp/decision.js
          echo HOME_PRODUCT_ARCHITECTURE_PRODUCTION_OK
