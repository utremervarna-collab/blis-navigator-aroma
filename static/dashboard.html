<script>
(function(){
  function avg(a){a=(a||[]).map(Number).filter(Number.isFinite);return a.length?Math.round((a.reduce((s,v)=>s+v,0)/a.length)*10)/10:null}
  function applyPeriodMetrics(){
    if(!window.BLISPeriod||typeof D==='undefined'||!D)return;
    var bv=avg(BLISPeriod.dailySeries('blis').map(x=>x.value)); if(bv!=null)D.blis_index=bv;
    if(Array.isArray(D.indices))D.indices.forEach(function(ix){var v=avg(BLISPeriod.dailySeries(ix.key).map(x=>x.value));if(v!=null)ix.value=v});
    var sel=document.getElementById('periodSelect');if(sel)sel.value=String(BLISPeriod.days);
    var label=document.getElementById('periodLabel');if(label)label.textContent='Последните '+BLISPeriod.days+' дни';
  }
  function rerender(){applyPeriodMetrics();var active=document.querySelector('.page.active');if(active&&window.refGo)window.refGo(active.id);setTimeout(function(){applyPeriodMetrics()},0)}
  document.addEventListener('change',function(e){if(e.target&&e.target.id==='periodSelect'&&window.BLISPeriod){BLISPeriod.set(Number(e.target.value));rerender()}});
  window.addEventListener('blis:clientdata',function(){applyPeriodMetrics();setTimeout(rerender,0)});
  window.addEventListener('blis:periodchange',function(){var sel=document.getElementById('periodSelect');if(sel&&window.BLISPeriod)sel.value=String(BLISPeriod.days)});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){var sel=document.getElementById('periodSelect');if(sel&&window.BLISPeriod)sel.value=String(BLISPeriod.days)});else{var sel=document.getElementById('periodSelect');if(sel&&window.BLISPeriod)sel.value=String(BLISPeriod.days)}
})();
</script>
