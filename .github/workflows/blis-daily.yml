name: BLIS Daily Engine v2 Multi-client

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blis-daily.yml'
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blis-daily-engine
  cancel-in-progress: true

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  MIGRATION_BUILD: code-run-migration-2026-09-09-v1

jobs:
  refresh-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Verify active code.run production before refresh
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          test -n "$BASE"
          curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 90 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$BASE/migration-build.js?daily=1&ts=$(date +%s)" \
            -o /tmp/migration-build.js
          cat /tmp/migration-build.js
          grep -q "$MIGRATION_BUILD" /tmp/migration-build.js
          curl --fail --silent --show-error --max-time 90 "$BASE/api/store/export?daily=1&ts=$(date +%s)" -o /tmp/store-before.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/store-before.json',encoding='utf-8'))
          for slug in ('aroma','bolyarka','astor-garden','mollox'):
              assert slug in d.get('clients',{}), f'{slug} missing from production store before refresh'
          print('STORE_BEFORE', {k:(len(v.get('snapshots',[])),len(v.get('observations',[]))) for k,v in d.get('clients',{}).items()})
          PY

      - name: Refresh all persistent client profiles on active production
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          for CLIENT in aroma bolyarka astor-garden mollox; do
            echo "Refreshing $CLIENT"
            curl --fail --retry 5 --retry-delay 10 --retry-all-errors --max-time 240 \
              -X POST "$BASE/api/clients/$CLIENT/refresh" \
              -o "/tmp/blis-$CLIENT.json"
            python - <<PY
          import json
          p='/tmp/blis-$CLIENT.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('ok') is True, d
          e=d.get('engine',{})
          print('$CLIENT', 'successful=',e.get('successful'), 'failed=',e.get('failed'), 'version=',e.get('version'))
          PY
          done

      - name: Export and verify persistent BLIS store changed
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          mkdir -p data
          curl --fail --retry 5 --retry-delay 8 --retry-all-errors --max-time 120 \
            "$BASE/api/store/export?after-refresh=1&ts=$(date +%s)" \
            -o data/live_store.json
          python - <<'PY'
          import json
          before=json.load(open('/tmp/store-before.json',encoding='utf-8'))
          after=json.load(open('data/live_store.json',encoding='utf-8'))
          bc=before.get('clients',{}); ac=after.get('clients',{})
          changed=[]
          observation_retention_cap=12000
          for slug in ('aroma','bolyarka','astor-garden','mollox'):
              assert slug in ac, f'{slug} missing from exported store'
              bsn=len(bc.get(slug,{}).get('snapshots',[])); asn=len(ac[slug].get('snapshots',[]))
              bob=len(bc.get(slug,{}).get('observations',[])); aob=len(ac[slug].get('observations',[]))
              assert asn >= bsn, f'{slug} snapshot count regressed {bsn}->{asn}'
              if aob < bob:
                  assert bob > observation_retention_cap and aob >= observation_retention_cap, \
                      f'{slug} observation count regressed outside retention compaction {bob}->{aob}'
                  print(slug, f'OBSERVATION_RETENTION_COMPACTION {bob}->{aob}')
              if asn>bsn or aob>bob: changed.append(slug)
              print(slug, 'snapshots=',asn, 'observations=',aob)
          if changed:
              print('PERSISTENCE_WRITE_OK', ','.join(changed))
          else:
              print('NO_NEW_DATA: refresh completed successfully; persistent counts are unchanged or retention-capped')
          PY

      - name: Publish daily data snapshot to runtime-data
        run: |
          set -euo pipefail

          # Keep runtime data off main. Northflank deploys main, so committing
          # data/live_store.json there would restart the production web service.
          cp data/live_store.json /tmp/daily-live-store.json

          git config user.name "BLIS Engine"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin runtime-data
          git reset --hard HEAD
          git clean -fd
          git checkout -B runtime-data origin/runtime-data

          mkdir -p data
          if [ -f data/live_store.json ]; then
            cp data/live_store.json /tmp/runtime-data-before.json
          fi
          cp /tmp/daily-live-store.json data/live_store.json

          python - <<'PY'
          import json, os

          path='data/live_store.json'
          candidate=json.load(open(path,encoding='utf-8'))
          clients=candidate.get('clients',{})
          for slug in ('aroma','bolyarka','astor-garden','mollox','kub'):
              if slug not in clients:
                  raise SystemExit(f'daily snapshot refused: {slug} missing')

          prev_path='/tmp/runtime-data-before.json'
          if os.path.exists(prev_path):
              previous=json.load(open(prev_path,encoding='utf-8'))
              pc=previous.get('clients',{})

              # Snapshot history must never move backwards relative to runtime-data.
              for slug in ('aroma','bolyarka','astor-garden','mollox'):
                  if slug in pc:
                      old=len(pc[slug].get('snapshots',[]))
                      new=len(clients[slug].get('snapshots',[]))
                      if new < old:
                          raise SystemExit(f'daily snapshot regression refused: {slug} snapshots {old}->{new}')

              # Preserve any KUB signal observations that reached runtime-data
              # between the production export and this publish step.
              def is_kub_signal(o):
                  return o.get('source_key') == 'signal_collector' and str(o.get('metric_key','')).startswith('signal_event_')

              prev_kub=pc.get('kub',{})
              cand_kub=clients['kub']
              cand_obs=cand_kub.setdefault('observations',[])
              keys={o.get('metric_key') for o in cand_obs if is_kub_signal(o)}
              restored=0
              for o in prev_kub.get('observations',[]):
                  if not is_kub_signal(o):
                      continue
                  key=o.get('metric_key')
                  if key and key not in keys:
                      cand_obs.append(o)
                      keys.add(key)
                      restored += 1
              print('KUB_RUNTIME_HISTORY_PRESERVED', restored)

          with open(path,'w',encoding='utf-8') as f:
              json.dump(candidate,f,ensure_ascii=False,separators=(',',':'))
          print('DAILY_RUNTIME_DATA_READY')
          PY

          git add data/live_store.json
          if git diff --cached --quiet; then
            echo "No runtime-data changes"
          else
            git commit -m "runtime: daily multi-client data $(date -u +%F)"
            git push origin HEAD:runtime-data
          fi
