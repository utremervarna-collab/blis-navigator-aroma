name: Navigator Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and start Navigator
        run: |
          set -euxo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .
          BLIS_AUTH_PROXY_DISABLED=1 PORT=10000 ./app > /tmp/blis-smoke-server.log 2>&1 &
          echo $! > /tmp/blis-smoke.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10000/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/api/health

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Browser smoke test
        run: |
          cat > /tmp/navigator-smoke.cjs <<'NODE'
          const { chromium } = require(process.env.GITHUB_WORKSPACE + '/node_modules/playwright');
          const fs=require('fs');
          const assert = (ok,msg)=>{ if(!ok) throw new Error(msg); };
          const origin='http://127.0.0.1:10000';
          const clients=['aroma','bolyarka','astor-garden','mollox','varna-towers'];
          const pages=['overview','live','social','digital','reputation','market','competition','reports','history','profile','settings','help'];
          const expectedNames={aroma:'Aroma',bolyarka:'Болярка','astor-garden':'Astor Garden',mollox:'MOLLOX','varna-towers':'Varna Towers'};
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const client of clients){
                const p=await browser.newPage({viewport:{width:1440,height:1000}});
                const errs=[];
                p.on('pageerror',e=>errs.push('PAGEERROR '+e.message));
                p.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource/i.test(m.text()))errs.push('CONSOLE '+m.text())});
                p.on('response',r=>{try{const u=new URL(r.url());if(u.origin===origin&&r.status()>=400&&u.pathname!=='/favicon.ico')errs.push(`HTTP ${r.status()} ${u.pathname}`)}catch(_){}});
                await p.goto(`${origin}/dashboard.html?client=${client}`,{waitUntil:'domcontentloaded',timeout:20000});
                await p.waitForFunction(()=>document.querySelectorAll('#nav [data-page]').length===12,{timeout:15000});
                await p.waitForFunction(()=>document.querySelector('.page.active')?.innerText.trim().length>20,{timeout:15000});
                const boot=await p.evaluate(()=>({
                  client:document.body.dataset.client,
                  name:document.querySelector('.client-brand-name')?.textContent||'',
                  nav:[...document.querySelectorAll('#nav [data-page]')].map(x=>x.dataset.page),
                  runtimeCore:[...document.scripts].some(s=>s.src.includes('navigator-runtime-core-v1.js')),
                  legacyBridge:[...document.scripts].some(s=>s.src.includes('navigator-runtime-bridge.js')),
                  pointEnhancer:[...document.scripts].some(s=>s.src.includes('navigator-chart-points.js')),
                  architectureV15:[...document.scripts].some(s=>s.src.includes('navigator-architecture-v15.js')),
                  productionOwners:!!window.BLISProductionOwners,
                  liveOwner:window.BLIS_LOCKED_MODULES?.live?.owner||'',
                  socialOwner:window.BLIS_LOCKED_MODULES?.social?.owner||'',
                  legacyLive:[...document.scripts].some(s=>s.src.includes('navigator-live-master.js')),
                  legacySocial:[...document.scripts].some(s=>s.src.includes('navigator-social-master.js')),
                  stabilityMode:window.BLISStabilityStats?.mode||'',
                  commerceLauncher:!!document.querySelector('[data-blis-commerce-open]')
                }));
                assert(boot.client===client,`${client}: body client is ${boot.client}`);
                assert(boot.name.includes(expectedNames[client]),`${client}: wrong client name ${boot.name}`);
                assert(boot.nav.join(',')===pages.join(','),`${client}: wrong nav ${boot.nav.join(',')}`);
                assert(boot.runtimeCore,`${client}: runtime core missing`);
                assert(!boot.legacyBridge,`${client}: legacy runtime bridge loaded`);
                assert(!boot.pointEnhancer,`${client}: global chart-point enhancer loaded`);
                assert(boot.architectureV15,`${client}: production Architecture V15 missing`);
                assert(boot.productionOwners,`${client}: production owner registry missing`);
                assert(boot.liveOwner==='BLISArchitectureV15'&&boot.socialOwner==='BLISArchitectureV15',`${client}: wrong locked owners`);
                assert(!boot.legacyLive&&!boot.legacySocial,`${client}: retired Live/Signals renderer loaded`);
                assert(boot.stabilityMode==='event-driven',`${client}: stability preload is not event-driven (${boot.stabilityMode})`);
                assert(!boot.commerceLauncher,`${client}: owner-only Services launcher leaked into client dashboard`);

                for(const id of pages){
                  await p.evaluate(id=>window.refGo(id),id);
                  await p.waitForFunction(id=>document.querySelector('.page.active')?.id===id,id,{timeout:8000});
                  await p.waitForTimeout(220);
                  const x=await p.evaluate(id=>{
                    const root=document.getElementById(id),r=root?.getBoundingClientRect(),cs=root?getComputedStyle(root):null;
                    const charts=[...(root?.querySelectorAll('svg')||[])].filter(s=>{
                      const z=s.getBoundingClientRect();
                      if(z.width<70||z.height<30)return false;
                      const aria=(s.getAttribute('aria-label')||'').toLowerCase();
                      const cls=String(s.className?.baseVal||'').toLowerCase();
                      const vb=(s.getAttribute('viewBox')||'').trim().split(/\s+/).map(Number);
                      const vbW=Number.isFinite(vb[2])?vb[2]:0, vbH=Number.isFinite(vb[3])?vb[3]:0;
                      const explicit=s.hasAttribute('data-curve-key')||/динамика|trend|history|график|chart/.test(aria)||/n15-smoothchart|blis-runtime-curve|trend-chart|history-chart/.test(cls);
                      const lineLike=[...s.querySelectorAll('path')].some(p=>(p.getAttribute('d')||'').length>80&&String(p.getAttribute('fill')||'').toLowerCase()==='none');
                      return explicit || (vbW>=200&&vbH>=80&&lineLike);
                    }).map(s=>{const z=s.getBoundingClientRect();return {w:z.width,h:z.height,aria:s.getAttribute('aria-label')||'',cls:String(s.className?.baseVal||'')};});
                    return {id:document.querySelector('.page.active')?.id,text:(root?.innerText||'').trim().length,height:r?.height||0,visible:!!root&&cs.display!=='none'&&cs.visibility!=='hidden'&&Number(cs.opacity||1)>.01,overflow:document.documentElement.scrollWidth-window.innerWidth,charts};
                  },id);
                  assert(x.id===id,`${client}/${id}: wrong active route ${x.id}`);
                  assert(x.visible&&x.height>80&&x.text>20,`${client}/${id}: blank/collapsed page ${JSON.stringify(x)}`);
                  assert(x.overflow<=8,`${client}/${id}: horizontal overflow ${x.overflow}`);
                  assert(x.charts.every(z=>z.w>=70&&z.h>=30),`${client}/${id}: collapsed analytical SVG ${JSON.stringify(x.charts.filter(z=>z.w<70||z.h<30))}`);
                  if(id==='live'||id==='social'){const owner=await p.evaluate(x=>document.getElementById(x)?.dataset.blisProductionOwner||'',id);assert(owner==='BLISArchitectureV15',`${client}/${id}: wrong production owner ${owner}`);}
                }

                await p.evaluate(()=>window.BLISCommerceSafe.open());
                await p.waitForFunction(()=>document.querySelector('.page.active')?.id==='commerce'&&document.getElementById('commerceBody')?.innerText.includes('Пакет Анализ'),{timeout:8000});
                const subscriptions=await p.evaluate(()=>({
                  text:document.getElementById('commerceBody')?.innerText||'',
                  tabs:document.querySelectorAll('[data-bc3-tab]').length,
                  requests:document.querySelectorAll('[data-bc3-request]').length,
                  overflow:document.documentElement.scrollWidth-window.innerWidth
                }));
                assert(subscriptions.text.includes('390')&&subscriptions.text.includes('750'),`${client}: subscription prices missing`);
                assert(subscriptions.tabs>=6,`${client}: commerce tabs missing`);
                assert(subscriptions.requests>=4,`${client}: subscription cards missing`);
                assert(subscriptions.overflow<=8,`${client}/commerce: overflow ${subscriptions.overflow}`);
                await p.click('[data-bc3-tab="oneoff"]');
                await p.waitForFunction(()=>document.getElementById('commerceBody')?.innerText.includes('Репутационен анализ'));
                const oneoff=await p.evaluate(()=>({requests:document.querySelectorAll('[data-bc3-request]').length,text:document.getElementById('commerceBody')?.innerText||''}));
                assert(oneoff.requests>=8,`${client}: one-off services missing`);
                assert(oneoff.text.includes('350')&&oneoff.text.includes('550')&&oneoff.text.includes('650'),`${client}: one-off prices missing`);
                await p.click('[data-bc3-tab="addons"]');
                await p.waitForFunction(()=>document.querySelectorAll('[data-bc3-addon-request]').length>=8);

                await p.evaluate(()=>window.refGo('reputation'));
                await p.evaluate(()=>{window.__smokeMutations=0;const root=document.getElementById('reputation');window.__smokeObserver=new MutationObserver(ms=>window.__smokeMutations+=ms.length);window.__smokeObserver.observe(root,{childList:true,subtree:true,characterData:true})});
                await p.waitForTimeout(1400);
                const late=await p.evaluate(()=>{window.__smokeObserver?.disconnect();return window.__smokeMutations||0});
                assert(late<40,`${client}/reputation: repaint storm ${late} mutations/1.4s`);
                assert(errs.length===0,`${client}: runtime errors ${errs.join(' | ')}`);
                await p.close();
              }
              console.log('NAVIGATOR_PRODUCTION_SMOKE_OK');
            } finally { await browser.close(); }
          })().catch(e=>{try{fs.writeFileSync('/tmp/navigator-smoke-error.txt',String(e.message||e))}catch(_){};console.error(e);process.exit(1)});
          NODE
          node /tmp/navigator-smoke.cjs

      - name: Show server log on failure
        if: failure()
        run: |
          cat /tmp/navigator-smoke-error.txt || true
          cat /tmp/blis-smoke-server.log || true

      - name: Publish smoke status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const state='${{ job.status }}'==='success'?'success':'failure';
            let detail='';
            try{detail=fs.readFileSync('/tmp/navigator-smoke-error.txt','utf8').replace(/[^a-zA-Z0-9_:\/.-]+/g,' ').trim().slice(0,70)}catch(_){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'navigator-production-smoke',description:state==='success'?'5 clients, 12 pages and commerce passed':'Navigator production smoke failed'});
            if(state==='failure'&&detail){await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'failure',context:`navigator-smoke:${detail}`,description:'First browser smoke failure'});}
