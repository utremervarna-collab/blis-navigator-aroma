name: Varna Towers Hero V7
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Diagnose production hero
        run: |
          cat > check.cjs <<'NODE'
          const { chromium }=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1680,height:720},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGE:'+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE:'+m.text())});
            await page.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=varna-towers',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(3500);
            const state=await page.evaluate(async()=>{
              const el=document.querySelector('.topbar .client-photo-bg');
              const cs=el?getComputedStyle(el):null,r=el?el.getBoundingClientRect():null;
              async function probe(u){try{const q=await fetch(u,{cache:'no-store'});const t=await q.text();return {url:u,ok:q.ok,status:q.status,type:q.headers.get('content-type'),len:t.length,head:t.slice(0,60)}}catch(e){return {url:u,error:e.message}}}
              return {
                client:document.body.dataset.client,
                bg:cs?.backgroundImage?.slice(0,140)||'',ready:el?.dataset.varnaTowersHero||'',w:r?.width||0,h:r?.height||0,
                probes:await Promise.all([
                  probe('/varna-towers-profile-hero-header-v7.txt?v=20260818-vt-header7'),
                  probe('/varna-towers-hero-guard.js?v=20260818-vt7'),
                  probe('/varna-towers-ui.js?v=20260818-vt7')
                ])
              };
            });
            console.log('STATE',JSON.stringify(state,null,2));
            console.log('ERRORS',JSON.stringify(errors,null,2));
            await page.screenshot({path:'varna-towers-hero-v7.png',fullPage:false});
            await browser.close();
            if(errors.length||!state.probes.every(x=>x.ok))process.exitCode=2;
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: varna-towers-hero-v7
          path: varna-towers-hero-v7.png
