name: BLIS Signal Collector 10m

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: blis-signal-collector-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Wake canonical Navigator and collect signals
        run: |
          set -euo pipefail
          BASE="https://blis-navigator-milestone-20260825.onrender.com"
          curl --fail --show-error --silent \
            --retry 4 --retry-delay 8 --retry-all-errors \
            --connect-timeout 30 --max-time 420 \
            -X POST "$BASE/api/signals/refresh" \
            -o /tmp/signal-refresh.json
          cat /tmp/signal-refresh.json
      - name: Verify collector health
        run: |
          BASE="https://blis-navigator-milestone-20260825.onrender.com"
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 30 --max-time 90 \
            "$BASE/api/signals/health"
