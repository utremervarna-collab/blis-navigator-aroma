.fx{position:absolute;pointer-events:none;z-index:14}
.stepGlow{width:7.4%;aspect-ratio:1;border-radius:50%;top:21.45%;background:radial-gradient(circle,rgba(255,255,255,.85) 0 8%,rgba(84,216,255,.28) 26%,transparent 67%);mix-blend-mode:screen;filter:blur(.2px);animation:stepPulse 5.75s ease-in-out infinite;opacity:.3}

.stepGlow:after{content:"";position:absolute;inset:14%;border-radius:50%;box-shadow:0 0 28px var(--g),0 0 48px var(--g)}
.flow{left:10%;right:9%;top:23.55%;height:3px;overflow:hidden;opacity:.85}
.flow:before{content:"";position:absolute;top:0;left:-20%;width:20%;height:100%;background:linear-gradient(90deg,transparent,#fff 40%,#6ddcff 60%,transparent);filter:drop-shadow(0 0 6px #6ddcff);animation:flow 5.75s linear infinite}
.radar{left:54.2%;top:31.15%;width:19.8%;aspect-ratio:1;border-radius:50%;overflow:hidden;opacity:.75;mix-blend-mode:screen}
.radar:before{content:"";position:absolute;left:50%;top:50%;width:48%;height:2px;background:linear-gradient(90deg,#73e9ff,rgba(115,233,255,0));transform-origin:left center;animation:spin 4.6s linear infinite;filter:drop-shadow(0 0 6px #73e9ff)}
.radar:after{content:"";position:absolute;inset:3%;border-radius:50%;box-shadow:0 0 32px rgba(83,215,255,.2) inset}
.shine{width:18%;height:5%;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.0) 35%,rgba(255,255,255,.75) 49%,rgba(255,255,255,0) 62%,transparent 80%);transform:skewX(-12deg);filter:blur(1px);opacity:0;animation:shine 7s ease-in-out infinite;mix-blend-mode:screen}
.shineA{left:68%;top:7%}.shineB{left:71%;top:55%;animation-delay:2.2s}.shineC{left:57%;top:75%;animation-delay:4.1s}
.spark{width:.85%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 25px #5fdcff,0 0 40px #5fdcff;animation:spark 3.8s ease-in-out infinite;opacity:.2}
.k1{left:86%;top:9%}.k2{left:66%;top:51%;animation-delay:1.2s}.k3{left:74%;top:80%;animation-delay:2.3s}
@keyframes stepPulse{0%,13%,100%{transform:scale(.86);opacity:.15}18%,31%{transform:scale(1.16);opacity:.95}35%,100%{transform:scale(.9);opacity:.18}}
@keyframes flow{to{left:120%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{0%,54%,100%{opacity:0;transform:translateX(-80%) skewX(-12deg)}63%{opacity:.8}78%{opacity:0;transform:translateX(130%) skewX(-12deg)}}
@keyframes spark{0%,100%{transform:scale(.45);opacity:.18}50%{transform:scale(1.7);opacity:.95}}
@media(max-width:700px){
  body{background:#fff}
  .page{box-shadow:none}
  .stepGlow{filter:none}
}
@media(prefers-reduced-motion:reduce){.fx,.fx:before,.fx:after{animation:none!important}}
