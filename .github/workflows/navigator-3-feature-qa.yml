name: Navigator 3 Feature QA

on:
  push:
    branches:
      - feature/navigator-3-bg-client-clarity
    paths:
      - 'static/navigator-3-*.js'
      - 'static/navigator-production-entry-v1.js'
      - 'static/navigator-system-structure-v1.js'
      - '.github/workflows/navigator-3-feature-qa.yml'
  workflow_dispatch:

jobs:
  nav3-feature-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build application
        run: go build -tags netgo -ldflags '-s -w' -o app .

      - name: Check Navigator 3 JavaScript syntax
        run: |
          set -euo pipefail
          node --check static/navigator-production-entry-v1.js
          node --check static/navigator-system-structure-v1.js
          node --check static/navigator-3-client-clarity-v1.js
          node --check static/navigator-3-client-proof-v1.js
          node --check static/navigator-3-evidence-v1.js
          node --check static/navigator-3-competitor-dossier-v1.js
          node --check static/navigator-3-architecture-v1.js

      - name: Validate simplified client architecture
        run: |
          set -euo pipefail
          arch=static/navigator-3-architecture-v1.js
          entry=static/navigator-production-entry-v1.js
          structure=static/navigator-system-structure-v1.js
          clarity=static/navigator-3-client-clarity-v1.js
          proof=static/navigator-3-client-proof-v1.js

          grep -q "navigator-3-architecture-v1.js" "$entry"
          ! grep -q "navigator-3-client-brief-v1.js" "$entry"
          grep -q "Общ преглед" "$arch"
          grep -q "Сигнали и наблюдение" "$arch"
          grep -q "Пазар и репутация" "$arch"
          grep -q "Конкуренция" "$arch"
          grep -q "Развитие и доклади" "$arch"
          grep -q "Intelligence HUB" "$arch"
          grep -q "Календар" "$arch"
          grep -q "Интелигентен радар" "$arch"
          grep -q "Какво се случва около бранда" "$arch"
          grep -q "BLIS индекс във времето" "$arch"
          grep -q "Какво се промени при конкурентите" "$arch"
          grep -q "digital:'social'" "$arch"
          grep -q "opportunities:'social'" "$arch"
          grep -q "reputation:'market'" "$arch"
          grep -q "reports:'history'" "$arch"
          grep -q "3.0-simplified-five-page-journey" "$structure"
          grep -q "Как е брандът ми сега?" "$clarity"
          grep -q "Какво се случва в момента?" "$clarity"
          grep -q "Какво се случва около бранда и как се възприема?" "$clarity"
          grep -q "Как се движим спрямо останалите?" "$clarity"
          grep -q "Как се развива картината във времето?" "$clarity"
          grep -q "Фактология и източници" "$proof"

          node <<'NODE'
          const fs=require('fs');
          const arch=fs.readFileSync('static/navigator-3-architecture-v1.js','utf8');
          const structure=fs.readFileSync('static/navigator-system-structure-v1.js','utf8');
          const entry=fs.readFileSync('static/navigator-production-entry-v1.js','utf8');
          const core=[...structure.matchAll(/\{id:'(overview|social|market|competition|history)'/g)].map(x=>x[1]);
          if(core.join('|')!=='overview|social|market|competition|history')throw new Error('Core journey is not exactly five pages: '+core.join('|'));
          for(const id of ['overview','social','market','competition','history','hub','calendar'])if(!arch.includes(`id:'${id}'`))throw new Error('Missing visible route '+id);
          const load=entry.indexOf("/navigator-3-architecture-v1.js");
          const proof=entry.indexOf("/navigator-3-client-proof-v1.js");
          if(load<0||proof<0||load<proof)throw new Error('Architecture owner must load after client proof');
          if(!arch.includes('window.BLISCanonicalRenderActive=()=>renderRoute(active())'))throw new Error('Simplified architecture is not the final canonical render owner');
          console.log('NAVIGATOR_3_SIMPLIFIED_ARCHITECTURE_OK');
          NODE

      - name: Verify feature branch does not change Render configuration
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git diff --exit-code origin/main -- render.yaml
