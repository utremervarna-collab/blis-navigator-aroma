name: Navigator Runtime Debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start Navigator
        run: |
          go build -tags netgo -ldflags '-s -w' -o app .
          BLIS_AUTH_PROXY_DISABLED=1 PORT=10000 ./app >/tmp/blis-debug.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:10000/api/health >/dev/null && break; sleep 1; done
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Capture overview runtime error
        run: |
          cat >/tmp/debug.cjs <<'NODE'
          const {chromium}=require(process.env.GITHUB_WORKSPACE+'/node_modules/playwright');
          const fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']});const p=await b.newPage({viewport:{width:1440,height:1000}});const e=[];p.on('pageerror',x=>e.push('PAGEERROR '+x.message+' STACK '+(x.stack||'')));p.on('console',m=>{if(m.type()==='error')e.push('CONSOLE '+m.text())});await p.goto('http://127.0.0.1:10000/dashboard.html?client=aroma&page=overview',{waitUntil:'domcontentloaded'});await p.waitForTimeout(2500);try{await p.evaluate(()=>window.refGo?.('overview'))}catch(x){e.push('EVAL '+x.message+' '+(x.stack||''))}await p.waitForTimeout(500);fs.writeFileSync('/tmp/runtime-error.txt',e.join(' || ')||'NO_RUNTIME_ERROR');await b.close()})().catch(x=>{fs.writeFileSync('/tmp/runtime-error.txt','DEBUG '+x.message+' '+(x.stack||''));process.exit(1)});
          NODE
          node /tmp/debug.cjs
          cat /tmp/runtime-error.txt
      - name: Publish error chunks
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); let s=''; try{s=fs.readFileSync('/tmp/runtime-error.txt','utf8')}catch(_){s='NO_DEBUG_OUTPUT'}
            s=s.replace(/[^a-zA-Z0-9_:\/().,\- ]+/g,' ').replace(/\s+/g,' ').trim();
            for(let i=0;i<5;i++){const chunk=s.slice(i*80,(i+1)*80);if(!chunk)break;await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'failure',context:`nav-debug-${i+1}:${chunk}`,description:'Navigator runtime debug chunk'});}
