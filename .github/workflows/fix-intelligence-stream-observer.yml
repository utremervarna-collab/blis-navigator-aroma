name: Fix Intelligence Stream Observer

on:
  push:
    branches:
      - milestone/navigator-production-stable-20260825
    paths:
      - .github/workflows/fix-intelligence-stream-observer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch observer and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('static/navigator-intelligence-stream-v2.js')
          s=p.read_text()
          old="new MutationObserver(()=>{if(cache.data)renderAll(cache.data)}).observe(document.body,{childList:true,subtree:true});setInterval(()=>load(true),30000)"
          new="let redrawTimer=0;new MutationObserver(()=>{if(!cache.data)return;const ids=['overview','live','social','reputation','digital','market','competition','history'];const missing=ids.some(id=>{const p=document.getElementById(id);return p&&!p.querySelector(':scope > .isv2[data-isv2=\\\"'+id+'\\\"]')});if(!missing)return;clearTimeout(redrawTimer);redrawTimer=setTimeout(()=>renderAll(cache.data),120)}).observe(document.body,{childList:true,subtree:true});setInterval(()=>load(true),30000)"
          if old not in s:
              raise SystemExit('observer anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check static/navigator-intelligence-stream-v2.js
          go test ./...
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "BLIS Navigator Bot"
          git config user.email "actions@users.noreply.github.com"
          git add static/navigator-intelligence-stream-v2.js
          git commit -m "Prevent intelligence stream observer rerender loop"
          git push origin HEAD:milestone/navigator-production-stable-20260825
