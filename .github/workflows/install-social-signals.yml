name: Install Social Signals
on:
  push:
    paths:
      - '.github/workflows/install-social-signals.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply readable Social Signals typography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('static/dashboard.html')
          s=p.read_text()
          s=s.replace('/navigator-social-master.css?v=20260819-social1','/navigator-social-master.css?v=20260819-font2')
          p.write_text(s)
          PY
      - name: Commit typography cache refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/dashboard.html
          if ! git diff --cached --quiet; then
            git commit -m 'Apply readable Social Signals typography'
            git push origin HEAD:main
          fi
