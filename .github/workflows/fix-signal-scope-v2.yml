name: Fix Signal Scope v2
on:
  push:
    branches:
      - milestone/navigator-production-stable-20260825
    paths:
      - .github/workflows/fix-signal-scope-v2.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct external news scope and empty arrays
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('signal_collector.go')
          s=p.read_text()
          s=s.replace('rows := append([]Signal(nil), signalState.Signals[client]...)','rows := append([]Signal{}, signalState.Signals[client]...)')
          old='''\tsentiment, risk := signalSentimentAndRisk(title + " " + text)\n\tfingerprint := signalHash(c.Slug, rawURL, title, text)\n\treturn Signal{'''
          new='''\tsentiment, risk := signalSentimentAndRisk(title + " " + text)\n\tfingerprint := signalHash(c.Slug, rawURL, title, text)\n\tscope := signalSourceScope(c, rawURL)\n\t// Google News is a discovery transport, not an owned brand channel.\n\t// Articles discovered through it are external information signals.\n\tif sourceType == "news" {\n\t\tscope = "external"\n\t}\n\treturn Signal{'''
          if old not in s and 'if sourceType == "news" {' not in s:
              raise SystemExit('buildSignal insertion point not found')
          if old in s:
              s=s.replace(old,new,1)
          s=s.replace('Scope:       signalSourceScope(c, rawURL),','Scope:       scope,',1)
          p.write_text(s)
          PY
          gofmt -w signal_collector.go
          go test ./...
      - name: Commit scope fix
        run: |
          git config user.name 'BLIS Navigator Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add signal_collector.go
          git commit -m 'Classify discovered news as external signals' || exit 0
          git push origin HEAD:milestone/navigator-production-stable-20260825
