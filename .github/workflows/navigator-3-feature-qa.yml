name: Navigator 3 Feature QA

on:
  push:
    branches:
      - feature/navigator-3-bg-client-clarity
  workflow_dispatch:

jobs:
  nav3-feature-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build application
        run: go build -tags netgo -ldflags '-s -w' -o app .

      - name: Check canonical JavaScript syntax
        run: |
          set -euo pipefail
          node --check static/navigator-production-entry-v1.js
          node --check static/navigator-reference.js
          node --check static/navigator-system-structure-v1.js
          node --check static/navigator-3-client-clarity-v1.js
          node --check static/navigator-3-evidence-v1.js
          node --check static/navigator-3-competitor-dossier-v1.js
          node --check static/navigator-3-client-proof-v1.js
          node --check static/navigator-3-client-brief-v1.js

      - name: Validate Navigator 3 Bulgarian client contract
        run: |
          set -euo pipefail
          clarity=static/navigator-3-client-clarity-v1.js
          structure=static/navigator-system-structure-v1.js
          evidence=static/navigator-3-evidence-v1.js
          dossier=static/navigator-3-competitor-dossier-v1.js
          proof=static/navigator-3-client-proof-v1.js
          brief=static/navigator-3-client-brief-v1.js
          entry=static/navigator-production-entry-v1.js

          grep -q "navigator-3-client-clarity-v1.js" "$entry"
          grep -q "navigator-3-evidence-v1.js" "$entry"
          grep -q "navigator-3-competitor-dossier-v1.js" "$entry"
          grep -q "navigator-3-client-proof-v1.js" "$entry"
          grep -q "navigator-3-client-brief-v1.js" "$entry"
          grep -q "forceBulgarianEarly" "$entry"
          grep -q "window.BLIS_LANGUAGE='bg'" "$entry"
          grep -q "navigatorVersion='3.0-client-clarity-bg'" "$clarity"
          grep -q "document.documentElement.lang='bg'" "$clarity"
          grep -q "Какво е текущото състояние на марката?" "$clarity"
          grep -q "Какво се промени?" "$clarity"
          grep -q "Какъв контекст обяснява промяната?" "$clarity"
          grep -q "Къде се вижда ефектът онлайн?" "$clarity"
          grep -q "Как това влияе върху доверието?" "$clarity"
          grep -q "Как се променя позицията спрямо конкурентите?" "$clarity"
          grep -q "Какво означава това за решенията?" "$clarity"
          grep -q "Как стигнахме до текущото състояние?" "$clarity"
          grep -q "Какво излиза като клиентски резултат?" "$clarity"
          grep -q "BLIS индекс" "$clarity"
          grep -q "Конкурентна позиция" "$clarity"
          grep -q "Готовност на анализа" "$clarity"
          grep -q "version:'3.0-bg-client-journey'" "$structure"
          grep -q "Информационна основа" "$evidence"
          grep -q "Първоизточник" "$evidence"
          grep -q "Независими потвърждения" "$evidence"
          grep -q "Какво се промени" "$evidence"
          grep -q "Конкурентно досие" "$dossier"
          grep -q "не представлява пазарен дял" "$dossier"
          grep -q "Първоизточник" "$dossier"
          grep -q "Доказателства за страницата" "$proof"
          grep -q "Фактология и източници" "$proof"
          grep -q "Система за бизнес анализ и наблюдение" "$proof"
          grep -q "Карта на решенията" "$proof"
          grep -q "АКТУАЛНО" "$proof"
          grep -q "Клиентски бриф" "$brief"
          grep -q "Какво трябва да знаете сега" "$brief"
          grep -q "състояние → промяна → репутация → конкуренция → решения" "$brief"
          grep -q "window.D?.competitors\|D().competitors" "$brief"
          grep -q "getUsefulSignals" "$brief"

          ! grep -q "questionEn" "$structure"
          ! grep -q "labelEn" "$structure"
          ! grep -q "shortEn" "$structure"

      - name: Verify feature branch does not change Render configuration
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git diff --exit-code origin/main -- render.yaml

      - name: Verify Navigator 3 integration contract
        run: |
          set -euo pipefail
          test -s static/navigator-system-structure-v1.js
          test -s static/navigator-3-client-clarity-v1.js
          test -s static/navigator-3-evidence-v1.js
          test -s static/navigator-3-competitor-dossier-v1.js
          test -s static/navigator-3-client-proof-v1.js
          test -s static/navigator-3-client-brief-v1.js
          test -s static/navigator-production-entry-v1.js

          node <<'NODE'
          const fs=require('fs');
          const entry=fs.readFileSync('static/navigator-production-entry-v1.js','utf8');
          const structure=fs.readFileSync('static/navigator-system-structure-v1.js','utf8');
          const clarity=fs.readFileSync('static/navigator-3-client-clarity-v1.js','utf8');
          const evidence=fs.readFileSync('static/navigator-3-evidence-v1.js','utf8');
          const dossier=fs.readFileSync('static/navigator-3-competitor-dossier-v1.js','utf8');
          const proof=fs.readFileSync('static/navigator-3-client-proof-v1.js','utf8');
          const brief=fs.readFileSync('static/navigator-3-client-brief-v1.js','utf8');
          const order=['/navigator-system-structure-v1.js','/navigator-3-client-clarity-v1.js','/navigator-3-evidence-v1.js','/navigator-3-competitor-dossier-v1.js','/navigator-3-client-proof-v1.js','/navigator-3-client-brief-v1.js'];
          let last=-1;
          for(const asset of order){const at=entry.indexOf(asset);if(at<0)throw new Error('Missing entrypoint asset '+asset);if(at<=last)throw new Error('Wrong Navigator 3 load order at '+asset);last=at;}
          if(!structure.includes('__BLIS_SYSTEM_STRUCTURE_V3'))throw new Error('Missing connected journey owner');
          if(!clarity.includes('__BLIS_NAVIGATOR_3_CLIENT_CLARITY_V1'))throw new Error('Missing client clarity owner');
          if(!evidence.includes('__BLIS_NAVIGATOR_3_EVIDENCE_V1'))throw new Error('Missing evidence owner');
          if(!dossier.includes('__BLIS_NAVIGATOR_3_COMPETITOR_DOSSIER_V1'))throw new Error('Missing competitor dossier owner');
          if(!proof.includes('__BLIS_NAVIGATOR_3_CLIENT_PROOF_V1'))throw new Error('Missing page proof owner');
          if(!brief.includes('__BLIS_NAVIGATOR_3_CLIENT_BRIEF_V1'))throw new Error('Missing client brief owner');
          if(!evidence.includes('window.S')||!evidence.includes('window.H')||!evidence.includes('getUsefulSignals'))throw new Error('Evidence layer is not connected to canonical client data');
          if(!dossier.includes('window.D?.competitors')||!dossier.includes('getUsefulSignals'))throw new Error('Competitor dossiers are not connected to canonical client data');
          if(!proof.includes('window.S')||!proof.includes('window.H')||!proof.includes('getUsefulSignals'))throw new Error('Page proof is not connected to canonical client data');
          if(!brief.includes('D().competitors')||!brief.includes('getUsefulSignals'))throw new Error('Client brief is not connected to canonical client data');
          console.log('NAVIGATOR_3_FEATURE_CONTRACT_OK');
          NODE
