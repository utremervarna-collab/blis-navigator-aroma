name: KUB I18N Loop Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'Trigger KUB i18n observer fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stop self-triggering localization observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('static/kub-i18n-full-v1.js')
          s=p.read_text()
          old="mo.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['title','aria-label','placeholder']});setInterval(()=>apply(document.body),1200)"
          new="mo.observe(document.body,{subtree:true,childList:true});setInterval(()=>apply(document.body),1200)"
          assert old in s, 'observer configuration not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/kub-i18n-full-v1.js
          git diff --cached --quiet && exit 0
          git commit -m "Stop KUB EN RU localization observer feedback"
          git push origin main
