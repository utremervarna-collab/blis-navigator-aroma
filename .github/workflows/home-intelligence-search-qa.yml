name: Navigator Home and Analyses QA

on:
  push:
    branches: [main]
    paths:
      - 'static/index.html'
      - 'static/analyses.html'
      - 'static/home-2026.css'
      - 'static/home-2026.js'
      - 'static/migration-build.js'
      - '.github/workflows/home-intelligence-search-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigator-home-analyses-qa
  cancel-in-progress: true

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  RELEASE_MARKER: navigator-home-analyses-2026-09-27-v2

jobs:
  home-analyses:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build current Navigator
        run: go build -tags netgo -ldflags '-s -w' -o app .
      - name: Validate source
        run: |
          set -euo pipefail
          grep -Fq 'Информацията е предимство' static/index.html
          grep -Fq 'Поръчай анализ' static/index.html
          grep -Fq 'Влез в Навигатор' static/index.html
          grep -Fq 'Клиентски профил' static/index.html
          grep -Fq 'Последни анализи и статии' static/index.html
          grep -Fq 'Събиране' static/index.html
          grep -Fq 'Подреждане' static/index.html
          grep -Fq 'Проследяване' static/index.html
          grep -Fq 'Анализ' static/index.html
          grep -Fq 'Извод' static/index.html
          grep -Fq '/intelligence-hub-more-data-less-clarity.html' static/index.html
          grep -Fq '/intelligence-ai-search.html' static/index.html
          grep -Fq '/intelligence-reputation-trust.html' static/index.html
          grep -Fq '/intelligence-retail-bulgaria-2026.html' static/index.html
          grep -Fq 'analysisOrder' static/analyses.html
          grep -Fq '/api/inquiries' static/analyses.html
          grep -Fq '@keyframes flow' static/home-2026.css
          grep -Fq '@keyframes glint' static/home-2026.css
          echo HOME_ANALYSES_SOURCE_OK
      - name: Wait for canonical production
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 12 --max-time 25 "$BASE/migration-build.js?ts=$(date +%s%N)" -o /tmp/build.js && grep -Fq "$RELEASE_MARKER" /tmp/build.js; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = "1"
      - name: Verify live homepage and analyses
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          curl -fsS --retry 4 --retry-all-errors "$BASE/?homeqa=$(date +%s%N)" -o /tmp/home.html
          grep -Fq 'Информацията е предимство' /tmp/home.html
          grep -Fq 'Поръчай анализ' /tmp/home.html
          grep -Fq 'Влез в Навигатор' /tmp/home.html
          grep -Fq 'Клиентски профил' /tmp/home.html
          grep -Fq 'Последни анализи и статии' /tmp/home.html
          curl -fsS "$BASE/home-2026.css?ts=$(date +%s%N)" -o /tmp/home.css
          grep -Fq '@keyframes flow' /tmp/home.css
          grep -Fq '@keyframes glint' /tmp/home.css
          curl -fsS "$BASE/home-2026.js?ts=$(date +%s%N)" -o /tmp/home.js
          grep -Fq 'is-active' /tmp/home.js
          curl -fsS "$BASE/analyses.html?ts=$(date +%s%N)" -o /tmp/analyses.html
          grep -Fq 'Поръчай анализ' /tmp/analyses.html
          grep -Fq 'analysisOrder' /tmp/analyses.html
          echo HOME_ANALYSES_PRODUCTION_OK
