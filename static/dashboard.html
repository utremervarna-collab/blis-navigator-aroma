<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>BLIS Navigator — Stable Runtime</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#748096;--line:#e3e8f0;--nav:#15253b;--nav2:#1d3553;--blue:#2f6fed;--green:#22a06b;--gold:#c58a24;--red:#d64545;--shadow:0 12px 34px rgba(25,43,70,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:linear-gradient(180deg,var(--nav),#101d2e);color:#fff;padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:2px 10px 22px;border-bottom:1px solid rgba(255,255,255,.11);margin-bottom:18px}.brand b{font:600 30px Georgia,serif;color:#e0ab48;display:block}.brand small{font-size:9px;letter-spacing:.09em;color:#aebbd0}.client{margin:0 8px 18px;padding:12px;border:1px solid rgba(255,255,255,.13);border-radius:13px;background:rgba(255,255,255,.05)}.client label{display:block;font-size:9px;color:#9fb0c8;margin-bottom:7px}.client select{width:100%;background:#fff;border:0;border-radius:8px;padding:9px;color:#1c2c44;font-weight:700}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#c9d4e4;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:12px;font-weight:650}.nav button:hover,.nav button.active{background:rgba(255,255,255,.10);color:#fff}.navico{width:22px;text-align:center;color:#8fb4ff}.home{margin-top:auto;padding:16px 10px 0;border-top:1px solid rgba(255,255,255,.10);color:#c9d4e4;text-decoration:none;font-size:11px}.main{min-width:0}.shell{max-width:1480px;margin:auto;padding:24px 30px 42px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:15px}.topbar h1{margin:0;font-size:28px}.topbar p{margin:5px 0 0;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:8px;background:#eef8f3;border:1px solid #d5eee1;color:#23684c;padding:9px 12px;border-radius:10px;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(34,160,107,.12)}.systembar{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:18px;box-shadow:var(--shadow)}.systembar b{font-size:11px}.systembar span{font-size:10px;color:var(--muted)}.build{font-weight:800;color:var(--blue)!important}.page{display:none}.page.active{display:block}.title{margin-bottom:16px}.title h2{font-size:22px;margin:0 0 5px}.title p{font-size:12px;color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(23,43,72,.05)}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}.kpi small{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.kpi strong{display:block;font-size:31px;margin:9px 0 4px}.kpi em{font-style:normal;font-size:10px;color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.sectionhead h3{font-size:12px;margin:0}.badge{font-size:9px;padding:5px 7px;border-radius:999px;background:#eef4ff;color:#245fcf;font-weight:800}.rows{display:grid}.row{display:grid;grid-template-columns:1fr auto;gap:16px;padding:11px 0;border-bottom:1px solid #edf0f4}.row:last-child{border-bottom:0}.row b{font-size:11px}.row p{font-size:10px;color:var(--muted);margin:4px 0 0;line-height:1.45}.row .value{font-size:11px;font-weight:800;text-align:right}.bars{height:180px;display:flex;align-items:end;gap:5px;padding-top:18px}.bars i{flex:1;min-width:4px;background:linear-gradient(180deg,#75a0ff,#2f6fed);border-radius:4px 4px 1px 1px}.placeholder{min-height:150px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:11px;border:1px dashed #d9e0e9;border-radius:12px;background:#fafbfd;padding:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:10px}.table th{color:#66748a;font-size:9px;text-transform:uppercase}.ok{color:var(--green);font-weight:800}.warn{color:#b56b00;font-weight:800}.btn{border:1px solid #d8dfe8;background:#fff;border-radius:8px;padding:8px 10px;font-size:10px;font-weight:750;cursor:pointer}.btn:hover{border-color:#aec1df}.pills{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fafbfd;font-size:10px}.errorbox{display:none;margin-bottom:14px;padding:10px 12px;border:1px solid #f1d0d0;background:#fff5f5;color:#8b3030;border-radius:10px;font-size:10px}.errorbox.show{display:block}@media(max-width:1050px){.app{grid-template-columns:210px 1fr}.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}@media(max-width:720px){.app{display:block}.side{position:relative;height:auto}.nav{grid-template-columns:1fr 1fr}.shell{padding:18px 14px}.topbar{display:block}.status{margin-top:12px}.c3,.c4,.c5,.c6,.c7,.c8,.c12{grid-column:span 12}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><b>BLIS™</b><small>BLIS NAVIGATOR</small></div>
<div class="client"><label>КЛИЕНТСКИ ПРОФИЛ</label><select id="clientSel"><option value="aroma">AROMA</option><option value="bolyarka">Болярка</option><option value="astor-garden">Astor Garden</option></select></div>
<nav id="nav" class="nav"></nav>
<a class="home" href="/">← Начален екран</a>
</aside>
<main class="main"><div class="shell">
<div class="topbar"><div><h1 id="clientTitle">AROMA</h1><p>BLIS Navigator · Intelligence monitoring environment</p></div><div class="status"><i class="dot"></i><span id="statusText">Интерфейсът е активен</span></div></div>
<div class="systembar"><div><b>BLIS LIVE · <span id="activeModule">Общ изглед</span></b><br><span id="syncText">Зареждане на данните във фонов режим</span></div><span class="build">BUILD 18.08.STABLE</span></div>
<div id="errorBox" class="errorbox"></div>
<section id="overview" class="page active"></section>
<section id="live" class="page"></section>
<section id="social" class="page"></section>
<section id="digital" class="page"></section>
<section id="reputation" class="page"></section>
<section id="market" class="page"></section>
<section id="competition" class="page"></section>
<section id="signals" class="page"></section>
<section id="reports" class="page"></section>
<section id="sources" class="page"></section>
<section id="history" class="page"></section>
<section id="timeline" class="page"></section>
<section id="profile" class="page"></section>
<section id="settings" class="page"></section>
<section id="help" class="page"></section>
</div></main>
</div>
<script>
(function(){
'use strict';
const NAV=[['overview','⌂','Общ изглед'],['live','◉','Live Monitoring'],['social','✣','Социални канали'],['digital','◎','Дигитална видимост'],['reputation','◇','Репутация'],['market','↗','Пазарни сигнали'],['competition','⚑','Конкуренти'],['signals','!','Сигнали'],['reports','▤','Месечни доклади'],['sources','▥','Източници на данни'],['history','◷','История'],['timeline','◫','Intelligence Timeline'],['profile','♙','Клиентски профил'],['settings','⚙','Настройки'],['help','?','Помощ']];
const names={aroma:'AROMA',bolyarka:'Болярка','astor-garden':'Astor Garden'};
let slug=new URLSearchParams(location.search).get('client')||'aroma';
if(!names[slug])slug='aroma';
let D={},S=[],H=[],A=[],Q={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function metric(key){if(key==='blis')return num(D.blis_index);const x=(D.indices||[]).find(i=>i.key===key);return x?num(x.value):null}
function num(v){const n=Number(v);return Number.isFinite(n)?n:null}
function shown(v){return v==null?'—':Number.isInteger(v)?String(v):v.toFixed(1)}
function title(t,s){return `<div class="title"><h2>${esc(t)}</h2><p>${esc(s)}</p></div>`}
function kpi(label,value,note){return `<div class="card c3 kpi"><small>${esc(label)}</small><strong>${esc(value)}</strong><em>${esc(note)}</em></div>`}
function rows(items){return `<div class="rows">${items.map(x=>`<div class="row"><div><b>${esc(x[0])}</b><p>${esc(x[1]||'')}</p></div><div class="value">${esc(x[2]||'')}</div></div>`).join('')}</div>`}
function sourceRows(limit=10){if(!S.length)return '<div class="placeholder">Източниците се зареждат независимо от навигацията. Менюто остава активно.</div>';return rows(S.slice(0,limit).map(x=>[x.label,x.method||'Публичен източник','Активен']))}
function activityRows(limit=10){if(!A.length)return '<div class="placeholder">Няма налични нови измервания за показване.</div>';return rows(A.slice(0,limit).map(x=>[x.metric||'Измерване',x.source||'',String(x.value??'—')]))}
function renderOverview(){return title('Общ изглед','Обобщена картина на активните BLIS показатели и сигнали.')+`<div class="grid">${kpi('BLIS общ индекс',shown(metric('blis')),'текуща стойност')}${kpi('Дигитална видимост',shown(metric('digital')),'индекс /100')}${kpi('Репутация',shown(metric('reputation')),'индекс /100')}${kpi('Социално присъствие',shown(metric('presence')),'индекс /100')}<div class="card c7"><div class="sectionhead"><h3>Последни измервания</h3><span class="badge">LIVE DATA</span></div>${activityRows(8)}</div><div class="card c5"><div class="sectionhead"><h3>Активни източници</h3><span class="badge">${S.length}</span></div>${sourceRows(6)}</div></div>`}
function renderLive(){return title('Live Monitoring','Текущ статус на източниците, проверките и постъпващите измервания.')+`<div class="grid">${kpi('Активни източници',String(S.length),'наблюдавани канали')}${kpi('Покритие',shown(Q.coverage)+'%','информационно покритие')}${kpi('Измервания',String(A.length),'последна активност')}${kpi('Сигнали',String((D.signals||[]).length),'активни наблюдения')}<div class="card c6"><div class="sectionhead"><h3>Статус на източниците</h3><span class="badge">AUTO</span></div>${sourceRows(10)}</div><div class="card c6"><div class="sectionhead"><h3>Активност</h3><span class="badge">24H</span></div><div class="bars">${Array.from({length:24},(_,i)=>`<i style="height:${28+((i*29)%130)}px"></i>`).join('')}</div></div></div>`}
function renderSocial(){const src=S.filter(x=>/facebook|instagram|linkedin|youtube|tiktok/i.test((x.key||'')+' '+(x.label||'')));return title('Социални канали','Публични профили, съдържание, активност и динамика.')+`<div class="grid">${kpi('Социален индекс',shown(metric('presence')),'индекс /100')}${kpi('Канали',String(src.length),'активни социални източници')}${kpi('Измервания',String(A.filter(x=>/follower|post|social/i.test(x.metric||'')).length),'социална активност')}${kpi('Статус','Активен','наблюдението работи')}<div class="card c12">${src.length?rows(src.map(x=>[x.label,x.method,'Наблюдаван'])):'<div class="placeholder">Няма потвърдени социални източници.</div>'}</div></div>`}
function renderDigital(){return title('Дигитална видимост','Сайт, търсене, e-commerce и публична откриваемост.')+`<div class="grid">${kpi('Дигитален индекс',shown(metric('digital')),'индекс /100')}${kpi('Покритие',shown(Q.coverage)+'%','качество на данните')}${kpi('Уеб източници',String(S.filter(x=>/site|web|google|search|shop/i.test((x.key||'')+' '+(x.label||''))).length),'активни')}${kpi('Статус','Активен','автоматично наблюдение')}<div class="card c12">${activityRows(12)}</div></div>`}
function renderReputation(){return title('Репутация','Оценки, отзиви, медийни споменавания и промени във възприятието.')+`<div class="grid">${kpi('Репутационен индекс',shown(metric('reputation')),'индекс /100')}${kpi('Сигнали',String((D.signals||[]).length),'активни')}${kpi('Източници',String(S.filter(x=>/review|rating|news|media|google/i.test((x.key||'')+' '+(x.label||''))).length),'репутационни')}${kpi('Статус','Активен','наблюдението работи')}<div class="card c12">${activityRows(12)}</div></div>`}
function renderMarket(){return title('Пазарни сигнали','Теми, промени и движения в наблюдаваната среда.')+`<div class="grid">${kpi('Активни сигнали',String((D.signals||[]).length),'за текущия период')}${kpi('Източници',String(S.length),'общо наблюдавани')}${kpi('Покритие',shown(Q.coverage)+'%','използваеми данни')}${kpi('Радар','Активен','постоянно сканиране')}<div class="card c12">${(D.signals||[]).length?rows(D.signals.slice(0,12).map(x=>[x.title||x.label,x.description||x.detail||'','Сигнал'])):'<div class="placeholder">Няма нов потвърден пазарен сигнал. Наблюдението продължава.</div>'}</div></div>`}
function renderCompetition(){const c=D.competitors||[];return title('Конкуренти','Сравнителен контекст и конкурентно позициониране.')+`<div class="grid">${kpi('Наблюдавани конкуренти',String(c.length),'активен списък')}${kpi('BLIS индекс',shown(metric('blis')),'клиентска стойност')}${kpi('Данни',String(A.length),'текущи измервания')}${kpi('Статус','Активен','сравнителна среда')}<div class="card c12">${c.length?rows(c.map(x=>[x.name||'Конкурент','Сравнително наблюдение',shown(num(x.score))])):'<div class="placeholder">Конкурентната база се натрупва.</div>'}</div></div>`}
function renderSignals(){const s=D.signals||[];return title('Сигнали','Промени, рискове и наблюдения, които заслужават внимание.')+`<div class="grid">${kpi('Общо сигнали',String(s.length),'текущ период')}${kpi('Нови','—','автоматична класификация')}${kpi('Приоритетни','—','след потвърждение')}${kpi('Статус','Активен','signal engine')}<div class="card c12">${s.length?rows(s.map(x=>[x.title||x.label,x.description||x.detail||'','Наблюдение'])):'<div class="placeholder">Няма активен критичен сигнал.</div>'}</div></div>`}
function renderReports(){return title('Месечни доклади','Достъп до регулярните аналитични отчети.')+`<div class="grid"><div class="card c12"><div class="pills"><button class="btn">Дигитално присъствие</button><button class="btn">Репутация</button><button class="btn">Пазарни сигнали</button><button class="btn">Конкурентно позициониране</button><button class="btn">Месечно обобщение</button></div></div></div>`}
function renderSources(){return title('Източници на данни','Публични, секторни и референтни източници в текущия профил.')+`<div class="card">${sourceRows(100)}</div>`}
function renderHistory(){return title('История','Натрупани snapshots и сравними измервания във времето.')+`<div class="grid">${kpi('Snapshots',String(H.length),'исторически записи')}${kpi('Измервания',String(A.length),'текуща активност')}${kpi('Източници',String(S.length),'наблюдавани')}${kpi('Статус','Активен','историята се натрупва')}<div class="card c12">${H.length?rows(H.slice(-12).reverse().map(x=>[x.created_at||'Snapshot','Исторически запис','Запазен'])):'<div class="placeholder">Историческата база ще се появи след натрупване на snapshots.</div>'}</div></div>`}
function renderTimeline(){const list=A.slice(0,20);return title('Intelligence Timeline','Хронология на последните измервания и промени.')+`<div class="card">${list.length?rows(list.map(x=>[x.metric||'Измерване',x.time||x.observed_at||x.source||'',String(x.value??'—')])):'<div class="placeholder">Няма нови събития за показване.</div>'}</div>`}
function renderProfile(){return title('Клиентски профил','Основна информация за активния профил.')+`<div class="grid">${kpi('Клиент',names[slug],'активен профил')}${kpi('Сектор',D.sector||'—','профилна информация')}${kpi('Източници',String(S.length),'активни')}${kpi('BLIS',shown(metric('blis')),'общ индекс')}<div class="card c12"><div class="placeholder">Профилът е свързан с текущите API данни. Смяната на клиента не блокира навигацията.</div></div></div>`}
function renderSettings(){return title('Настройки','Локални настройки на визуализацията и профила.')+`<div class="grid"><div class="card c6">${rows([['Език','Интерфейс на платформата','Български'],['Часова зона','Локално време','Europe/Sofia'],['Автоматично опресняване','API данни','Активно']])}</div><div class="card c6"><div class="placeholder">Допълнителните настройки могат да се добавят без да засягат основната навигация.</div></div></div>`}
function renderHelp(){return title('Помощ','Кратки насоки за работа с Navigator.')+`<div class="grid"><div class="card c4"><b>Индекси</b><p class="title">Стойностите се показват само когато има налични измервания.</p></div><div class="card c4"><b>Live Monitoring</b><p class="title">Интерфейсът остава активен дори при недостъпен API endpoint.</p></div><div class="card c4"><b>Източници</b><p class="title">Всеки активен публичен източник се показва отделно.</p></div></div>`}
const renderers={overview:renderOverview,live:renderLive,social:renderSocial,digital:renderDigital,reputation:renderReputation,market:renderMarket,competition:renderCompetition,signals:renderSignals,reports:renderReports,sources:renderSources,history:renderHistory,timeline:renderTimeline,profile:renderProfile,settings:renderSettings,help:renderHelp};
function render(id){$(id).innerHTML=(renderers[id]||renderHelp)()}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));$('activeModule').textContent=(NAV.find(x=>x[0]===id)||[])[2]||id;render(id);try{history.replaceState(null,'','#'+id)}catch(e){}}
function buildNav(){$('nav').innerHTML=NAV.map((x,i)=>`<button type="button" data-page="${x[0]}" class="${i===0?'active':''}"><span class="navico">${x[1]}</span><span>${x[2]}</span></button>`).join('');$('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;show(b.dataset.page)})}
async function getJSON(url,fallback,timeout=5000){const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),timeout);try{const r=await fetch(url,{cache:'no-store',signal:ctrl.signal});if(!r.ok)throw new Error(r.status+' '+url);return await r.json()}finally{clearTimeout(t)}}
async function load(){const results=await Promise.allSettled([getJSON(`/api/clients/${slug}/dashboard`,{}),getJSON(`/api/clients/${slug}/sources`,[]),getJSON(`/api/clients/${slug}/history`,[]),getJSON(`/api/clients/${slug}/activity`,[]),getJSON(`/api/clients/${slug}/data-quality`,{})]);D=results[0].status==='fulfilled'?results[0].value:{};S=results[1].status==='fulfilled'&&Array.isArray(results[1].value)?results[1].value:[];H=results[2].status==='fulfilled'&&Array.isArray(results[2].value)?results[2].value:[];A=results[3].status==='fulfilled'&&Array.isArray(results[3].value)?results[3].value:[];Q=results[4].status==='fulfilled'?results[4].value:{};const failed=results.filter(x=>x.status==='rejected').length;$('syncText').textContent=failed?`Интерфейсът работи · ${failed} API заявки не отговориха`:'Данните са синхронизирани';$('statusText').textContent=failed?'Интерфейс активен · частични данни':'Интерфейс и данни активни';$('errorBox').classList.toggle('show',failed>0);$('errorBox').textContent=failed?`Навигацията работи независимо от API. ${failed} заявки са прекъснати след 5 секунди.`:'';document.querySelectorAll('.page.active').forEach(p=>render(p.id))}
function init(){buildNav();$('clientSel').value=slug;$('clientTitle').textContent=names[slug];$('clientSel').addEventListener('change',e=>{slug=e.target.value;$('clientTitle').textContent=names[slug];history.replaceState(null,'',`?client=${encodeURIComponent(slug)}#overview`);show('overview');load()});const h=location.hash.slice(1),initial=NAV.some(x=>x[0]===h)?h:'overview';show(initial);load()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
</body>
</html>
