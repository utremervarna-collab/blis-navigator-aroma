name: Restore Navigator Sidebar Icons
on:
  push:
    paths:
      - '.github/workflows/restore-nav-icons.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore SVG icons in canonical navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('static/navigator-reference.js')
          s=p.read_text()
          marker='function nav(){let n=document.getElementById(\'nav\');if(!n)return;'
          if marker not in s:
              raise SystemExit('canonical nav() marker not found')
          helper=r'''const NAV_ICONS={
          overview:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>',
          live:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 12l6-4M12 4v2M20 12h-2M12 20v-2M4 12h2"/>',
          social:'<circle cx="9" cy="8" r="3"/><path d="M3 20c1-4 3-6 6-6s5 2 6 6M16 6c2 0 4 1 4 3s-1 3-3 3M17 14c2 .5 3.5 2 4 4"/>',
          digital:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9c-3-3-4-6-4-9s1-6 4-9"/>',
          reputation:'<path d="M20 5c-2-2-5-2-7 0l-1 1-1-1c-2-2-5-2-7 0s-2 5 0 7l8 8 8-8c2-2 2-5 0-7z"/>',
          market:'<path d="M3 15h4l2-7 4 11 2-6h6"/>',
          competition:'<path d="M8 4h8v4c0 4-2 7-4 8-2-1-4-4-4-8V4zM8 6H5c0 3 1 5 4 6M16 6h3c0 3-1 5-4 6M12 16v4M8 20h8"/>',
          signals:'<path d="M6 16h12l-1.5-2v-4a4.5 4.5 0 0 0-9 0v4L6 16zM10 19h4"/>',
          reports:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
          sources:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 2 4 3 8 3s8-1 8-3V5M4 12v7c0 2 4 3 8 3s8-1 8-3v-7"/>',
          history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2M5 5 3 7"/>',
          timeline:'<path d="M5 5v14M5 8h6M11 8v5h7M18 13v5"/><circle cx="5" cy="5" r="2"/><circle cx="11" cy="8" r="2"/><circle cx="18" cy="13" r="2"/><circle cx="18" cy="19" r="2"/>',
          profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 3-7 8-7s7 2 8 7"/>',
          settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',
          help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.7 2.7 0 1 1 4.1 2.3c-1 .6-1.6 1.1-1.6 2.2M12 17h.01"/>'
          };
          function navIcon(id){return `<svg viewBox="0 0 24 24" aria-hidden="true">${NAV_ICONS[id]||NAV_ICONS.overview}</svg>`}
          '''
          if 'const NAV_ICONS={' not in s:
              s=s.replace(marker,helper+marker,1)
          old='<span class="navico">${p[1]}</span>'
          new='<span class="navico">${navIcon(p[0])}</span>'
          if old not in s:
              raise SystemExit('nav icon template marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          d=Path('static/dashboard.html')
          h=d.read_text()
          oldref='/navigator-reference.js?v=20260818-stable1'
          newref='/navigator-reference.js?v=20260819-navicons1'
          if oldref not in h and newref not in h:
              raise SystemExit('navigator-reference cache marker not found')
          h=h.replace(oldref,newref)
          d.write_text(h)
          PY
          git rm .github/workflows/restore-nav-icons.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/navigator-reference.js static/dashboard.html
          git commit -m 'Restore SVG icons in Navigator sidebar'
          git push origin HEAD:main
      - name: Install browser verifier
        run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify icons on production
        shell: bash
        run: |
          cat > /tmp/verify-icons.cjs <<'NODE'
          const { chromium }=require('playwright-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            let last='';
            for(let i=1;i<=36;i++){
              const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
              try{
                await page.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=aroma',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(1800);
                const state=await page.evaluate(async()=>{
                  const html=await (await fetch('/dashboard.html?x='+Date.now(),{cache:'no-store'})).text();
                  const buttons=[...document.querySelectorAll('#nav button[data-page]')];
                  const svgs=[...document.querySelectorAll('#nav button[data-page] .navico svg')];
                  const visible=svgs.filter(x=>{const r=x.getBoundingClientRect(),c=getComputedStyle(x);return r.width>=16&&r.height>=16&&c.display!=='none'&&c.visibility!=='hidden'}).length;
                  return {key:html.includes('navigator-reference.js?v=20260819-navicons1'),buttons:buttons.length,svgs:svgs.length,visible,pages:buttons.map(b=>b.dataset.page)};
                });
                console.log('ATTEMPT',i,JSON.stringify(state));
                if(!state.key||state.buttons<15||state.svgs!==state.buttons||state.visible!==state.buttons)throw new Error('icons not live yet');
                await page.locator('.side').screenshot({path:'navigator-sidebar-icons-restored.png'});
                await page.close();await browser.close();return;
              }catch(e){last=e.message;await page.close();if(i<36)await sleep(10000)}
            }
            await browser.close();throw new Error(last||'production verification failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/verify-icons.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigator-sidebar-icons-restored
          path: navigator-sidebar-icons-restored.png
