name: Navigator English Real User Production QA

on:
  push:
    branches: [ main ]
    paths:
      - 'static/blis-i18n*.js'
      - 'static/navigator-*.js'
      - 'static/navigator-*.css'
      - 'zz_dashboard_en_complete.go'
      - '.github/workflows/navigator-i18n-real-user-prod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-user-en:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Real user EN reload audit
        run: |
          cat >/tmp/real-user-en.cjs <<'NODE'
          const {chromium}=require(process.env.GITHUB_WORKSPACE+'/node_modules/playwright');
          const origin='https://blis-navigator-aroma.onrender.com';
          const clients=['aroma','bolyarka','mollox','varna-towers','everbet','astor-garden','wirello'];
          const routes=['overview','social','market','digital','reputation','competition','opportunities','history','reports'];
          const cyr=/[А-Яа-яЁёЀ-ӿ]/;
          const norm=s=>(s||'').replace(/\s+/g,' ').trim();
          const residual=new Map(),errors=[];
          function add(kind,text,where){text=norm(text);if(!text||!cyr.test(text))return;const k=kind+'\0'+text;if(!residual.has(k))residual.set(k,{kind,text,where:[]});const r=residual.get(k);if(r.where.length<12&&!r.where.includes(where))r.where.push(where)}
          async function scan(page,where){
            const rows=await page.evaluate(()=>{
              const cyr=/[А-Яа-яЁёЀ-ӿ]/,norm=s=>(s||'').replace(/\s+/g,' ').trim(),out=[];
              const skip=/SCRIPT|STYLE|NOSCRIPT|TEMPLATE|TEXTAREA/;
              const w=document.createTreeWalker(document.body||document.documentElement,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||skip.test(p.tagName))return NodeFilter.FILTER_REJECT;const t=norm(n.nodeValue);return t&&cyr.test(t)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
              while(w.nextNode())out.push({kind:'text',text:norm(w.currentNode.nodeValue)});
              for(const el of document.querySelectorAll('[title],[aria-label],[placeholder],[alt],input[value],button[value]'))for(const a of ['title','aria-label','placeholder','alt','value']){const v=el.getAttribute(a);if(v&&cyr.test(v))out.push({kind:a,text:norm(v)})}
              for(const el of document.querySelectorAll('body *'))for(const pseudo of ['::before','::after']){try{let v=getComputedStyle(el,pseudo).content||'';if(v==='none'||v==='normal'||v==='""'||v==="''")continue;v=v.replace(/^['"]|['"]$/g,'');if(cyr.test(v))out.push({kind:'pseudo'+pseudo,text:norm(v)})}catch(_){}}
              if(document.title&&cyr.test(document.title))out.push({kind:'title',text:norm(document.title)});
              for(const t of (window.__blisCanvasTexts||[]))if(cyr.test(String(t)))out.push({kind:'canvas',text:norm(String(t))});
              return out;
            });
            rows.forEach(r=>add(r.kind,r.text,where));
          }
          async function settleAndScroll(page){
            await page.waitForTimeout(3200);
            await page.evaluate(async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=700){scrollTo(0,y);await new Promise(r=>setTimeout(r,120))}scrollTo(0,0)});
            await page.waitForTimeout(1200);
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const route of routes){
              const batch=clients.map(async client=>{
                const context=await browser.newContext({viewport:{width:1600,height:1000}});
                await context.addInitScript(()=>{
                  localStorage.setItem('blis.language.v1','en');
                  window.__blisCanvasTexts=[];
                  const patch=(proto,name)=>{if(!proto||typeof proto[name]!=='function')return;const orig=proto[name];proto[name]=function(text,...args){try{window.__blisCanvasTexts.push(String(text))}catch(_){}return orig.call(this,text,...args)}};
                  try{patch(CanvasRenderingContext2D.prototype,'fillText');patch(CanvasRenderingContext2D.prototype,'strokeText')}catch(_){}
                  try{if(typeof OffscreenCanvasRenderingContext2D!=='undefined'){patch(OffscreenCanvasRenderingContext2D.prototype,'fillText');patch(OffscreenCanvasRenderingContext2D.prototype,'strokeText')}}catch(_){}
                });
                const page=await context.newPage(); const where=`${client}:${route}`;
                try{
                  await page.goto(`${origin}/dashboard.html?client=${client}&page=${route}&lang=en`,{waitUntil:'domcontentloaded',timeout:30000});
                  await settleAndScroll(page);
                  await page.reload({waitUntil:'domcontentloaded',timeout:30000});
                  await settleAndScroll(page);
                  const lang=await page.evaluate(()=>document.documentElement.lang);
                  const sw=await page.evaluate(()=>document.querySelector('[data-blis-language-switch]')?.textContent||'');
                  if(lang!=='en')errors.push(`${where}: lang=${lang}`);
                  if(sw!=='BG')errors.push(`${where}: switch=${sw}`);
                  await scan(page,where);
                }catch(e){errors.push(`${where}: ${e.message}`)}finally{await context.close()}
              });
              await Promise.all(batch);
            }
            await browser.close();
            console.log('REAL_USER_PRODUCTION_RESIDUAL',residual.size,[...residual.values()].reduce((s,x)=>s+x.where.length,0));
            for(const r of residual.values())console.log(r.kind,'|',r.text,'|',r.where.join(','));
            errors.forEach(e=>console.log('ERROR',e));
            if(residual.size||errors.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/real-user-en.cjs
