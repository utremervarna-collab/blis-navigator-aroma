name: Varna Towers Hero Final
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify production hero
        run: |
          cat > hero.cjs <<'NODE'
          const { chromium }=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const p=await b.newPage({viewport:{width:1440,height:900}});
            let last='';
            for(let i=0;i<8;i++){
              try{
                await p.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=varna-towers',{waitUntil:'domcontentloaded',timeout:30000});
                await p.waitForTimeout(2500);
                const s=await p.evaluate(()=>({client:document.body.dataset.client,bg:document.querySelector('.topbar .client-photo-bg')?.style.backgroundImage||'',opacity:document.querySelector('.topbar .client-photo-bg')?.style.opacity||'',name:document.querySelector('.client-brand-name')?.textContent||''}));
                console.log(JSON.stringify(s));
                if(s.client==='varna-towers'&&s.name==='Varna Towers'&&s.bg.includes('varna-towers-profile-hero.jpg')&&s.opacity==='1'){await b.close();return;}
                last='hero not deployed yet';
              }catch(e){last=e.message}
              await new Promise(r=>setTimeout(r,5000));
            }
            await b.close();throw new Error(last||'hero verification failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node hero.cjs
