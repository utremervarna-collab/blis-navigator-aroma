name: Navigator 3 Browser QA

on:
  push:
    branches:
      - feature/navigator-3-bg-client-clarity
      - release/navigator-3-production
    paths:
      - 'static/navigator-3-*.js'
      - 'static/navigator-production-entry-v1.js'
      - 'static/navigator-system-structure-v1.js'
      - '.github/workflows/navigator-3-browser-qa.yml'
  workflow_dispatch:

jobs:
  browser-client-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and start feature server
        run: |
          set -euo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app >/tmp/nav3-browser-server.log 2>&1 &
          echo $! >/tmp/nav3-browser.pid
          ready=0
          for i in $(seq 1 60); do
            if curl --max-time 3 -fsS http://127.0.0.1:10000/api/health >/tmp/nav3-health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/nav3-browser-server.log || true; exit 1; fi

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Verify preserved visual owners and simplified client journey
        run: |
          mkdir -p /tmp/nav3-shots
          cat >/tmp/nav3-browser.cjs <<'NODE'
          const { chromium }=require(process.env.GITHUB_WORKSPACE+'/node_modules/playwright');
          const path=require('path');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const origin='http://127.0.0.1:10000';
          const clients=['aroma','bolyarka','mollox','varna-towers','astor-garden','wirello','everbet'];
          const pages=['overview','social','market','competition','history','hub','calendar'];
          const core=['overview','social','market','competition','history'];
          const labels=['Общ преглед','Сигнали и наблюдение','Пазар и репутация','Конкуренция','Развитие и доклади','Intelligence HUB','Календар'];
          const context={overview:'Общ преглед',social:'Сигнали и наблюдение',market:'Пазар и репутация',competition:'Конкуренция',history:'Развитие и доклади',hub:'Intelligence HUB',calendar:'Календар'};
          const reviewClients=new Set(['aroma','mollox']);

          async function visibleBox(p,selector,label){
            const box=await p.locator(selector).first().boundingBox().catch(()=>null);
            assert(box&&box.width>120&&box.height>60,`${label}: missing or collapsed visual ${selector} ${JSON.stringify(box)}`);
            return box;
          }
          async function state(p){return p.evaluate(()=>({
            active:document.querySelector('.page.active')?.id||'',
            version:document.documentElement.dataset.navigatorVersion||'',
            architecture:document.documentElement.dataset.navigatorArchitecture||'',
            gauge:!!document.querySelector('#overview .ovh-gauge svg'),
            radar:!!document.querySelector('#social #digital #digitalBody .dv-radar-wrap .dv-radar-grid'),
            radarScope:document.documentElement.dataset.navigatorRadarScope||'',
            liveStrip:!!document.querySelector('#social .n3-live-strip'),
            market:!!document.querySelector('#market .pm-stage,#market .pm-canvas'),
            marketSummary:!!document.querySelector('#market [data-n3-market-summary]'),
            competition:!!document.querySelector('#competition .vs-comp-axis'),
            competitionChanges:!!document.querySelector('#competition [data-n3-competition-changes]'),
            history:!!document.querySelector('#history .vs-history-board'),
            reports:!!document.querySelector('#history [data-n3-embedded-reports]'),
            nativeFallbacks:document.querySelectorAll('.n3-native,.n3-native-overview,.n3-native-social,.n3-native-market,.n3-native-competition').length
          }))}

          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const client of clients){
                const p=await browser.newPage({viewport:{width:1440,height:1000}});
                const errors=[];
                p.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
                p.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource|ERR_NAME_NOT_RESOLVED|net::ERR_/i.test(m.text()))errors.push('CONSOLE '+m.text())});
                await p.goto(`${origin}/dashboard.html?client=${client}&page=overview`,{waitUntil:'domcontentloaded',timeout:25000});
                await p.waitForFunction(()=>window.__BLIS_NAVIGATOR_3_ARCHITECTURE_V1&&window.__BLIS_NAVIGATOR_3_CLIENT_CLARITY_V1&&window.__BLIS_NAVIGATOR_3_CLIENT_PROOF_V1,null,{timeout:16000});
                await p.waitForFunction(()=>document.querySelectorAll('#nav [data-n3-page]').length===7,null,{timeout:10000});

                const start=await p.evaluate(()=>({
                  lang:document.documentElement.lang,
                  language:window.BLIS_LANGUAGE,
                  switcher:!!document.querySelector('.bch3-lang'),
                  labels:[...document.querySelectorAll('#nav [data-n3-page] .navtxt')].map(x=>x.textContent.trim()),
                  legacy:document.querySelectorAll('#nav [data-page]').length,
                  version:document.documentElement.dataset.navigatorVersion||''
                }));
                assert(start.lang==='bg'&&start.language==='bg',`${client}: Bulgarian lock missing`);
                assert(!start.switcher,`${client}: language switcher visible`);
                assert(start.labels.join('|')===labels.join('|'),`${client}: wrong 5+2 navigation ${start.labels.join('|')}`);
                assert(start.legacy===0,`${client}: legacy navigation still visible`);
                assert(start.version==='3.0-preserved-visuals-5plus2',`${client}: wrong Navigator 3 version ${start.version}`);

                for(const id of pages){
                  console.log('CHECK_PAGE',client,id);
                  await p.evaluate(id=>window.refGo(id),id);
                  await p.waitForFunction(id=>document.querySelector('.page.active')?.id===id,id,{timeout:8000});
                  await p.waitForFunction(expected=>document.querySelector('.bch3-context-title')?.textContent?.trim()===expected,context[id],{timeout:5000});

                  if(id==='overview'){
                    await p.waitForFunction(()=>!!document.querySelector('#overview .ovh-gauge svg'),null,{timeout:9000});
                    await visibleBox(p,'#overview .ovh-gauge',`${client}/overview`);
                    const colors=await p.evaluate(()=>[...document.querySelectorAll('#overview .ovh-arc.risk,#overview .ovh-arc.watch,#overview .ovh-arc.stable,#overview .ovh-arc.good')].map(x=>getComputedStyle(x).stroke));
                    assert(colors.length===4&&new Set(colors).size===4,`${client}/overview: approved multicolor BLIS gauge lost ${JSON.stringify(colors)}`);
                  }
                  if(id==='social'){
                    await p.waitForFunction(()=>!!document.querySelector('#social #digital #digitalBody .dv-radar-wrap .dv-radar-grid')&&!!document.querySelector('#social .n3-live-strip'),null,{timeout:9000});
                    const radarBox=await visibleBox(p,'#social .dv-radar-wrap',`${client}/social`);
                    assert(radarBox.width>=320&&radarBox.width<=620&&radarBox.height>=320&&radarBox.height<=620,`${client}/social: radar geometry lost ${JSON.stringify(radarBox)}`);
                    const radarStyle=await p.evaluate(()=>{
                      const grid=document.querySelector('#social #digital #digitalBody .dv-radar-grid');
                      const stage=document.querySelector('#social #digital #digitalBody .dv-stage');
                      const icon=document.querySelector('#social #digital #digitalBody .dv-radar-sector svg');
                      const g=getComputedStyle(grid),st=stage?getComputedStyle(stage):null,ic=icon?getComputedStyle(icon):null;
                      return{scope:!!document.querySelector('#social #digital.n3-canonical-digital-scope'),background:g.backgroundImage,border:g.borderRadius,stage:st?.display||'',iconW:parseFloat(ic?.width||'0'),iconH:parseFloat(ic?.height||'0')};
                    });
                    assert(radarStyle.scope&&radarStyle.background!=='none'&&radarStyle.stage==='grid',`${client}/social: original Digital Radar CSS scope lost ${JSON.stringify(radarStyle)}`);
                    assert(radarStyle.iconW>0&&radarStyle.iconW<=24&&radarStyle.iconH>0&&radarStyle.iconH<=24,`${client}/social: radar SVG sizing broken ${JSON.stringify(radarStyle)}`);
                    const kpisHidden=await p.evaluate(()=>{const el=document.querySelector('#social .dv-kpis');return !el||getComputedStyle(el).display==='none'});
                    assert(kpisHidden,`${client}/social: old KPI wall is still visible`);
                  }
                  if(id==='market'){
                    await p.waitForFunction(()=>!!document.querySelector('#market .pm-stage,#market .pm-canvas')&&!!document.querySelector('#market [data-n3-market-summary]'),null,{timeout:9000});
                    await visibleBox(p,'#market .pm-stage,#market .pm-canvas',`${client}/market`);
                    const kpisHidden=await p.evaluate(()=>{const el=document.querySelector('#market .pm-kpis');return !el||getComputedStyle(el).display==='none'});
                    assert(kpisHidden,`${client}/market: old KPI wall is still visible`);
                  }
                  if(id==='competition'){
                    await p.waitForFunction(()=>!!document.querySelector('#competition .vs-comp-axis')&&!!document.querySelector('#competition [data-n3-competition-changes]'),null,{timeout:9000});
                    await visibleBox(p,'#competition .vs-comp-axis',`${client}/competition`);
                  }
                  if(id==='history'){
                    await p.waitForFunction(()=>!!document.querySelector('#history .vs-history-board')&&!!document.querySelector('#history [data-n3-embedded-reports]'),null,{timeout:9000});
                    await visibleBox(p,'#history .vs-history-board',`${client}/history`);
                  }
                  if(id==='hub'||id==='calendar'){
                    await p.waitForFunction(id=>!!document.querySelector(`#${id} .n3-resource-card`),id,{timeout:6000});
                  }

                  const s=await state(p);
                  assert(s.nativeFallbacks===0,`${client}/${id}: replacement n3-native visual detected ${JSON.stringify(s)}`);
                  const untranslated=await p.evaluate(()=>[...document.querySelectorAll('.page.active .vs-vhead em,.page.active .sv2-ch em,.page.active .pm-client-badge i,.page.active .n3-live-strip-head span,.blis-system-primary b')].some(x=>/\bLIVE\b/i.test(x.textContent.trim())));
                  assert(!untranslated,`${client}/${id}: untranslated LIVE remains visible`);

                  if(reviewClients.has(client)&&core.includes(id)){
                    await p.screenshot({path:path.join('/tmp/nav3-shots',`${client}-${id}.png`),fullPage:true});
                  }
                }

                const aliases={digital:'social',opportunities:'social',live:'social',reputation:'market',reports:'history',timeline:'history'};
                for(const [oldId,newId] of Object.entries(aliases)){
                  await p.evaluate(id=>window.refGo(id),oldId);
                  await p.waitForFunction(id=>document.querySelector('.page.active')?.id===id,newId,{timeout:5000});
                }

                await p.evaluate(()=>window.refGo('overview'));
                await p.waitForFunction(()=>!!document.querySelector('#overview.page.active .nv3-story [data-n3p-open]'),null,{timeout:5000});
                await p.evaluate(()=>document.querySelector('#overview.page.active .nv3-story [data-n3p-open]')?.click());
                await p.waitForFunction(()=>document.getElementById('n3pDrawer')?.classList.contains('open'),null,{timeout:4000});
                const proof=await p.locator('#n3pDrawer').innerText();
                assert(/Фактология и източници/i.test(proof)&&/Какво стои зад тази страница/i.test(proof),`${client}: evidence drawer incomplete`);
                await p.evaluate(()=>document.querySelector('[data-n3p-close]')?.click());
                await p.waitForFunction(()=>!document.getElementById('n3pDrawer')?.classList.contains('open'),null,{timeout:3000});

                assert(errors.length===0,`${client}: runtime errors ${errors.join(' | ')}`);
                await p.close();
              }
              console.log('NAVIGATOR_3_PRESERVED_VISUAL_BROWSER_QA_OK');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/nav3-browser.cjs

      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigator3-visual-review
          path: /tmp/nav3-shots/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/nav3-browser-server.log || true
