name: Varna Towers Hero Visible
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify visible production hero
        run: |
          cat > hero-check.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            let last='';
            for(let attempt=1;attempt<=8;attempt++){
              const page=await browser.newPage({viewport:{width:1440,height:1000}});
              try{
                await page.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=varna-towers',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2500);
                const state=await page.evaluate(()=>{
                  const el=document.querySelector('.topbar .client-photo-bg');
                  if(!el)return {exists:false};
                  const cs=getComputedStyle(el);
                  const r=el.getBoundingClientRect();
                  return {exists:true,bg:cs.backgroundImage,opacity:cs.opacity,width:r.width,height:r.height,display:cs.display,visibility:cs.visibility,client:document.body.dataset.client};
                });
                console.log('STATE',JSON.stringify(state));
                const asset=await page.evaluate(async()=>{const r=await fetch('/varna-towers-profile-hero.jpg?v=20260818-vt-hero2',{cache:'no-store'});return {ok:r.ok,status:r.status,type:r.headers.get('content-type'),len:(await r.arrayBuffer()).byteLength}});
                console.log('ASSET',JSON.stringify(asset));
                const ok=state.exists&&state.client==='varna-towers'&&state.bg.includes('varna-towers-profile-hero.jpg')&&Number(state.opacity)>0&&state.width>100&&state.height>50&&state.display!=='none'&&state.visibility!=='hidden'&&asset.ok&&asset.len>10000;
                if(!ok)throw new Error('Varna Towers hero not visibly applied yet');
                await page.screenshot({path:'varna-towers-hero-visible.png',fullPage:false});
                await page.close();await browser.close();return;
              }catch(e){last=e.message;console.log('RETRY',attempt,last);await page.close();if(attempt<8)await new Promise(r=>setTimeout(r,5000));}
            }
            await browser.close();throw new Error(last||'Hero verification failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node hero-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: varna-towers-hero-visible
          path: varna-towers-hero-visible.png
