name: Verify Social Signals Typography
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify readable typography on production
        run: |
          cat > check.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          const px = v => parseFloat(String(v||'0'))||0;
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            let last='';
            for(let i=1;i<=24;i++){
              const page=await browser.newPage({viewport:{width:1680,height:1050},deviceScaleFactor:1});
              try{
                await page.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=aroma',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2500);
                await page.locator('#nav button[data-page="social"]').click();
                await page.waitForTimeout(1000);
                const state=await page.evaluate(()=>{
                  const g=s=>{const e=document.querySelector(s);return e?getComputedStyle(e).fontSize:''};
                  const css=[...document.styleSheets].map(x=>x.href||'').find(x=>x.includes('navigator-social-master.css'))||'';
                  return {
                    css,
                    title:g('#social .ref-title h2'),
                    subtitle:g('#social .ref-title p'),
                    section:g('#social .sm-card-head h3'),
                    sectionText:g('#social .sm-card-head p'),
                    kpiLabel:g('#social .sm-kpi-head'),
                    kpiFoot:g('#social .sm-kpi-foot'),
                    channelName:g('#social .sm-channel-name'),
                    channelMetric:g('#social .sm-channel-metrics span'),
                    listText:g('#social .sm-list-row b'),
                    listSub:g('#social .sm-list-row small'),
                    method:g('#social .sm-method')
                  };
                });
                console.log('ATTEMPT',i,JSON.stringify(state));
                const ok=state.css.includes('20260819-font2')&&px(state.title)>=23&&px(state.subtitle)>=11.5&&px(state.section)>=13.5&&px(state.sectionText)>=10.5&&px(state.kpiLabel)>=10.5&&px(state.kpiFoot)>=9.5&&(!state.channelName||px(state.channelName)>=11)&&(!state.channelMetric||px(state.channelMetric)>=9)&&(!state.listText||px(state.listText)>=10.5)&&(!state.listSub||px(state.listSub)>=9.5)&&px(state.method)>=10;
                if(!ok)throw new Error('Readable Social Signals typography not ready');
                await page.locator('#social').screenshot({path:'social-signals-readable.png',fullPage:true});
                await page.close();await browser.close();return;
              }catch(e){last=e.message;console.log('RETRY',i,last);await page.close();if(i<24)await new Promise(r=>setTimeout(r,10000));}
            }
            await browser.close();throw new Error(last||'verification failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-signals-readable
          path: social-signals-readable.png
