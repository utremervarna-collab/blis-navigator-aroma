name: Navigator Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: navigator-production-smoke
  cancel-in-progress: true

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  MIGRATION_BUILD: code-run-migration-2026-09-09-v1

jobs:
  local-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build and start Navigator gateway
        run: |
          set -euxo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app >/tmp/blis-smoke-server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:10000/api/health >/tmp/health.json && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/api/health
          grep -q '"ok":true' /tmp/health.json
          curl -fsS http://127.0.0.1:10000/migration-build.js -o /tmp/build.js
          grep -q "$MIGRATION_BUILD" /tmp/build.js

      - name: Verify canonical visible catalogue
        run: |
          set -euo pipefail
          grep -Fq "const ownerVisibleOrder=['kub','mollox','aroma','bolyarka','delta-planet','wirello'];" static/navigator-client-ui.js
          echo CANONICAL_VISIBLE_CATALOGUE_OK

      - name: Verify public read-only gateway contracts
        run: |
          set -euo pipefail
          test "$(curl -sS -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:10000/client-login)" = "200"
          test "$(curl -sS -o /tmp/aroma.html -w '%{http_code}' 'http://127.0.0.1:10000/dashboard.html?client=aroma&page=overview')" = "200"
          test "$(curl -sS -o /tmp/aroma.json -w '%{http_code}' 'http://127.0.0.1:10000/api/clients/aroma/dashboard')" = "200"
          code=$(curl -sS -D /tmp/kub.headers -o /tmp/kub.body -w '%{http_code}' 'http://127.0.0.1:10000/dashboard.html?client=kub&page=overview')
          test "$code" = "302"
          grep -Eqi '^location: /kub-crisis\.html' /tmp/kub.headers
          test "$(curl -sS -o /tmp/admin.body -w '%{http_code}' http://127.0.0.1:10000/admin.html)" = "404"
          test "$(curl -sS -o /tmp/refresh.body -w '%{http_code}' -X POST http://127.0.0.1:10000/api/clients/wirello/refresh)" = "409"
          curl -fsS http://127.0.0.1:10000/kub-home.html | grep -q 'Корпорация КУБ'
          curl -fsS http://127.0.0.1:10000/wirello | grep -Eqi 'Wirello'
          echo LOCAL_GATEWAY_SMOKE_OK

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/blis-smoke-server.log || true

  production-origin:
    needs: local-regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for migration build on canonical production
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          ok=0
          for i in $(seq 1 42); do
            if curl -fsS --connect-timeout 15 --max-time 30 "$BASE/migration-build.js?ts=$(date +%s)" -o /tmp/build.js && grep -q "$MIGRATION_BUILD" /tmp/build.js; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"

      - name: Verify live code.run contracts and persistence metadata
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          curl -fsS "$BASE/api/health?ts=$(date +%s)" -o /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          curl -fsS "$BASE/api/store/meta?ts=$(date +%s)" -o /tmp/store-meta.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/store-meta.json',encoding='utf-8'))
          assert d.get('ok') is True
          clients=d.get('clients',{})
          for slug in ('aroma','bolyarka','mollox','astor-garden','kub'):
              assert slug in clients, f'{slug} missing from production store metadata'
          print('PRODUCTION_STORE_META_OK', {k:(v.get('snapshots',0),v.get('observations',0)) for k,v in clients.items()})
          PY
          for round in 1 2 3; do
            test "$(curl -sS -o /tmp/home-before-dashboard.html -w '%{http_code}' "$BASE/dashboard.html?client=aroma&page=overview&roundtrip-before=$round&ts=$(date +%s%N)")" = "200"
            grep -Fq 'blisDashboardPrepaintV5' /tmp/home-before-dashboard.html
            test "$(curl -sS -D /tmp/home.headers -o /tmp/home.html -w '%{http_code}' "$BASE/?roundtrip=$round&ts=$(date +%s%N)")" = "200"
            grep -Eqi '^x-blis-home-origin: gateway' /tmp/home.headers
            grep -Fq 'BLIS™' /tmp/home.html
            test "$(curl -sS -o /tmp/home-tape.json -w '%{http_code}' "$BASE/api/public/home-tape?roundtrip=$round&ts=$(date +%s%N)")" = "200"
            python - <<'PY'
          import json
          d=json.load(open('/tmp/home-tape.json',encoding='utf-8'))
          assert d.get('ok') is True
          items=d.get('items') or []
          assert items, 'home tape returned no persisted metrics'
          assert all('client' in x and 'metric' in x and 'value' in x for x in items)
          PY
            test "$(curl -sS -o /tmp/home-return-dashboard.html -w '%{http_code}' "$BASE/dashboard.html?client=aroma&page=overview&roundtrip=$round&ts=$(date +%s%N)")" = "200"
            grep -Fq 'blisDashboardPrepaintV5' /tmp/home-return-dashboard.html
          done
          echo DASHBOARD_HOME_DASHBOARD_ROUNDTRIP_OK
          test "$(curl -sS -o /tmp/aroma.html -w '%{http_code}' "$BASE/dashboard.html?client=aroma&page=overview&ts=$(date +%s)")" = "200"
          grep -Fq 'blisDashboardPrepaintV5' /tmp/aroma.html
          test "$(curl -sS -o /tmp/aroma.json -w '%{http_code}' "$BASE/api/clients/aroma/dashboard?ts=$(date +%s)")" = "200"
          test "$(curl -sS -D /tmp/delta.headers -o /tmp/delta.html -w '%{http_code}' "$BASE/delta-planet?ts=$(date +%s)")" = "200"
          grep -Eqi 'Delta Planet Mall|delta-planet' /tmp/delta.html
          test "$(curl -sS -o /tmp/delta.json -w '%{http_code}' "$BASE/api/clients/delta-planet/dashboard?ts=$(date +%s)")" = "200"
          grep -q '"name":"Delta Planet Mall"' /tmp/delta.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/delta.json',encoding='utf-8'))
          assert float(d.get('blis_index',0))>0, f"Delta BLIS index must be > 0, got {d.get('blis_index')}"
          assert d.get('client')=='delta-planet' or d.get('slug')=='delta-planet', d
          print('DELTA_BLIS_OK', d.get('blis_index'), d.get('confidence'))
          PY
          test "$(curl -sS -o /tmp/delta-home.html -w '%{http_code}' "$BASE/?client=delta-planet&ts=$(date +%s)")" = "200"
          grep -q 'blis-home-client-context' /tmp/delta-home.html
          grep -q '/delta-planet' /tmp/delta-home.html
          test "$(curl -sS -o /tmp/delta-brand-mentions.json -w '%{http_code}' "$BASE/api/public/mentions?client=delta-planet&scope=brand&limit=300&ts=$(date +%s)")" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/delta-brand-mentions.json',encoding='utf-8'))
          rows=d.get('signals') or []
          assert len(rows)>=6, f"Delta must have at least 6 verified recent brand mentions, got {len(rows)}"
          titles=' | '.join(str(x.get('title') or '') for x in rows)
          assert 'Палитра от намаления' in titles, titles
          assert 'Юли е месецът на ваканцията' in titles, titles
          print('DELTA_RECENT_MENTIONS_OK', len(rows))
          PY
          test "$(curl -sS -o /tmp/delta-competitor-mentions.json -w '%{http_code}' "$BASE/api/public/mentions?client=delta-planet&scope=competitor&limit=300&ts=$(date +%s)")" = "200"
          python3 - <<'PY'
          import json
          from collections import Counter
          d=json.load(open('/tmp/delta-competitor-mentions.json',encoding='utf-8'))
          rows=d.get('signals') or []
          counts=Counter(str(x.get('brand') or '') for x in rows)
          required={'Grand Mall Varna','Black Sea Center','Retail Park Varna'}
          missing=[x for x in required if counts[x] < 1]
          assert not missing, f"Missing Delta competitor mentions: {missing}; counts={dict(counts)}"
          assert len(rows)>=9, f"Delta competitor mentions must be >=9, got {len(rows)}"
          print('DELTA_COMPETITOR_MENTIONS_OK', dict(counts))
          PY
          code=$(curl -sS -D /tmp/kub.headers -o /tmp/kub.body -w '%{http_code}' "$BASE/dashboard.html?client=kub&page=overview&ts=$(date +%s)")
          test "$code" = "302"
          grep -Eqi '^location: /kub-crisis\.html' /tmp/kub.headers
          code=$(curl -sS -o /tmp/kub-signals.json -w '%{http_code}' "$BASE/api/signals?client=kub&limit=3&ts=$(date +%s)")
          test "$code" = "401" -o "$code" = "403"
          test "$(curl -sS -o /tmp/refresh.body -w '%{http_code}' -X POST "$BASE/api/clients/wirello/refresh")" = "409"
          wirello_ok=0
          for i in $(seq 1 6); do
            if curl -fsS --connect-timeout 15 --max-time 30 "$BASE/wirello?ts=$(date +%s%N)" -o /tmp/wirello.html && grep -Eqi 'Wirello' /tmp/wirello.html; then
              wirello_ok=1
              break
            fi
            sleep 3
          done
          test "$wirello_ok" = "1"
          echo NAVIGATOR_CODE_RUN_PRODUCTION_OK

      - name: Verify live brand and competitor mention streams
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          fetch_retry() {
            local url="$1"
            local out="$2"
            local ok=0
            for i in $(seq 1 6); do
              if curl -fsS --connect-timeout 15 --max-time 30 "$url" -o "$out"; then
                ok=1
                break
              fi
              sleep 3
            done
            test "$ok" = "1"
          }
          for CLIENT in aroma bolyarka mollox; do
            fetch_retry "$BASE/api/public/mentions?client=$CLIENT&scope=brand&limit=300&ts=$(date +%s%N)" "/tmp/${CLIENT}-brand.json"
            fetch_retry "$BASE/api/public/mentions?client=$CLIENT&scope=competitor&limit=300&ts=$(date +%s%N)" "/tmp/${CLIENT}-competitor.json"
            fetch_retry "$BASE/api/clients/$CLIENT/sources?ts=$(date +%s%N)" "/tmp/${CLIENT}-sources.json"
          done
          fetch_retry "$BASE/navigator-live-refresh-v1.js?ts=$(date +%s%N)" /tmp/live-refresh.js
          grep -Fq 'Хронология на споменаванията' /tmp/live-refresh.js
          grep -Fq 'Хронология на конкурентните споменавания' /tmp/live-refresh.js
          grep -Fq 'blis-ms-ticker' /tmp/live-refresh.js
          grep -Fq '/api/public/mentions' /tmp/live-refresh.js
          python - <<'PY'
          import json, re
          from pathlib import Path

          clients=('aroma','bolyarka','mollox')

          def norm(v):
              return re.sub(r'\s+',' ',str(v or '')).strip().casefold()

          def configured_competitors(slug):
              out=set()
              sources=json.load(open(f'/tmp/{slug}-sources.json',encoding='utf-8'))
              for src in sources:
                  key=norm(src.get('key'))
                  if key.startswith('cmp_') or key.startswith('competitor_'):
                      label=str(src.get('label') or '').strip()
                      if label:
                          out.add(norm(label))
              return out

          summary={}
          for slug in clients:
              allowed=configured_competitors(slug)
              summary[slug]={}
              for scope in ('brand','competitor'):
                  path=Path(f'/tmp/{slug}-{scope}.json')
                  data=json.loads(path.read_text(encoding='utf-8'))
                  assert data.get('client')==slug, (slug,scope,'wrong response client',data.get('client'))
                  rows=data.get('signals') or []
                  assert isinstance(rows,list), (slug,scope,'signals is not a list')
                  for row in rows:
                      assert norm(row.get('client'))==slug, (slug,scope,'cross-client leak',row)
                      rs=norm(row.get('scope'))
                      if scope=='competitor':
                          assert rs=='competitor', (slug,scope,'wrong scope',row)
                          b=norm(row.get('brand'))
                          assert b, (slug,scope,'competitor brand missing',row)
                          if allowed:
                              assert b in allowed, (slug,scope,'unconfigured competitor brand',row.get('brand'),sorted(allowed))
                      else:
                          assert rs in ('external','owned'), (slug,scope,'wrong brand scope',row)
                      assert re.match(r'^https?://',str(row.get('url') or ''),re.I), (slug,scope,'bad URL',row)
                      assert str(row.get('source') or '').strip(), (slug,scope,'source missing',row)
                      assert str(row.get('title') or '').strip(), (slug,scope,'title missing',row)

                  if scope=='competitor' and slug=='bolyarka':
                      brewery_evidence=('пивоварна загорка','пивоварната загорка','загорка ад','загорка а.д.','бира загорка','бирата загорка','загорка beer','загорка пивовар')
                      for row in rows:
                          if norm(row.get('brand'))!='загорка':
                              continue
                          hay=norm((row.get('title') or '')+' '+(row.get('text') or ''))
                          if 'парк загорка' in hay:
                              assert any(x in hay for x in brewery_evidence), ('bolyarka','false positive: park Zagorka',row)

                  summary[slug][scope]={
                      'count':len(rows),
                      'updated_at':data.get('updated_at') or '',
                      'configured_competitors':len(allowed) if scope=='competitor' else None,
                      'sample_titles':[str(x.get('title') or '')[:120] for x in rows[:5]],
                      'sample_brands':[str(x.get('brand') or '') for x in rows[:10]] if scope=='competitor' else [],
                  }

          print('LIVE_MENTION_STREAM_QA_OK')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Publish production migration status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const state='${{ job.status }}'==='success'?'success':'failure';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'navigator-code-run-production',description:state==='success'?'code.run production migration passed':'code.run production migration failed'});
