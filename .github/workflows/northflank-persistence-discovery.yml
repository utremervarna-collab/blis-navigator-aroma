name: Northflank Persistence Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/northflank-persistence-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Discover existing Navigator service and persistent volumes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NF_TOKEN:-}" ]; then
            echo 'NORTHFLANK_TOKEN_NOT_AVAILABLE'
            exit 2
          fi
          api='https://api.northflank.com/v1'
          auth=(-H "Authorization: Bearer ${NF_TOKEN}" -H 'Accept: application/json')
          curl -fsS "${auth[@]}" "$api/projects?per_page=100" -o /tmp/projects.json
          python - <<'PY' >/tmp/project_ids
          import json
          d=json.load(open('/tmp/projects.json'))
          for p in d.get('data',{}).get('projects',[]):
              print(p.get('id',''))
          PY
          found=''
          while IFS= read -r project; do
            [ -n "$project" ] || continue
            curl -fsS "${auth[@]}" "$api/projects/$project/services?per_page=100" -o /tmp/services.json || continue
            service=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/services.json'))
          for s in d.get('data',{}).get('services',[]):
              if s.get('id')=='blis-navigator-aroma' or s.get('name')=='blis-navigator-aroma':
                  print(s.get('id',''))
                  break
          PY
            )
            if [ -n "$service" ]; then
              found="$project/$service"
              curl -fsS "${auth[@]}" "$api/projects/$project/services/$service" -o /tmp/service.json
              break
            fi
          done </tmp/project_ids
          if [ -z "$found" ]; then
            echo 'NORTHFLANK_NAVIGATOR_SERVICE_NOT_FOUND'
            exit 3
          fi
          echo "NORTHFLANK_SERVICE=$found"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/service.json')).get('data',{})
          dep=d.get('deployment') or {}
          vols=dep.get('volumes') or d.get('volumes') or []
          clean=[]
          for v in vols:
              clean.append({'id':v.get('id'),'mounts':v.get('mounts',[]),'storageSize':(v.get('spec') or {}).get('storageSize'),'storageClassName':(v.get('spec') or {}).get('storageClassName')})
          print('NORTHFLANK_INSTANCES='+str(dep.get('instances')))
          print('NORTHFLANK_VOLUMES='+json.dumps(clean,separators=(',',':')))
          if not clean:
              raise SystemExit(4)
          PY
