name: One-shot store serialization lock

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-store-lock.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch saveStore serialization lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('main.go')
          s = p.read_text(encoding='utf-8')
          old = 'func saveStore() { b, _ := json.MarshalIndent(store, "", "  "); _ = os.WriteFile(dataPath, b, 0644) }'
          new = '''func saveStore() {
          \tobsMu.Lock()
          \tb, _ := json.MarshalIndent(store, "", "  ")
          \tobsMu.Unlock()
          \t_ = os.WriteFile(dataPath, b, 0644)
          }'''
          if old not in s:
              raise SystemExit('expected saveStore implementation not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          gofmt -w main.go
          go test ./...
          git diff --check
          git diff -- main.go

      - name: Commit exact lock fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "blis-ci"
          git config user.email "blis-ci@users.noreply.github.com"
          git add main.go
          git diff --cached --quiet && exit 0
          git commit -m "fix: serialize store under observation lock"
          git push origin HEAD:main
