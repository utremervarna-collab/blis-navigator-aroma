name: Navigator Full Diagnostic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Go application
        run: |
          set -euxo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .

      - name: Validate canonical production architecture
        run: |
          set -euxo pipefail
          files=(
            static/dashboard.html
            static/navigator-production-entry-v1.js
            static/navigator-reference.js
            static/navigator-client-ui.js
            static/navigator-client-branding-v3.js
            static/navigator-data-loader-v1.js
            static/navigator-intelligence-stream-v2.js
            static/navigator-intelligence-analysis-v3.js
            static/navigator-risk-priority-sync-v1.js
            static/navigator-mollox-signals-truth-v1.js
            static/navigator-overview-route-guard.js
            static/navigator-system-structure-v1.js
            static/navigator-digital-master.js
            static/navigator-visual-suite-v1.js
            static/navigator-visual-special-v2.js
            static/navigator-readable-type-v1.js
          )
          for f in "${files[@]}"; do test -s "$f"; done

          for f in "${files[@]:1}"; do node --check "$f"; done

          # Semantic owner contracts. These are intentionally version-family
          # checks rather than obsolete cache-busting query-string assertions.
          grep -q '__BLIS_PRODUCTION_ENTRY_V41' static/navigator-production-entry-v1.js
          grep -q 'navigator-readable-type-v1.js' static/navigator-production-entry-v1.js
          grep -q '__BLIS_REFERENCE_V18' static/navigator-reference.js
          grep -q '__blisCanonicalClientRouter' static/navigator-reference.js
          grep -q '__BLIS_CLIENT_BRANDING_V5' static/navigator-client-branding-v3.js
          grep -q 'blis-universal-client-header' static/navigator-client-branding-v3.js
          grep -q 'navigator-data-loader-v1.js' static/navigator-production-entry-v1.js
          grep -q 'navigator-intelligence-stream-v2.js' static/navigator-production-entry-v1.js
          grep -q 'navigator-client-branding-v3.js' static/navigator-production-entry-v1.js
          grep -q 'navigator-reference.js' static/navigator-production-entry-v1.js
          grep -q 'navigator-risk-priority-sync-v1.js' static/navigator-production-entry-v1.js
          ! grep -q "safe('/app.js')" static/navigator-production-entry-v1.js

      - name: Start application and validate data APIs
        run: |
          set -euxo pipefail
          BLIS_AUTH_PROXY_DISABLED=1 PORT=10000 ./app > /tmp/blis-diagnostic.log 2>&1 &
          echo $! > /tmp/blis.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10000/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/api/health | tee /tmp/health.json
          curl -fsS http://127.0.0.1:10000/api/clients | tee /tmp/clients.json

          for c in aroma bolyarka astor-garden mollox; do
            curl -fsS "http://127.0.0.1:10000/api/clients/$c/dashboard" >/tmp/$c-dashboard.json
            curl -fsS "http://127.0.0.1:10000/api/clients/$c/sources" >/tmp/$c-sources.json
            curl -fsS "http://127.0.0.1:10000/api/clients/$c/data-quality" >/tmp/$c-quality.json
            curl -fsS "http://127.0.0.1:10000/api/clients/$c/activity" >/tmp/$c-activity.json
            curl -fsS "http://127.0.0.1:10000/api/clients/$c/history" >/tmp/$c-history.json
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/$c-dashboard.json'));if(!Number.isFinite(Number(d.blis_index)))process.exit(1);if(!Array.isArray(d.indices)||!d.indices.length)process.exit(1)"
            node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('/tmp/$c-sources.json'));if(!Array.isArray(s)||!s.length)process.exit(1)"
            node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/$c-history.json'));if(!Array.isArray(h)||!h.length)process.exit(1)"
          done

          node - <<'NODE'
          const fs=require('fs');
          const dashboard=JSON.parse(fs.readFileSync('/tmp/mollox-dashboard.json'));
          const sources=JSON.parse(fs.readFileSync('/tmp/mollox-sources.json'));
          const expected=['MOLLOX България','Хигиенно-медицинска индустрия','Hagleitner България','Булклийн','PaChico','Албис','Калватис Хигиене България (CALGONIT)'];
          const actual=dashboard.competitors.map(x=>x.name);
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`Unexpected MOLLOX competitors: ${actual.join(', ')}`);
          const sourceKeys=sources.filter(x=>x.key.startsWith('cmp_')).map(x=>x.key).sort();
          const expectedKeys=['cmp_albis','cmp_bulclean','cmp_calvatis','cmp_hagleitner','cmp_hmi','cmp_pachico'];
          if(JSON.stringify(sourceKeys)!==JSON.stringify(expectedKeys)) throw new Error(`Unexpected MOLLOX competitor sources: ${sourceKeys.join(', ')}`);
          for(const legacy of ['Katrin Max / BePure','Hygimarket','Euroshine']){
            if(JSON.stringify({dashboard,sources}).includes(legacy)) throw new Error(`Legacy MOLLOX competitor remains: ${legacy}`);
          }
          NODE

          # Varna Towers is an isolated canonical runtime. Validate the runtime
          # contract semantically; cache-busting versions are not architecture.
          curl -fsS 'http://127.0.0.1:10000/dashboard.html?client=varna-towers&page=overview' >/tmp/varna-towers.html
          grep -q 'varna-towers-runtime.js' /tmp/varna-towers.html
          grep -q 'navigator-runtime-core-v1.js' /tmp/varna-towers.html
          ! grep -q 'src="/app.js' /tmp/varna-towers.html

      - name: Show diagnostic log on failure
        if: failure()
        run: cat /tmp/blis-diagnostic.log || true
