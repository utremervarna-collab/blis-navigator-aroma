services:
  - type: web
    name: blis-navigator-aroma
    runtime: go
    plan: free
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app .
    startCommand: ./app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: BLIS_DEPLOY_REV
        value: "20260819-1246-home-live-tape-v16"
