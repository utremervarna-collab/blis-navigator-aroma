name: Install Social Interactive Cache
on:
  push:
    paths:
      - '.github/workflows/cachebust-social-interactive.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh interaction script cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('static/dashboard.html')
          s=p.read_text()
          s=s.replace('/navigator-chart-points.js?v=20260819-points1','/navigator-chart-points.js?v=20260819-points2')
          p.write_text(s)
          PY
      - name: Commit cache refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/dashboard.html
          if ! git diff --cached --quiet; then
            git commit -m 'Load interactive Social Signals chart controller'
            git push origin HEAD:main
          fi
