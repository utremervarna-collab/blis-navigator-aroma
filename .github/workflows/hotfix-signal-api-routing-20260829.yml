name: Hotfix Signal API Routing 20260829

on:
  push:
    branches:
      - hotfix/signal-api-routing-20260829
    paths:
      - .github/workflows/hotfix-signal-api-routing-20260829.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route signal APIs through production handler
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('main.go')
          s=p.read_text()
          if 'case "api/signals/refresh":' in s:
              print('Signal API routing already present')
          else:
              anchor='\tpath := strings.Trim(r.URL.Path, "/")\n'
              block='''\t// BLIS Signal Collector endpoints are routed here because production uses\n\t// handler directly rather than http.DefaultServeMux.\n\tswitch path {\n\tcase "api/signals":\n\t\tsignalListHandler(w, r)\n\t\treturn\n\tcase "api/signals/refresh":\n\t\tsignalRefreshHandler(w, r)\n\t\treturn\n\tcase "api/signals/health":\n\t\tsignalHealthHandler(w, r)\n\t\treturn\n\t}\n'''
              if anchor not in s:
                  raise SystemExit('handler path anchor not found')
              s=s.replace(anchor, anchor+block, 1)
              p.write_text(s)
          PY
          gofmt -w main.go
          go test ./...
      - name: Commit hotfix
        run: |
          git config user.name "BLIS Navigator Bot"
          git config user.email "actions@users.noreply.github.com"
          git add main.go
          git commit -m "Route signal collector APIs through production handler"
          git push origin HEAD:hotfix/signal-api-routing-20260829
