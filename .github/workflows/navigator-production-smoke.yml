name: Navigator Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and start Navigator through production gateway
        run: |
          set -euxo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app > /tmp/blis-smoke-server.log 2>&1 &
          echo $! > /tmp/blis-smoke.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10000/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/api/health

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Browser smoke test
        run: |
          cat > /tmp/navigator-smoke.cjs <<'NODE'
          const { chromium } = require(process.env.GITHUB_WORKSPACE + '/node_modules/playwright');
          const fs=require('fs');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const origin='http://127.0.0.1:10000';
          const clients=['aroma','bolyarka','mollox','varna-towers','everbet','astor-garden'];
          const analytical=['overview','social','market','competition','history'];
          const resources=['hub','calendar'];
          const pages=[...analytical,...resources];
          const labels=['Общ изглед','Мониторинг','Среда','Конкуренти','Развитие/Доклади','Intelligence HUB','Календар'];
          const expectedNames={aroma:'Aroma',bolyarka:'Болярка',mollox:'MOLLOX','varna-towers':'Varna Towers',everbet:'Everbet','astor-garden':'Astor Garden'};
          const visualSelector={
            overview:'#overview .ovh-gauge',
            social:'#social .dv-radar-wrap',
            market:'#market .pm-stage,#market .pm-canvas',
            competition:'#competition .vs-comp-axis',
            history:'#history .vs-history-board',
            hub:'#hub .n3-resource-card',
            calendar:'#calendar .n3-resource-card'
          };
          let phase='startup';
          const watchdog=setTimeout(()=>{const msg=`watchdog timeout at ${phase}`;try{fs.writeFileSync('/tmp/navigator-smoke-error.txt',msg)}catch(_){};console.error(msg);process.exit(2)},120000);
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const client of clients){
                phase=`${client}:open`;
                const p=await browser.newPage({viewport:{width:1440,height:1000}});
                const errs=[];
                p.on('pageerror',e=>errs.push('PAGEERROR '+e.message));
                p.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource|ERR_NAME_NOT_RESOLVED|net::ERR_/i.test(m.text()))errs.push('CONSOLE '+m.text())});
                p.on('response',r=>{try{const u=new URL(r.url());if(u.origin===origin&&r.status()>=400&&u.pathname!=='/favicon.ico')errs.push(`HTTP ${r.status()} ${u.pathname}`)}catch(_){}});
                await p.goto(`${origin}/dashboard.html?client=${client}&page=overview`,{waitUntil:'domcontentloaded',timeout:20000});
                phase=`${client}:navigator3`;
                await p.waitForFunction(()=>window.__BLIS_NAVIGATOR_3_ARCHITECTURE_V1&&window.__BLIS_NAVIGATOR_3_CLIENT_CLARITY_V1&&window.__BLIS_NAVIGATOR_3_CLIENT_PROOF_V1,null,{timeout:20000});
                await p.waitForFunction(()=>document.querySelectorAll('#nav [data-n3-page]').length===7,null,{timeout:12000});
                await p.waitForFunction(()=>document.querySelector('.page.active')?.innerText.trim().length>20,null,{timeout:15000});
                await p.waitForFunction(()=>document.body.dataset.blisLoading!=='true',null,{timeout:12000});

                phase=`${client}:architecture`;
                const boot=await p.evaluate(()=>({
                  client:document.body.dataset.client||'',
                  name:document.querySelector('.bch3-name')?.textContent||document.querySelector('.client-brand-name')?.textContent||'',
                  nav:[...document.querySelectorAll('#nav [data-n3-page]')].map(x=>x.dataset.n3Page),
                  labels:[...document.querySelectorAll('#nav [data-n3-page] .navtxt')].map(x=>x.textContent.trim()),
                  lang:document.documentElement.lang,
                  language:window.BLIS_LANGUAGE,
                  arch:!!window.__BLIS_NAVIGATOR_3_ARCHITECTURE_V1,
                  clarity:!!window.__BLIS_NAVIGATOR_3_CLIENT_CLARITY_V1,
                  proof:!!window.__BLIS_NAVIGATOR_3_CLIENT_PROOF_V1,
                  legacy:[...document.querySelectorAll('#nav [data-page]')].length,
                  services:!!document.querySelector('[data-blis-commerce-open]')
                }));
                assert(boot.client===client,`${client}: body client ${boot.client}`);
                assert(boot.name.includes(expectedNames[client]),`${client}: wrong client identity ${JSON.stringify(boot)}`);
                assert(boot.nav.join(',')===pages.join(','),`${client}: wrong Navigator 3 nav ${boot.nav.join(',')}`);
                assert(boot.labels.join('|')===labels.join('|'),`${client}: wrong Navigator 3 labels ${boot.labels.join('|')}`);
                assert(boot.arch&&boot.clarity&&boot.proof,`${client}: Navigator 3 runtime incomplete`);
                assert(boot.lang==='bg'&&boot.language==='bg',`${client}: Bulgarian lock missing`);
                assert(boot.legacy===0,`${client}: legacy navigation leaked`);
                assert(!boot.services,`${client}: Services launcher leaked into client dashboard`);

                for(const id of pages){
                  phase=`${client}:${id}:render`;
                  await p.evaluate(id=>window.refGo(id),id);
                  await p.waitForFunction(id=>document.querySelector('.page.active')?.id===id,id,{timeout:9000});
                  await p.waitForTimeout(250);
                  const x=await p.evaluate(({id,sel})=>{
                    const root=document.getElementById(id),r=root?.getBoundingClientRect(),cs=root?getComputedStyle(root):null;
                    const visual=document.querySelector(sel),vr=visual?.getBoundingClientRect(),vs=visual?getComputedStyle(visual):null;
                    return {id:document.querySelector('.page.active')?.id,text:(root?.innerText||'').trim().length,height:r?.height||0,visible:!!root&&cs.display!=='none'&&cs.visibility!=='hidden'&&Number(cs.opacity||1)>.01,overflow:document.documentElement.scrollWidth-window.innerWidth,loading:/\bLoading\b|Зареждане\.{2,}/i.test(root?.innerText||''),visual:!!visual&&vs.display!=='none'&&vs.visibility!=='hidden'&&Number(vs.opacity||1)>.01,visualW:vr?.width||0,visualH:vr?.height||0};
                  },{id,sel:visualSelector[id]});
                  assert(x.id===id,`${client}/${id}: wrong active route ${x.id}`);
                  assert(x.visible&&x.height>70&&x.text>20,`${client}/${id}: blank/collapsed ${JSON.stringify(x)}`);
                  assert(!x.loading,`${client}/${id}: loading state remained`);
                  assert(x.overflow<=8,`${client}/${id}: horizontal overflow ${x.overflow}`);
                  assert(x.visual&&x.visualW>70&&x.visualH>30,`${client}/${id}: canonical visual missing ${JSON.stringify(x)}`);
                }

                const aliases={signals:'social',live:'social',digital:'social',opportunities:'social',risk:'social',reputation:'market','market-reputation':'market',reports:'history',timeline:'history',development:'history',intelligence:'hub',events:'calendar'};
                for(const [legacy,canonical] of Object.entries(aliases)){
                  phase=`${client}:alias:${legacy}`;
                  await p.evaluate(id=>window.refGo(id),legacy);
                  await p.waitForFunction(id=>document.querySelector('.page.active')?.id===id,canonical,{timeout:6000});
                }
                assert(errs.length===0,`${client}: runtime errors ${errs.join(' | ')}`);
                await p.close();
              }
              clearTimeout(watchdog);
              console.log('NAVIGATOR_PRODUCTION_SMOKE_OK');
            } finally {await browser.close();}
          })().catch(e=>{try{fs.writeFileSync('/tmp/navigator-smoke-error.txt',String(e.message||e))}catch(_){};console.error(e);process.exit(1)});
          NODE
          node /tmp/navigator-smoke.cjs

      - name: Show server log on failure
        if: failure()
        run: |
          cat /tmp/navigator-smoke-error.txt || true
          cat /tmp/blis-smoke-server.log || true

      - name: Publish smoke status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const state='${{ job.status }}'==='success'?'success':'failure';
            let detail='';
            try{detail=fs.readFileSync('/tmp/navigator-smoke-error.txt','utf8').replace(/[^a-zA-Z0-9_:\/.-]+/g,' ').trim().slice(0,70)}catch(_){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'navigator-production-smoke',description:state==='success'?'6 clients and Navigator 3 (5+2) passed':'Navigator production smoke failed'});
            if(state==='failure'&&detail){await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'failure',context:`navigator-smoke:${detail}`,description:'First browser smoke failure'});}
