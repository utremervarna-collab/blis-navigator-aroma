name: Apply live feed separation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-live-feed-separation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 .github/scripts/apply_live_feed_separation.py

      - name: Verify syntax and build
        run: |
          gofmt -w signal_collector.go
          node --check static/navigator-monitoring-canonical-v5.js
          node --check static/navigator-competition-news-v1.js
          go test ./...

      - name: Commit verified application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal_collector.go static/navigator-monitoring-canonical-v5.js static/navigator-competition-news-v1.js
          git diff --cached --check
          git commit -m "Separate live brand and competitor signal feeds"
          git push origin HEAD:main
