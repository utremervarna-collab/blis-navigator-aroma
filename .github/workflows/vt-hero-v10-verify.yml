name: Varna Towers Hero V10 Verify
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify hero bytes exactly
        run: |
          python3 - <<'PY'
          import base64, hashlib
          parts=[open(f'static/varna-towers-hero-v10-{n}.js').read().strip() for n in range(1,10)]
          lens=[len(x) for x in parts]
          raw=''.join(parts)
          data=base64.b64decode(raw, validate=True)
          sha=hashlib.sha256(data).hexdigest()
          print('LENGTHS',lens)
          print('RAW',len(raw),'BYTES',len(data),'SHA256',sha)
          assert lens == [4000]*8+[424], lens
          assert len(raw)==32424
          assert len(data)==24317
          assert sha=='494a1a0b6f774b91336d99ec3b7e50ffd5fa225a6979b67dd8632572ede2aedb'
          PY
