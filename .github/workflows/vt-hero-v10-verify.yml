name: Varna Towers Hero V10 Verify
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build diagnostics report
        run: |
          python3 - <<'PY' > vt-v10-report.txt
          import base64, hashlib
          parts=[open(f'static/varna-towers-hero-v10-{n}.js').read().strip() for n in range(1,10)]
          lens=[len(x) for x in parts]
          raw=''.join(parts)
          print('LENGTHS='+','.join(map(str,lens)))
          print('RAW='+str(len(raw)))
          try:
              data=base64.b64decode(raw, validate=True)
              print('BYTES='+str(len(data)))
              print('SHA256='+hashlib.sha256(data).hexdigest())
          except Exception as e:
              print('DECODE_ERROR='+repr(e))
          PY
          cat vt-v10-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vt-v10-report
          path: vt-v10-report.txt
