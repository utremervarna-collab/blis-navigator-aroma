name: Varna Towers Header Resized
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify resized production header
        run: |
          cat > check.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            let last='';
            for(let attempt=1;attempt<=10;attempt++){
              const page=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
              try{
                await page.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=varna-towers',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2200);
                const state=await page.evaluate(async()=>{
                  const el=document.querySelector('.topbar .client-photo-bg');
                  const cs=el?getComputedStyle(el):null;
                  const r=el?el.getBoundingClientRect():null;
                  const resp=await fetch('/varna-towers-profile-hero-header.webp?v=20260818-vt-header4',{cache:'no-store'});
                  const buf=await resp.arrayBuffer();
                  return {exists:!!el,bg:cs?.backgroundImage||'',size:cs?.backgroundSize||'',width:r?.width||0,height:r?.height||0,ok:resp.ok,status:resp.status,type:resp.headers.get('content-type'),bytes:buf.byteLength,client:document.body.dataset.client};
                });
                console.log('STATE',JSON.stringify(state));
                const ok=state.exists&&state.client==='varna-towers'&&state.bg.includes('varna-towers-profile-hero-header.webp')&&state.size==='100% 100%'&&state.width>1100&&state.height>150&&state.ok&&state.bytes>8000;
                if(!ok) throw new Error('Resized header not deployed yet');
                await page.screenshot({path:'varna-towers-header-resized.png',fullPage:false});
                await page.close();await browser.close();return;
              }catch(e){last=e.message;console.log('RETRY',attempt,last);await page.close();if(attempt<10)await new Promise(r=>setTimeout(r,5000));}
            }
            await browser.close();throw new Error(last||'verification failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: varna-towers-header-resized
          path: varna-towers-header-resized.png
