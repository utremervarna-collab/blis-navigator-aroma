name: Varna Towers Hero V8
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify production hero v8
        run: |
          cat > check.cjs <<'NODE'
          const { chromium }=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            let last='';
            for(let i=1;i<=24;i++){
              const page=await browser.newPage({viewport:{width:1680,height:720},deviceScaleFactor:1});
              try{
                await page.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=varna-towers',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2800);
                const state=await page.evaluate(async()=>{
                  const el=document.querySelector('.topbar .client-photo-bg');
                  const html=document.documentElement.innerHTML;
                  const cs=el?getComputedStyle(el):null,r=el?el.getBoundingClientRect():null;
                  async function probe(u){try{const q=await fetch(u,{cache:'no-store'});const t=await q.text();return {ok:q.ok,status:q.status,len:t.length,type:q.headers.get('content-type')}}catch(e){return {ok:false,error:e.message}}}
                  return {client:document.body.dataset.client,hasVt8:html.includes('20260818-vt8'),bg:cs?.backgroundImage?.slice(0,120)||'',ready:el?.dataset.varnaTowersHero||'',w:r?.width||0,h:r?.height||0,asset:await probe('/varna-towers-profile-hero-header-v7.js?v=20260818-vt-header8'),guard:await probe('/varna-towers-hero-guard.js?v=20260818-vt8'),ui:await probe('/varna-towers-ui.js?v=20260818-vt8')};
                });
                console.log('ATTEMPT',i,JSON.stringify(state));
                await page.screenshot({path:'varna-towers-hero-v8.png',fullPage:false});
                const ok=state.client==='varna-towers'&&state.hasVt8&&state.asset.ok&&state.asset.len>30000&&state.guard.ok&&state.ui.ok&&state.bg.includes('data:image/jpeg;base64')&&state.ready==='ready'&&state.w>1200&&state.h>150;
                if(!ok)throw new Error('V8 hero not ready');
                await page.close();await browser.close();return;
              }catch(e){last=e.message;console.log('RETRY',i,last);await page.close();if(i<24)await new Promise(r=>setTimeout(r,10000));}
            }
            await browser.close();throw new Error(last||'verification failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: varna-towers-hero-v8
          path: varna-towers-hero-v8.png
