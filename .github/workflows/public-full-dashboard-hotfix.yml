name: Public Full Dashboard Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-full-dashboard-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Open Navigator and expose full client catalogue
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gateway = Path('000_auth_gateway_resilient.go')
          s = gateway.read_text(encoding='utf-8')
          marker = '// PUBLIC_FULL_DASHBOARD_V1'
          if marker not in s:
              anchor = '\t// Black Sea Center remains owner-only; migration must not mint an owner session from a public URL.\n'
              if anchor not in s:
                  raise SystemExit('gateway anchor not found')
              block = r'''
	// PUBLIC_FULL_DASHBOARD_V1
	// The Navigator dashboard and its read APIs are intentionally public.
	// KUB remains on its dedicated crisis route; admin-only pages are unchanged.
	if path == "/navigator" || path == "/navigator/" {
		clearPublicDemoCookie(w, r)
		clearBscScopeCookie(w, r)
		clearLegacyClientRememberCookie(w, r)
		http.Redirect(w, r, navigatorDashboardTarget(r), http.StatusFound)
		return
	}
	if (path == "/black-sea-center" || path == "/black-sea-center/" || path == "/black-sea-center-home.html") && (r.Method == http.MethodGet || r.Method == http.MethodHead) {
		clearPublicDemoCookie(w, r)
		clearBscScopeCookie(w, r)
		clearLegacyClientRememberCookie(w, r)
		http.Redirect(w, r, "/dashboard.html?client=black-sea-center&page=overview", http.StatusFound)
		return
	}
	if (path == "/wirello" || path == "/wirello/" || path == "/wirello-master-demo.html") && (r.Method == http.MethodGet || r.Method == http.MethodHead) {
		clearPublicDemoCookie(w, r)
		clearBscScopeCookie(w, r)
		http.Redirect(w, r, "/dashboard.html?client=wirello&page=overview", http.StatusFound)
		return
	}
	if (path == "/dashboard.html" || path == "/navigator-v2.html") && (r.Method == http.MethodGet || r.Method == http.MethodHead) {
		clearPublicDemoCookie(w, r)
		clearBscScopeCookie(w, r)
		r2 := r.Clone(r.Context())
		r2.URL.Path = "/dashboard.html"
		q := r2.URL.Query()
		if !validNavigatorClient(strings.TrimSpace(q.Get("client"))) {
			q.Set("client", "aroma")
		}
		if q.Get("page") == "" {
			q.Set("page", "overview")
		}
		r2.URL.RawQuery = q.Encode()
		r2.Header.Del("X-BLIS-Client-Scope")
		authProxy.ServeHTTP(w, r2)
		return
	}
	if (r.Method == http.MethodGet || r.Method == http.MethodHead) && (path == "/api/clients" || strings.HasPrefix(path, "/api/clients/")) {
		if authProxy == nil {
			http.Error(w, "Gateway unavailable", http.StatusServiceUnavailable)
			return
		}
		authProxy.ServeHTTP(w, r)
		return
	}

'''
              s = s.replace(anchor, block + anchor, 1)
              gateway.write_text(s, encoding='utf-8')

          ui = Path('static/navigator-client-ui.js')
          t = ui.read_text(encoding='utf-8')
          original = t
          t = t.replace('   Owner sessions see only the currently active standard client catalogue.\n   KUB remains a separate crisis-monitoring route outside the standard switcher.\n   Hidden profiles remain in the registry so they are not deleted from the system.\n   Client sessions stay locked to their own server-scoped profile.\n   Wirello remains available only through its dedicated public demo route. */', '   Public full-profile catalogue.\n   KUB remains a separate crisis-monitoring route and opens its dedicated profile. */')
          t = t.replace('visible:false', 'visible:true')
          t = t.replace("const ownerVisibleOrder=['aroma','bolyarka','mollox'];", "const ownerVisibleOrder=['aroma','bolyarka','mollox','wirello','astor-garden','varna-towers','everbet','black-sea-center','kub'];")
          old = """function visibleOrder(){
  if(ownerMode)return ownerVisibleOrder.slice();
  if(sessionClient&&valid(sessionClient))return [sessionClient];
  if(lockedBSC())return ['black-sea-center'];
  const active=current();
  return valid(active)?[active]:['aroma'];
}
function selectOrder(){const order=visibleOrder();const active=current();if(!ownerMode&&valid(active)&&active!=='wirello'&&!order.includes(active))order.unshift(active);return order}
function ensureSelect(){const sel=document.getElementById('clientSel');if(!sel)return;sel.innerHTML='';for(const k of selectOrder()){const o=document.createElement('option');o.value=k;o.textContent=label(k);sel.appendChild(o)}sel.disabled=lockedBSC()||(!ownerMode&&!!sessionClient)}
function ensureMenu(){const menu=document.querySelector('.client-switch-menu');if(!menu)return;const active=current();menu.innerHTML=visibleOrder().map(k=>`<button type=\"button\" class=\"client-option${k===active?' active':''}\" data-client-key=\"${k}\" role=\"option\" aria-selected=\"${k===active?'true':'false'}\"><span><b>${esc(label(k))}</b><small>${esc(type(k))}</small></span><span class=\"client-option-check\" aria-hidden=\"true\">${k===active?'✓':''}</span></button>`).join('');const btn=document.querySelector('.client-switch-button');if(lockedBSC()||(!ownerMode&&!!sessionClient)){menu.style.display='none';if(btn){btn.style.pointerEvents='none';btn.setAttribute('aria-expanded','false')}}else{menu.style.display='';if(btn)btn.style.pointerEvents=''}}
"""
          new = """function visibleOrder(){return ownerVisibleOrder.slice()}
function selectOrder(){return visibleOrder()}
function ensureSelect(){const sel=document.getElementById('clientSel');if(!sel)return;sel.innerHTML='';for(const k of selectOrder()){const o=document.createElement('option');o.value=k;o.textContent=label(k);sel.appendChild(o)}sel.disabled=false}
function ensureMenu(){const menu=document.querySelector('.client-switch-menu');if(!menu)return;const active=current();menu.innerHTML=visibleOrder().map(k=>`<button type=\"button\" class=\"client-option${k===active?' active':''}\" data-client-key=\"${k}\" role=\"option\" aria-selected=\"${k===active?'true':'false'}\"><span><b>${esc(label(k))}</b><small>${esc(type(k))}</small></span><span class=\"client-option-check\" aria-hidden=\"true\">${k===active?'✓':''}</span></button>`).join('');const btn=document.querySelector('.client-switch-button');menu.style.display='';if(btn)btn.style.pointerEvents=''}
"""
          if old in t:
              t = t.replace(old, new, 1)
          elif 'function visibleOrder(){return ownerVisibleOrder.slice()}' not in t:
              raise SystemExit('client catalogue function anchor not found')
          t = t.replace("function toggle(){if(lockedBSC()||(!ownerMode&&!!sessionClient))return;const w=document.querySelector('.client-switch'),b=document.querySelector('.client-switch-button');", "function toggle(){const w=document.querySelector('.client-switch'),b=document.querySelector('.client-switch-button');")
          t = t.replace("async function select(key){if(!valid(key)||key==='wirello'||(lockedBSC()&&key!=='black-sea-center')||(!ownerMode&&sessionClient&&key!==sessionClient))return;if(ownerMode&&!ownerVisibleOrder.includes(key))return;", "async function select(key){if(!valid(key))return;")
          owner_wirello = """    if(ownerMode&&current()==='wirello'){
      const u=new URL(location.href);u.pathname='/dashboard.html';u.search='';u.searchParams.set('client','aroma');u.searchParams.set('page','overview');location.replace(u.pathname+u.search);return;
    }
"""
          t = t.replace(owner_wirello, '')
          if t == original and 'function visibleOrder(){return ownerVisibleOrder.slice()}' not in t:
              raise SystemExit('navigator-client-ui.js was not patched')
          ui.write_text(t, encoding='utf-8')
          PY
      - name: Verify public full dashboard patch
        shell: bash
        run: |
          grep -q 'PUBLIC_FULL_DASHBOARD_V1' 000_auth_gateway_resilient.go
          grep -q "ownerVisibleOrder=\['aroma','bolyarka','mollox','wirello','astor-garden','varna-towers','everbet','black-sea-center','kub'\]" static/navigator-client-ui.js
          grep -q 'function visibleOrder(){return ownerVisibleOrder.slice()}' static/navigator-client-ui.js
          gofmt -w 000_auth_gateway_resilient.go
          git diff --check
      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Public full dashboard already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 000_auth_gateway_resilient.go static/navigator-client-ui.js
          git commit -m 'Open full Navigator dashboard and client catalogue'
          git push origin HEAD:main
