name: Navigator Page Contract QA

on:
  push:
    branches:
      - fix/navigator-dedup-hub-link-2026-09-01
      - feature/navigator-3-bg-client-clarity
      - feature/navigator-readable-small-type
      - main
    paths:
      - 'static/navigator-3-page-contract-v1.js'
      - 'static/navigator-3-visual-preservation-v1.js'
      - 'static/navigator-3-client-proof-v1.js'
      - 'static/navigator-production-entry-v1.js'
      - 'static/navigator-readable-type-v1.js'
      - 'static/home-hub-dropdown.js'
      - 'zzz_home_intelligence_hub_patch.go'
      - 'zzzz_home_hub_dropdown_loader.go'
      - 'zzzzzzzzzzzzzz_navigator_production_hotfix.go'
      - '.github/workflows/navigator-page-contract-qa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'static/navigator-3-page-contract-v1.js'
      - 'static/navigator-3-visual-preservation-v1.js'
      - 'static/navigator-3-client-proof-v1.js'
      - 'static/navigator-production-entry-v1.js'
      - 'static/navigator-readable-type-v1.js'
      - 'static/home-hub-dropdown.js'
      - 'zzz_home_intelligence_hub_patch.go'
      - 'zzzz_home_hub_dropdown_loader.go'
      - 'zzzzzzzzzzzzzz_navigator_production_hotfix.go'
      - '.github/workflows/navigator-page-contract-qa.yml'
  workflow_dispatch:

jobs:
  page-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and start Navigator
        run: |
          set -euo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app >/tmp/page-contract-server.log 2>&1 &
          echo $! >/tmp/page-contract-server.pid
          ready=0
          for i in $(seq 1 70); do
            if curl --max-time 3 -fsS http://127.0.0.1:10000/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/page-contract-server.log || true; exit 1; fi

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Verify single-title hierarchy and Intelligence Hub navigation
        run: |
          mkdir -p /tmp/page-contract-shots
          cat >/tmp/page-contract.cjs <<'NODE'
          const { chromium }=require(process.env.GITHUB_WORKSPACE+'/node_modules/playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const origin='http://127.0.0.1:10000';
          const clients=['aroma','bolyarka','mollox','varna-towers','astor-garden','wirello','everbet'];
          const pages={
            overview:'Общ изглед',
            social:'Мониторинг',
            market:'Среда',
            competition:'Конкуренти',
            history:'Развитие/Доклади',
            hub:'Intelligence HUB',
            calendar:'Календар'
          };
          const core=['overview','social','market','competition','history'];
          const visual={
            overview:'#overview .ovh-gauge,#overview .vs-gauge-card,#overview .vs-gauge-svg',
            social:'#social .dv-radar-grid',
            market:'#market .pm-stage,#market .pm-canvas',
            competition:'#competition .vs-comp-axis',
            history:'#history .vs-history-board'
          };
          async function visible(page,selector){
            return page.locator(selector).evaluateAll(nodes=>nodes.some(n=>{const s=getComputedStyle(n),r=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0&&r.width>1&&r.height>1})).catch(()=>false);
          }
          async function duplicateHeadingCount(page,id,title){
            return page.locator(`#${id} h1,#${id} h2,#${id} h3`).evaluateAll((nodes,title)=>nodes.filter(n=>{const s=getComputedStyle(n),r=n.getBoundingClientRect();return n.textContent.trim()===title&&s.display!=='none'&&s.visibility!=='hidden'&&r.width>1&&r.height>1}).length,title);
          }
          async function unreadableText(page){
            return page.locator('.side,.shell,.modal,.nv3-drawer').evaluateAll(roots=>{
              const skip=/(?:^|[-_])(icon|glyph|mark|dot|orb|arrow|chevron|logo|brandname|navsym|stream|motion|visual|track|bar|close|zoom)(?:$|[-_])/i;
              const seen=new Set();
              const found=[];
              for(const root of roots){
                for(const el of [root,...root.querySelectorAll('*')]){
                  const isTextElement=el instanceof HTMLElement||(typeof SVGTextElement!=='undefined'&&el instanceof SVGTextElement);
                  if(seen.has(el)||!isTextElement){continue}seen.add(el);
                  if(el.closest('[hidden],[aria-hidden="true"],script,style,noscript'))continue;
                  if(!(typeof SVGTextElement!=='undefined'&&el instanceof SVGTextElement)&&el.closest('svg,canvas'))continue;
                  if(skip.test(el.getAttribute('class')||''))continue;
                  const own=[...el.childNodes].some(n=>n.nodeType===3&&String(n.nodeValue||'').trim().length>1);
                  if(!own||String(el.textContent||'').trim().length<2)continue;
                  const s=getComputedStyle(el),r=el.getBoundingClientRect(),size=Number.parseFloat(s.fontSize||'0');
                  if(r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&size>=5&&size<11){
                    found.push({tag:el.tagName.toLowerCase(),class:el.getAttribute('class')||'',size,text:String(el.textContent||'').trim().slice(0,70)});
                  }
                }
              }
              return found.slice(0,12);
            });
          }
          async function horizontalOverflow(page,id){
            return page.locator(`#${id} *`).evaluateAll(nodes=>nodes.filter(el=>{
              if(el.matches('.dv-radar-wrap,.dv-radar-grid'))return false;
              const s=getComputedStyle(el),r=el.getBoundingClientRect();
              if(s.overflowX==='hidden'&&s.textOverflow==='ellipsis')return false;
              return r.width>20&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&el.scrollWidth>el.clientWidth+2;
            }).slice(0,12).map(el=>({tag:el.tagName.toLowerCase(),class:el.getAttribute('class')||'',clientWidth:el.clientWidth,scrollWidth:el.scrollWidth,text:String(el.textContent||'').trim().slice(0,80)})));
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const client of clients){
                const p=await browser.newPage({viewport:{width:1440,height:1000}});
                const errors=[];
                p.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
                p.on('console',m=>{if(m.type()==='error'&&!/favicon|ERR_NAME_NOT_RESOLVED|Failed to load resource/i.test(m.text()))errors.push('CONSOLE '+m.text())});
                await p.goto(`${origin}/dashboard.html?client=${client}&page=overview`,{waitUntil:'domcontentloaded',timeout:30000});
                await p.waitForFunction(()=>window.__BLIS_NAVIGATOR_3_PAGE_CONTRACT_V1&&document.documentElement.dataset.navigatorPageContract==='single-shell-title',null,{timeout:20000});
                assert((await p.locator('#blisNavigatorBootScreen').count())===0,`${client}: obsolete startup screen is present`);
                await p.waitForFunction(()=>document.documentElement.dataset.navigatorTypography==='readable-small-type-v1',null,{timeout:10000});

                for(const [id,title] of Object.entries(pages)){
                  await p.evaluate(id=>window.refGo(id),id);
                  await p.waitForFunction(id=>document.querySelector('.page.active')?.id===id,id,{timeout:9000});
                  await p.waitForTimeout(850);
                  const shell=await p.locator('.bch3-context-title').innerText();
                  assert(shell.trim()===title,`${client}/${id}: shell title is ${shell}`);
                  assert(!(await visible(p,'.blis-system-bar')),`${client}/${id}: BLIS system bar is still visible`);
                  assert(!(await visible(p,`#${id} .n3-page-head`)),`${client}/${id}: duplicate Navigator page head is visible`);
                  const dup=await duplicateHeadingCount(p,id,title);
                  assert(dup===0,`${client}/${id}: duplicate body heading '${title}' is still visible (${dup})`);

                  if(core.includes(id)){
                    assert(await visible(p,visual[id]),`${client}/${id}: canonical visual missing`);
                  }
                  if(id==='social'){
                    assert(!(await visible(p,'#social .dv-title p')),`${client}/social: redundant radar subtitle visible`);
                    assert(!(await visible(p,'#social .dv-summary')),`${client}/social: redundant radar summary visible`);
                    const vt=await p.locator('#social .dv-title h2').innerText();
                    assert(vt.trim()==='Интелигентен радар',`${client}/social: radar title changed: ${vt}`);
                  }
                  if(id==='market')assert(!(await visible(p,'#market .pm-hero')),`${client}/market: duplicate market hero visible`);
                  if(['overview','competition','history'].includes(id))assert(!(await visible(p,`#${id} .vs-head`)),`${client}/${id}: old canonical route header visible`);
                  const unreadable=await unreadableText(p);
                  assert(unreadable.length===0,`${client}/${id}: visible text below 11px remains: ${JSON.stringify(unreadable)}`);
                  const overflow=await horizontalOverflow(p,id);
                  assert(overflow.length===0,`${client}/${id}: enlarged text causes horizontal overflow: ${JSON.stringify(overflow)}`);
                  const mainFrame=await p.locator('.main').evaluate(el=>{const r=el.getBoundingClientRect();return{left:r.left,right:r.right,viewport:window.innerWidth}});
                  assert(mainFrame.left>=0&&mainFrame.right<=mainFrame.viewport+1,`${client}/${id}: main layout exceeds viewport: ${JSON.stringify(mainFrame)}`);
                }

                if(['aroma','mollox'].includes(client)){
                  await p.evaluate(()=>window.refGo('social'));
                  await p.waitForTimeout(800);
                  await p.screenshot({path:`/tmp/page-contract-shots/${client}-signals.png`,fullPage:true});
                }
                assert(errors.length===0,`${client}: runtime errors: ${errors.join(' | ')}`);
                await p.close();
              }

              const home=await browser.newPage({viewport:{width:1440,height:1000}});
              await home.goto(origin+'/',{waitUntil:'domcontentloaded',timeout:30000});
              await home.waitForSelector('.hubNav .hubNavTrigger',{timeout:10000});
              await home.locator('.hubNav .hubNavTrigger').click();
              await home.waitForSelector('.hubNav.is-open .hubNavAll',{timeout:10000});
              const href=await home.locator('.hubNav .hubNavAll').getAttribute('href');
              assert(href==='/intelligence-hub.html',`Home Hub direct href is ${href}`);
              await home.locator('.hubNav .hubNavAll').click();
              await home.waitForURL(/\/intelligence-hub\.html(?:[?#].*)?$/,{timeout:10000});
              assert(/intelligence-hub\.html/.test(home.url()),`Home Hub click did not navigate: ${home.url()}`);
              await home.screenshot({path:'/tmp/page-contract-shots/home-hub.png',fullPage:false});
              await home.close();
              console.log('NAVIGATOR_PAGE_CONTRACT_AND_HUB_QA_OK');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/page-contract.cjs

      - name: Upload visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigator-page-contract-shots
          path: /tmp/page-contract-shots/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/page-contract-server.log || true
