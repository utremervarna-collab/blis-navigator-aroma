<script>
(function(){
  'use strict';
  const key='mollox';window.BLIS_INITIAL_CLIENT=key;window.BLIS_CLIENT_SCOPE=key;document.body.dataset.client=key;
  try{localStorage.setItem('blis-client-ui',key)}catch(_){ }
  const nativeFetch=window.fetch.bind(window);
  window.fetch=async function(input,init){
    let request=input;
    try{const raw=typeof input==='string'?input:(input&&input.url)||'';const u=new URL(raw,location.origin);if(/^\/api\/clients\/[^/]+\//.test(u.pathname)&&!u.pathname.startsWith('/api/clients/mollox/')){u.pathname=u.pathname.replace(/^\/api\/clients\/[^/]+\//,'/api/clients/mollox/');request=typeof input==='string'?(u.pathname+u.search):new Request(u.toString(),input)}}catch(_){ }
    const r=await nativeFetch(request,init);
    try{const raw=typeof request==='string'?request:(request&&request.url)||'';const u=new URL(raw,location.origin);if(u.pathname==='/api/clients'){const data=await r.clone().json();if(Array.isArray(data)){const selected=data.find(x=>x&&x.slug===key)||{slug:'mollox',name:'MOLLOX България',sector:'Професионална хигиена'};const h=new Headers(r.headers);h.delete('content-length');h.delete('content-encoding');h.set('content-type','application/json; charset=utf-8');return new Response(JSON.stringify([selected]),{status:r.status,statusText:r.statusText,headers:h})}}}catch(_){ }
    return r;
  };
})();
</script>
