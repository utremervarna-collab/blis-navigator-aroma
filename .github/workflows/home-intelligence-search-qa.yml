name: Home Visual Architecture QA

on:
  push:
    branches: [main]
    paths:
      - 'static/index.html'
      - 'static/navigator-decision-intelligence-v1.js'
      - 'static/navigator-decision-intelligence-v1.css'
      - 'static/migration-build.js'
      - '.github/workflows/home-intelligence-search-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-visual-architecture-qa
  cancel-in-progress: true

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  RELEASE_MARKER: home-visual-architecture-2026-09-27-v1

jobs:
  visual-home:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build current Navigator
        run: go build -tags netgo -ldflags '-s -w' -o app .

      - name: Validate visual public home
        run: |
          set -euo pipefail
          grep -Fq 'nvh-hero' static/index.html
          grep -Fq 'Карта на информационната среда' static/index.html
          grep -Fq 'Динамика във времето' static/index.html
          grep -Fq 'От източника' static/index.html
          grep -Fq 'Един клиентски профил' static/index.html
          grep -Fq 'Заяви демонстрация' static/index.html
          grep -Fq 'nvh-network' static/index.html
          grep -Fq 'nvh-chart' static/index.html
          grep -Fq 'nvh-orbit' static/index.html
          ! grep -Fq 'intelSearchForm' static/index.html
          ! grep -Fq 'BLIS™ Quick Search' static/index.html
          ! grep -Fq 'Executive Brief' static/index.html
          ! grep -Fq 'MONITOR' static/index.html
          ! grep -Fq 'UNDERSTAND' static/index.html
          ! grep -Fq 'DECIDE' static/index.html
          ! grep -Fq 'FMCG' static/index.html
          ! grep -Fq 'B2B' static/index.html
          grep -Fq 'diContextSearch' static/navigator-decision-intelligence-v1.js
          grep -Fq '/api/decision/ask' static/navigator-decision-intelligence-v1.js
          echo HOME_VISUAL_SOURCE_OK

      - name: Wait for and verify canonical production
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          ok=0
          for i in $(seq 1 48); do
            if curl -fsS --connect-timeout 12 --max-time 25 "$BASE/migration-build.js?ts=$(date +%s%N)" -o /tmp/build.js && grep -Fq "$RELEASE_MARKER" /tmp/build.js; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = "1"

          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 12 --max-time 30 "$BASE/?visualqa=$(date +%s%N)" -o /tmp/home.html
          grep -Fq 'nvh-hero' /tmp/home.html
          grep -Fq 'Карта на информационната среда' /tmp/home.html
          grep -Fq 'Заяви демонстрация' /tmp/home.html
          grep -Fq 'nvh-network' /tmp/home.html
          grep -Fq 'nvh-chart' /tmp/home.html
          grep -Fq 'nvh-orbit' /tmp/home.html
          ! grep -Fq 'intelSearchForm' /tmp/home.html
          ! grep -Fq 'BLIS™ Quick Search' /tmp/home.html

          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 12 --max-time 30 "$BASE/navigator-decision-intelligence-v1.js?ts=$(date +%s%N)" -o /tmp/decision.js
          grep -Fq 'diContextSearch' /tmp/decision.js
          grep -Fq '/api/decision/ask' /tmp/decision.js
          echo HOME_VISUAL_PRODUCTION_OK
