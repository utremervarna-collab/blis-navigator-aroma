name: Navigator Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  MIGRATION_BUILD: code-run-migration-2026-09-09-v1

jobs:
  local-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build and start Navigator gateway
        run: |
          set -euxo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app >/tmp/blis-smoke-server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:10000/api/health >/tmp/health.json && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/api/health
          grep -q '"ok":true' /tmp/health.json
          curl -fsS http://127.0.0.1:10000/migration-build.js -o /tmp/build.js
          grep -q "$MIGRATION_BUILD" /tmp/build.js

      - name: Verify canonical visible catalogue
        run: |
          set -euo pipefail
          grep -Fq "const ownerVisibleOrder=['kub','mollox','aroma','bolyarka','wirello'];" static/navigator-client-ui.js
          echo CANONICAL_VISIBLE_CATALOGUE_OK

      - name: Verify public read-only gateway contracts
        run: |
          set -euo pipefail
          test "$(curl -sS -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:10000/client-login)" = "200"
          test "$(curl -sS -o /tmp/aroma.html -w '%{http_code}' 'http://127.0.0.1:10000/dashboard.html?client=aroma&page=overview')" = "200"
          test "$(curl -sS -o /tmp/aroma.json -w '%{http_code}' 'http://127.0.0.1:10000/api/clients/aroma/dashboard')" = "200"
          code=$(curl -sS -D /tmp/kub.headers -o /tmp/kub.body -w '%{http_code}' 'http://127.0.0.1:10000/dashboard.html?client=kub&page=overview')
          test "$code" = "302"
          grep -Eqi '^location: /kub-crisis\.html' /tmp/kub.headers
          test "$(curl -sS -o /tmp/admin.body -w '%{http_code}' http://127.0.0.1:10000/admin.html)" = "404"
          test "$(curl -sS -o /tmp/refresh.body -w '%{http_code}' -X POST http://127.0.0.1:10000/api/clients/wirello/refresh)" = "409"
          curl -fsS http://127.0.0.1:10000/kub-home.html | grep -q 'Корпорация КУБ'
          curl -fsS http://127.0.0.1:10000/wirello | grep -Eqi 'Wirello'
          echo LOCAL_GATEWAY_SMOKE_OK

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/blis-smoke-server.log || true

  production-origin:
    needs: local-regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for migration build on canonical production
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          ok=0
          for i in $(seq 1 42); do
            if curl -fsS --connect-timeout 15 --max-time 30 "$BASE/migration-build.js?ts=$(date +%s)" -o /tmp/build.js && grep -q "$MIGRATION_BUILD" /tmp/build.js; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"

      - name: Verify live code.run contracts and persistence
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          curl -fsS "$BASE/api/health?ts=$(date +%s)" -o /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          curl -fsS "$BASE/api/store/export?ts=$(date +%s)" -o /tmp/store.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/store.json',encoding='utf-8'))
          clients=d.get('clients',{})
          for slug in ('aroma','bolyarka','mollox','astor-garden'):
              assert slug in clients, f'{slug} missing from production store'
          assert 'kub' in clients, 'kub persistence client missing'
          print('PRODUCTION_STORE_OK', {k:(len(v.get('snapshots',[])),len(v.get('observations',[]))) for k,v in clients.items()})
          PY
          test "$(curl -sS -o /tmp/aroma.html -w '%{http_code}' "$BASE/dashboard.html?client=aroma&page=overview&ts=$(date +%s)")" = "200"
          grep -Fq 'blisDashboardPrepaintV4' /tmp/aroma.html
          test "$(curl -sS -o /tmp/aroma.json -w '%{http_code}' "$BASE/api/clients/aroma/dashboard?ts=$(date +%s)")" = "200"
          code=$(curl -sS -D /tmp/kub.headers -o /tmp/kub.body -w '%{http_code}' "$BASE/dashboard.html?client=kub&page=overview&ts=$(date +%s)")
          test "$code" = "302"
          grep -Eqi '^location: /kub-crisis\.html' /tmp/kub.headers
          code=$(curl -sS -o /tmp/kub-signals.json -w '%{http_code}' "$BASE/api/signals?client=kub&limit=3&ts=$(date +%s)")
          test "$code" = "401" -o "$code" = "403"
          test "$(curl -sS -o /tmp/refresh.body -w '%{http_code}' -X POST "$BASE/api/clients/wirello/refresh")" = "409"
          curl -fsS "$BASE/wirello?ts=$(date +%s)" | grep -Eqi 'Wirello'
          echo NAVIGATOR_CODE_RUN_PRODUCTION_OK

      - name: Publish production migration status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state='${{ job.status }}'==='success'?'success':'failure';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'navigator-code-run-production',description:state==='success'?'code.run production migration passed':'code.run production migration failed'});
