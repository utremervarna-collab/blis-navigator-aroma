name: Navigator Full Diagnostic
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build and start
        run: |
          go build -tags netgo -ldflags '-s -w' -o app .
          PORT=10000 ./app >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:10000/api/health && break || sleep 1; done
      - name: Browser resource trace
        run: |
          npm install --no-save playwright-core@1.55.0
          cat > diag.cjs <<'NODE'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            for(const client of ['aroma','bolyarka','astor-garden']){
              const page=await browser.newPage();
              const issues=[];
              page.on('pageerror',e=>issues.push({kind:'pageerror',message:e.message,stack:e.stack||''}));
              page.on('response',r=>{if(r.status()>=400)issues.push({kind:'http',status:r.status(),url:r.url()})});
              page.on('requestfailed',r=>issues.push({kind:'requestfailed',url:r.url(),error:r.failure()?.errorText||''}));
              await page.goto(`http://127.0.0.1:10000/dashboard.html?client=${client}`,{waitUntil:'domcontentloaded',timeout:12000});
              await page.waitForTimeout(2000);
              if(client==='aroma'){
                for(const id of ['live','digital','overview']){
                  await page.locator(`#nav button[data-page="${id}"]`).click();
                  await page.waitForTimeout(1000);
                }
              }
              const state=await page.evaluate(()=>({
                title:document.title,
                active:document.querySelector('.page.active')?.id||null,
                selected:document.getElementById('clientSel')?.value||null,
                client:document.body.dataset.client||null,
                navButtons:document.querySelectorAll('#nav button').length
              }));
              console.log('CLIENT',client,JSON.stringify({state,issues},null,2));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" node diag.cjs
      - name: Server log
        if: always()
        run: cat /tmp/server.log || true
