name: Navigator Full Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build Go application
        run: |
          set -euxo pipefail
          go build -tags netgo -ldflags '-s -w' -o app .

      - name: Start application and test routes
        run: |
          set -euxo pipefail
          PORT=10000 ./app > /tmp/blis-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/api/health | tee /tmp/health.json
          curl -fsS 'http://127.0.0.1:10000/dashboard.html?client=aroma&page=social' >/tmp/dashboard.html
          grep -q 'navigator-social-master.js?v=20260819-socialmaster5' /tmp/dashboard.html
          for f in app.js navigator-reference.js navigator-social-master.js navigator-curves.js; do
            curl -fsS "http://127.0.0.1:10000/$f?v=diag" >/tmp/$f
            test -s /tmp/$f
          done
          node --check /tmp/navigator-social-master.js

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Browser social diagnostic
        run: |
          cat > .diag-social.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            await page.goto('http://127.0.0.1:10000/dashboard.html?client=aroma&page=social',{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForTimeout(3500);
            const result=await page.evaluate(()=>({
              active:document.querySelector('.page.active')?.id||null,
              socialChars:(document.getElementById('socialBody')?.innerHTML||'').length,
              channels:document.querySelectorAll('#socialBody .sm-channel').length,
              feeds:document.querySelectorAll('#socialBody .sm-network-feed').length,
              posts:document.querySelectorAll('#socialBody .sm-network-post').length,
              linkedinPosts:[...document.querySelectorAll('#socialBody .sm-network-feed')].filter(x=>(x.querySelector('b')?.textContent||'').includes('LinkedIn')).reduce((n,x)=>n+x.querySelectorAll('.sm-network-post').length,0),
              text:(document.getElementById('socialBody')?.innerText||'').slice(0,2500)
            }));
            console.log('SOCIAL_RESULT',JSON.stringify({result,errors},null,2));
            if(errors.length) throw new Error(errors.join('\n'));
            if(result.active!=='social') throw new Error('Social page not active');
            if(result.socialChars<500) throw new Error('Social renderer did not render');
            if(result.channels<1) throw new Error('No social channel cards');
            if(result.feeds<1) throw new Error('No social feed cards');
            if(result.linkedinPosts<1) throw new Error('No LinkedIn posts rendered');
            await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
            await page.waitForTimeout(500);
            const after=await page.evaluate(()=>({active:document.querySelector('.page.active')?.id||null,posts:document.querySelectorAll('#socialBody .sm-network-post').length}));
            console.log('AFTER_SCROLL',JSON.stringify(after));
            if(after.active!=='social'||after.posts<1) throw new Error('Social page breaks after scroll');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node .diag-social.cjs

      - name: Print server log
        if: always()
        run: cat /tmp/blis-server.log || true
