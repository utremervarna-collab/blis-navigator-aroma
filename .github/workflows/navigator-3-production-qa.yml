name: Navigator 3 Production QA

on:
  push:
    branches:
      - feature/navigator-3-bg-client-clarity
    paths:
      - '.github/workflows/navigator-3-production-qa.yml'
  workflow_dispatch:

jobs:
  real-production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Verify real Render production
        env:
          NAVIGATOR_ORIGIN: https://blis-navigator-aroma.onrender.com
          EXPECTED_PRODUCTION_SHA: cebca77385e3ee9e26f01c222dbbde339eee5659
        run: |
          mkdir -p /tmp/nav3-prod-shots
          cat >/tmp/nav3-production.cjs <<'NODE'
          const { chromium }=require(process.env.GITHUB_WORKSPACE+'/node_modules/playwright');
          const path=require('path');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const origin=process.env.NAVIGATOR_ORIGIN;
          const clients=['aroma','bolyarka','mollox','varna-towers','astor-garden','wirello','everbet'];
          const pages=['overview','social','market','competition','history','hub','calendar'];
          const labels=['Общ преглед','Сигнали и наблюдение','Пазар и репутация','Конкуренция','Развитие и доклади','Intelligence HUB','Календар'];
          const context={overview:'Общ преглед',social:'Сигнали и наблюдение',market:'Пазар и репутация',competition:'Конкуренция',history:'Развитие и доклади',hub:'Intelligence HUB',calendar:'Календар'};
          const reviewClients=new Set(['aroma','mollox']);
          async function visibleBox(p,selector,label){
            const box=await p.locator(selector).first().boundingBox().catch(()=>null);
            assert(box&&box.width>120&&box.height>60,`${label}: missing/collapsed ${selector} ${JSON.stringify(box)}`);
            return box;
          }
          async function waitForProduction(page){
            let last='';
            for(let i=0;i<20;i++){
              try{
                const r=await page.request.get(`${origin}/api/health`,{timeout:10000});
                last=`${r.status()} ${await r.text()}`;
                if(r.ok())return;
              }catch(e){last=e.message}
              await page.waitForTimeout(3000);
            }
            throw new Error('production health never became ready: '+last.slice(0,300));
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const probe=await browser.newPage();
              await waitForProduction(probe);
              await probe.close();
              for(const client of clients){
                const p=await browser.newPage({viewport:{width:1440,height:1000}});
                const errors=[];
                p.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
                p.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource|ERR_NAME_NOT_RESOLVED|net::ERR_/i.test(m.text()))errors.push('CONSOLE '+m.text())});
                await p.goto(`${origin}/dashboard.html?client=${client}&page=overview&prodqa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
                await p.waitForFunction(()=>window.__BLIS_NAVIGATOR_3_ARCHITECTURE_V1&&window.__BLIS_NAVIGATOR_3_CLIENT_CLARITY_V1&&window.__BLIS_NAVIGATOR_3_CLIENT_PROOF_V1,null,{timeout:20000});
                await p.waitForFunction(()=>document.querySelectorAll('#nav [data-n3-page]').length===7,null,{timeout:12000});
                const start=await p.evaluate(()=>({
                  client:document.body.dataset.client||'',
                  lang:document.documentElement.lang,
                  language:window.BLIS_LANGUAGE,
                  version:document.documentElement.dataset.navigatorVersion||'',
                  labels:[...document.querySelectorAll('#nav [data-n3-page] .navtxt')].map(x=>x.textContent.trim()),
                  legacy:document.querySelectorAll('#nav [data-page]').length,
                  switcher:!!document.querySelector('.bch3-lang'),
                  clientStatus:document.querySelector('.client-brand-status')?.textContent?.trim()||'',
                  clientButton:document.querySelector('.client-switch-button')?.textContent?.replace(/\s+/g,' ').trim()||''
                }));
                assert(start.client===client,`${client}: wrong client scope ${start.client}`);
                assert(start.lang==='bg'&&start.language==='bg',`${client}: Bulgarian lock missing`);
                assert(start.version==='3.0-preserved-visuals-5plus2',`${client}: wrong deployed version ${start.version}`);
                assert(start.labels.join('|')===labels.join('|'),`${client}: wrong production nav ${start.labels.join('|')}`);
                assert(start.legacy===0,`${client}: legacy navigation visible`);
                assert(!start.switcher,`${client}: language switcher visible`);
                assert(!start.clientStatus&&!/Активен клиентски профил/i.test(start.clientButton),`${client}: obsolete active-client label remains`);

                await p.locator('.client-switch-button').click();
                await p.waitForFunction(()=>document.querySelector('.client-switch')?.classList.contains('open'),null,{timeout:3000});
                const menu=await p.evaluate(()=>({count:document.querySelectorAll('.client-switch-menu .client-option').length,text:document.querySelector('.client-switch-menu')?.textContent?.replace(/\s+/g,' ').trim()||''}));
                assert(menu.count===6,`${client}: visible client menu expected 6 profiles, got ${menu.count}`);
                assert(!/Активен клиентски профил/i.test(menu.text),`${client}: obsolete active-client label leaked into menu`);
                if(reviewClients.has(client))await p.screenshot({path:path.join('/tmp/nav3-prod-shots',`${client}-switcher.png`),fullPage:true});
                await p.locator('.client-switch-button').click();

                for(const id of pages){
                  console.log('PRODUCTION_CHECK',client,id);
                  await p.evaluate(id=>window.refGo(id),id);
                  await p.waitForFunction(id=>document.querySelector('.page.active')?.id===id,id,{timeout:9000});
                  await p.waitForFunction(expected=>document.querySelector('.bch3-context-title')?.textContent?.trim()===expected,context[id],{timeout:6000});
                  assert(!await p.locator(`#${id}.page.active .nv3-story`).count(),`${client}/${id}: duplicate story panel visible`);
                  assert(!await p.locator(`#${id}.page.active [data-n3p-open]`).count(),`${client}/${id}: redundant evidence button visible`);
                  if(id==='overview'){
                    await p.waitForFunction(()=>!!document.querySelector('#overview .ovh-gauge svg')&&!document.querySelector('#overview .ovh-head,#overview .vs-head'),null,{timeout:10000});
                    await visibleBox(p,'#overview .ovh-gauge',`${client}/overview`);
                    const colors=await p.evaluate(()=>[...document.querySelectorAll('#overview .ovh-arc.risk,#overview .ovh-arc.watch,#overview .ovh-arc.stable,#overview .ovh-arc.good')].map(x=>getComputedStyle(x).stroke));
                    assert(colors.length===4&&new Set(colors).size===4,`${client}/overview: multicolor BLIS gauge lost ${JSON.stringify(colors)}`);
                  }
                  if(id==='social'){
                    await p.waitForFunction(()=>!!document.querySelector('#social #digital #digitalBody .dv-radar-wrap .dv-radar-grid')&&!!document.querySelector('#social .n3-live-strip'),null,{timeout:10000});
                    const box=await visibleBox(p,'#social .dv-radar-wrap',`${client}/social`);
                    assert(box.width>=320&&box.width<=620&&box.height>=320&&box.height<=620,`${client}/social: radar geometry broken ${JSON.stringify(box)}`);
                    const style=await p.evaluate(()=>{const grid=document.querySelector('#social #digital #digitalBody .dv-radar-grid'),stage=document.querySelector('#social #digital #digitalBody .dv-stage'),icon=document.querySelector('#social #digital #digitalBody .dv-radar-sector svg');const g=getComputedStyle(grid),s=getComputedStyle(stage),i=icon?getComputedStyle(icon):null;return{scope:!!document.querySelector('#social #digital.n3-canonical-digital-scope'),background:g.backgroundImage,stage:s.display,iconW:parseFloat(i?.width||'0'),iconH:parseFloat(i?.height||'0')}});
                    assert(style.scope&&style.background!=='none'&&style.stage==='grid',`${client}/social: canonical Radar CSS scope lost ${JSON.stringify(style)}`);
                    assert(style.iconW>0&&style.iconW<=24&&style.iconH>0&&style.iconH<=24,`${client}/social: Radar SVG sizing broken ${JSON.stringify(style)}`);
                  }
                  if(id==='market'){
                    await p.waitForFunction(()=>!!document.querySelector('#market .pm-stage,#market .pm-canvas')&&!!document.querySelector('#market [data-n3-market-summary]'),null,{timeout:10000});
                    await visibleBox(p,'#market .pm-stage,#market .pm-canvas',`${client}/market`);
                  }
                  if(id==='competition'){
                    await p.waitForFunction(()=>!!document.querySelector('#competition .vs-comp-axis')&&!!document.querySelector('#competition [data-n3-competition-changes]'),null,{timeout:10000});
                    await visibleBox(p,'#competition .vs-comp-axis',`${client}/competition`);
                  }
                  if(id==='history'){
                    await p.waitForFunction(()=>!!document.querySelector('#history .vs-history-board')&&!!document.querySelector('#history [data-n3-embedded-reports]'),null,{timeout:10000});
                    await visibleBox(p,'#history .vs-history-board',`${client}/history`);
                  }
                  if(id==='hub'||id==='calendar')await p.waitForFunction(id=>!!document.querySelector(`#${id} .n3-resource-card`),id,{timeout:7000});
                  const native=await p.locator('.page.active .n3-native,.page.active .n3-native-overview,.page.active .n3-native-social,.page.active .n3-native-market,.page.active .n3-native-competition').count();
                  assert(native===0,`${client}/${id}: n3-native replacement visual detected`);
                  const untranslated=await p.evaluate(()=>[...document.querySelectorAll('.page.active .vs-vhead em,.page.active .sv2-ch em,.page.active .pm-client-badge i,.page.active .n3-live-strip-head span,.blis-system-primary b')].some(x=>/\bLIVE\b/i.test(x.textContent.trim())));
                  assert(!untranslated,`${client}/${id}: untranslated LIVE remains visible`);
                  if(reviewClients.has(client)&&['overview','social','market','competition','history'].includes(id))await p.screenshot({path:path.join('/tmp/nav3-prod-shots',`${client}-${id}.png`),fullPage:true});
                }
                const aliases={digital:'social',opportunities:'social',live:'social',reputation:'market',reports:'history',timeline:'history'};
                for(const [oldId,newId] of Object.entries(aliases)){
                  await p.evaluate(id=>window.refGo(id),oldId);
                  await p.waitForFunction(id=>document.querySelector('.page.active')?.id===id,newId,{timeout:6000});
                }
                await p.evaluate(()=>window.refGo('overview'));
                await p.evaluate(()=>window.BLISNavigator3ClientProofV1?.open?.());
                await p.waitForFunction(()=>document.getElementById('n3pDrawer')?.classList.contains('open'),null,{timeout:5000});
                const proof=await p.locator('#n3pDrawer').innerText();
                assert(/Фактология и източници/i.test(proof)&&/Какво стои зад тази страница/i.test(proof),`${client}: evidence drawer incomplete`);
                await p.evaluate(()=>window.BLISNavigator3ClientProofV1?.close?.());
                await p.waitForFunction(()=>!document.getElementById('n3pDrawer')?.classList.contains('open'),null,{timeout:4000});
                assert(errors.length===0,`${client}: production runtime errors ${errors.join(' | ')}`);
                await p.close();
              }
              console.log('NAVIGATOR_3_REAL_PRODUCTION_QA_OK');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/nav3-production.cjs

      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigator3-production-review
          path: /tmp/nav3-prod-shots/*.png
          if-no-files-found: warn
          retention-days: 7
