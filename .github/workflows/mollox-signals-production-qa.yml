name: MOLLOX Signals Production Truth QA

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/mollox-signals-production-qa.yml'
      - '000_auth_gateway_resilient.go'
      - 'zzzzzzzz_intelligence_runtime_v3.go'
      - 'static/navigator-mollox-signals-truth-v1.js'
      - 'static/navigator-risk-priority-sync-v1.js'
      - 'static/navigator-overview-route-guard.js'
      - 'static/navigator-production-entry-v1.js'
      - 'static/navigator-3-architecture-v1.js'
      - 'static/navigator-digital-master.js'
      - 'zzzzzzzz_mollox_signal_truth_runtime.go'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN }}

jobs:
  mollox-signals:
    if: ${{ vars.NAVIGATOR_ORIGIN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify MOLLOX truth and canonical Navigator 3 monitoring in production
        run: |
          cat >/tmp/mollox-signals.cjs <<'NODE'
          const {chromium}=require(process.env.GITHUB_WORKSPACE+'/node_modules/playwright');
          const fs=require('fs');
          const origin=String(process.env.NAVIGATOR_ORIGIN||'').replace(/\/+$/,'');
          const baseline=['Пълна техническа документация','Private Label е публично потвърдена услуга','Регионална дистрибуция'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};

          async function waitForProduction(){
            for(let i=0;i<48;i++){
              try{
                const [truth,route,n3]=await Promise.all([
                  fetch(origin+'/navigator-mollox-signals-truth-v1.js?qa='+Date.now(),{headers:{'cache-control':'no-cache'}}).then(r=>r.ok?r.text():''),
                  fetch(origin+'/navigator-overview-route-guard.js?qa='+Date.now(),{headers:{'cache-control':'no-cache'}}).then(r=>r.ok?r.text():''),
                  fetch(origin+'/navigator-3-architecture-v1.js?qa='+Date.now(),{headers:{'cache-control':'no-cache'}}).then(r=>r.ok?r.text():'')
                ]);
                if(truth.includes('truth guard v4')&&route.includes('without hijacking other routes')&&n3.includes('BLISNavigator3ArchitectureV1'))return true;
              }catch(_){}
              await sleep(5000);
            }
            throw new Error('production origin did not reach the current MOLLOX Navigator 3 runtime');
          }

          async function state(page){
            return page.evaluate(async(baseline)=>{
              let api={status:0,rows:[]};
              try{
                const r=await fetch('/api/signals?client=mollox&limit=300',{cache:'no-store'});
                api.status=r.status;
                if(r.ok){const j=await r.json();api.rows=Array.isArray(j?.signals)?j.signals:[];}
              }catch(_){}

              const periods={};
              for(const days of [30,60,90]){
                try{window.BLISPeriod?.set?.(days)}catch(_){}
                await new Promise(r=>setTimeout(r,220));
                let current=[];
                try{current=window.BLISIntelligenceStreamV3?.getSignals?.()||[]}catch(_){}
                periods[days]=current.map(s=>({
                  id:s.id||'',client:s.client||'',title:s.title||s.text||'',scope:s.scope||'',
                  type:s.source_type||'',published_at:s.published_at||'',detected_at:s.detected_at||''
                }));
              }

              const root=document.getElementById('social');
              const radar=document.querySelector('#social .dv-radar-wrap');
              const rr=radar?.getBoundingClientRect();
              const rs=radar?getComputedStyle(radar):null;
              const text=(root?.innerText||'');
              const contamination=[...api.rows,...(periods[90]||[])].filter(s=>String(s.client||'').trim()&&String(s.client||'').toLowerCase()!=='mollox');
              return {
                href:location.href,
                active:document.querySelector('.page.active')?.id||'',
                client:String(document.body?.dataset?.client||window.D?.client||'').toLowerCase(),
                arch:Boolean(window.__BLIS_NAVIGATOR_3_ARCHITECTURE_V1),
                truthV4:Boolean(window.BLISMolloxSignalTruthV4),
                nav:[...document.querySelectorAll('#nav [data-n3-page]')].map(x=>x.dataset.n3Page),
                legacy:[...document.querySelectorAll('#nav [data-page]')].length,
                apiStatus:api.status,
                apiCount:api.rows.length,
                periods,
                contamination,
                badVisible:baseline.filter(x=>text.includes(x)),
                radar:Boolean(radar&&rs.display!=='none'&&rs.visibility!=='hidden'&&Number(rs.opacity||1)>.01),
                radarW:rr?.width||0,
                radarH:rr?.height||0
              };
            },baseline);
          }

          function validate(s,label){
            assert(s.client==='mollox',label+': wrong client '+s.client);
            assert(s.arch,label+': Navigator 3 architecture missing');
            assert(s.truthV4,label+': MOLLOX truth guard v4 missing');
            assert(s.active==='social',label+': canonical Monitoring route lost, active='+s.active);
            assert(new URL(s.href).searchParams.get('page')==='social',label+': URL is not canonical social '+s.href);
            assert(s.nav.join(',')==='overview,social,market,competition,history,hub,calendar',label+': wrong Navigator 3 nav '+s.nav.join(','));
            assert(s.legacy===0,label+': legacy navigation leaked');
            assert(s.radar&&s.radarW>70&&s.radarH>30,label+': canonical radar missing/collapsed '+JSON.stringify({radar:s.radar,w:s.radarW,h:s.radarH}));
            assert(s.badVisible.length===0,label+': baseline facts visible as current signals '+s.badVisible.join(' | '));
            assert(s.contamination.length===0,label+': cross-client signal contamination '+JSON.stringify(s.contamination));
            for(const days of [30,60,90]){
              const bad=(s.periods[days]||[]).filter(x=>baseline.includes(x.title)||(String(x.client||'').trim()&&String(x.client||'').toLowerCase()!=='mollox'));
              assert(bad.length===0,label+': '+days+'d stream contains invalid rows '+JSON.stringify(bad));
            }
          }

          (async()=>{
            assert(origin,'NAVIGATOR_ORIGIN is empty');
            await waitForProduction();
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:1440,height:1000}});
              const errors=[];
              page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
              page.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource|ERR_NAME_NOT_RESOLVED|net::ERR_/i.test(m.text()))errors.push('CONSOLE '+m.text())});

              await page.goto(origin+'/dashboard.html?client=mollox&page=social',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>window.__BLIS_NAVIGATOR_3_ARCHITECTURE_V1&&window.BLISMolloxSignalTruthV4,null,{timeout:20000});
              await page.waitForFunction(()=>document.querySelector('.page.active')?.id==='social',null,{timeout:12000});
              await page.waitForFunction(()=>{const e=document.querySelector('#social .dv-radar-wrap');const r=e?.getBoundingClientRect();return !!e&&r.width>70&&r.height>30},null,{timeout:15000});
              await page.waitForTimeout(800);
              validate(await state(page),'initial');

              await page.reload({waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>window.__BLIS_NAVIGATOR_3_ARCHITECTURE_V1&&window.BLISMolloxSignalTruthV4,null,{timeout:20000});
              await page.waitForFunction(()=>{const e=document.querySelector('#social .dv-radar-wrap');const r=e?.getBoundingClientRect();return document.querySelector('.page.active')?.id==='social'&&!!e&&r.width>70&&r.height>30},null,{timeout:15000});
              await page.waitForTimeout(800);
              validate(await state(page),'reload');

              for(const alias of ['signals','live','digital','opportunities','risk']){
                await page.evaluate(id=>window.refGo(id),alias);
                await page.waitForFunction(()=>document.querySelector('.page.active')?.id==='social',null,{timeout:9000});
                await page.waitForFunction(()=>{const e=document.querySelector('#social .dv-radar-wrap');const r=e?.getBoundingClientRect();return !!e&&r.width>70&&r.height>30},null,{timeout:9000});
              }
              validate(await state(page),'aliases');
              assert(errors.length===0,'runtime errors '+errors.join(' | '));
              console.log('MOLLOX_SIGNAL_TRUTH_NAVIGATOR3_OK');
            } finally {
              await browser.close();
            }
          })().catch(e=>{
            try{fs.writeFileSync('/tmp/mollox-signals-error.txt',String(e.message||e))}catch(_){}
            console.error(e);
            process.exit(1);
          });
          NODE
          node /tmp/mollox-signals.cjs
      - name: Publish MOLLOX truth status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const state='${{ job.status }}'==='success'?'success':'failure';
            let detail='';
            try{detail=fs.readFileSync('/tmp/mollox-signals-error.txt','utf8').replace(/[^a-zA-Z0-9_:\/.-]+/g,' ').trim().slice(0,70)}catch(_){}
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:'mollox-signal-truth-qa',description:state==='success'?'MOLLOX truth and Navigator 3 production passed':'MOLLOX signal truth QA failed'});
            if(state==='failure'&&detail){await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'failure',context:`mollox-truth:${detail}`,description:'First MOLLOX truth QA failure'});}
