name: Fix Signal API Empty Arrays
on:
  push:
    branches:
      - milestone/navigator-production-stable-20260825
    paths:
      - .github/workflows/fix-signal-api-empty-array.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Return JSON arrays for clients with no signals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('signal_collector.go')
          s=p.read_text()
          old='rows := append([]Signal(nil), signalState.Signals[client]...)'
          new='rows := append([]Signal{}, signalState.Signals[client]...)'
          if old not in s:
              raise SystemExit('signal list allocation not found')
          p.write_text(s.replace(old,new,1))
          PY
          gofmt -w signal_collector.go
          go test ./...
      - name: Commit API contract fix
        run: |
          git config user.name 'BLIS Navigator Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add signal_collector.go
          git commit -m 'Return empty Signal API arrays consistently'
          git push origin HEAD:milestone/navigator-production-stable-20260825
