name: KUB I18N Runtime Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delay legacy language runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kub_pages_direct.go')
          s=p.read_text()
          old='<script defer src="/kub-crisis-ru-v1.js?v=20260908-direct22"></script>'
          new='''<script>\n(function(){\n var q=new URLSearchParams(location.search),lang=(q.get('lang')||'').toLowerCase();\n if(!['en','ru'].includes(lang)){try{lang=(localStorage.getItem('blis.language.v1')||'').toLowerCase()}catch(_){}}\n if(!['en','ru'].includes(lang))return;\n function loadLegacyLanguage(){var s=document.createElement('script');s.src='/kub-crisis-ru-v1.js?v=20260908-direct23';s.async=true;document.body.appendChild(s)}\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(loadLegacyLanguage,120)},{once:true});else setTimeout(loadLegacyLanguage,120);\n})();\n</script>'''
          if old not in s:
              print('already repaired')
              raise SystemExit(0)
          s=s.replace(old,new).replace('v=20260908-direct22','v=20260908-direct23').replace('direct22','direct23')
          p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kub_pages_direct.go
          git commit -m 'Delay legacy KUB language runtime until DOM ready'
          git push origin HEAD:main
