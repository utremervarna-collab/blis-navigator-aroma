name: Varna Towers Hero V9
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Verify production hero v9
        run: |
          cat > check.cjs <<'NODE'
          const { chromium }=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            let last='';
            for(let i=1;i<=24;i++){
              const page=await browser.newPage({viewport:{width:1680,height:720},deviceScaleFactor:1});
              try{
                await page.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=varna-towers',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2600);
                const state=await page.evaluate(async()=>{
                  const el=document.querySelector('.topbar .client-photo-bg');
                  const cs=el?getComputedStyle(el):null,r=el?el.getBoundingClientRect():null;
                  async function text(u){const q=await fetch(u,{cache:'no-store'});const t=await q.text();return {ok:q.ok,status:q.status,text:t}}
                  const parts=[];
                  for(let n=1;n<=5;n++)parts.push(await text(`/varna-towers-hero-v9-${n}.js?v=20260818-vt9`));
                  const raw=parts.map(x=>x.text.trim()).join('');
                  const guard=await text('/varna-towers-hero-guard.js?v=20260818-vt8');
                  const ui=await text('/varna-towers-ui.js?v=20260818-vt8');
                  let image={ok:false,width:0,height:0,error:''};
                  if(raw.length){
                    try{
                      const im=new Image();
                      im.src='data:image/jpeg;base64,'+raw;
                      await im.decode();
                      image={ok:true,width:im.naturalWidth,height:im.naturalHeight,error:''};
                    }catch(e){image.error=e.message}
                  }
                  return {
                    client:document.body.dataset.client,
                    ready:el?.dataset.varnaTowersHero||'',
                    bg:cs?.backgroundImage?.slice(0,120)||'',
                    size:cs?.backgroundSize||'',pos:cs?.backgroundPosition||'',opacity:cs?.opacity||'',
                    w:r?.width||0,h:r?.height||0,
                    partOK:parts.map(x=>x.ok),partLens:parts.map(x=>x.text.trim().length),rawLen:raw.length,
                    guardV9:guard.ok&&guard.text.includes('ready-v9'),
                    uiClean:ui.ok&&!ui.text.includes('profile-hero-header-v7.js'),
                    image
                  };
                });
                console.log('ATTEMPT',i,JSON.stringify(state));
                const ok=state.client==='varna-towers'&&state.partOK.every(Boolean)&&JSON.stringify(state.partLens)==='[7000,7000,7000,7000,4424]'&&state.rawLen===32424&&state.guardV9&&state.uiClean&&state.ready==='ready-v9'&&state.bg.includes('data:image/jpeg;base64')&&state.opacity==='1'&&state.image.ok&&state.image.width===1228&&state.image.height===169&&state.w>1200&&state.h>150;
                if(!ok)throw new Error('V9 hero not ready');
                await page.locator('.topbar').screenshot({path:'varna-towers-hero-v9.png'});
                await page.close();await browser.close();return;
              }catch(e){last=e.message;console.log('RETRY',i,last);await page.close();if(i<24)await new Promise(r=>setTimeout(r,10000));}
            }
            await browser.close();throw new Error(last||'verification failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: varna-towers-hero-v9
          path: varna-towers-hero-v9.png
