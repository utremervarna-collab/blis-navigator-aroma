name: BLIS Daily Engine v2 Multi-client

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blis-daily.yml'
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN || 'https://p01--blis-navigator-aroma--2rnk9hqsd2bc.code.run' }}
  MIGRATION_BUILD: code-run-migration-2026-09-09-v1

jobs:
  refresh-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Verify active code.run production before refresh
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          test -n "$BASE"
          curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 90 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$BASE/migration-build.js?daily=1&ts=$(date +%s)" \
            -o /tmp/migration-build.js
          cat /tmp/migration-build.js
          grep -q "$MIGRATION_BUILD" /tmp/migration-build.js
          curl --fail --silent --show-error --max-time 90 "$BASE/api/store/export?daily=1&ts=$(date +%s)" -o /tmp/store-before.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/store-before.json',encoding='utf-8'))
          for slug in ('aroma','bolyarka','astor-garden','mollox'):
              assert slug in d.get('clients',{}), f'{slug} missing from production store before refresh'
          print('STORE_BEFORE', {k:(len(v.get('snapshots',[])),len(v.get('observations',[]))) for k,v in d.get('clients',{}).items()})
          PY

      - name: Refresh all persistent client profiles on active production
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          for CLIENT in aroma bolyarka astor-garden mollox; do
            echo "Refreshing $CLIENT"
            curl --fail --retry 5 --retry-delay 10 --retry-all-errors --max-time 240 \
              -X POST "$BASE/api/clients/$CLIENT/refresh" \
              -o "/tmp/blis-$CLIENT.json"
            python - <<PY
          import json
          p='/tmp/blis-$CLIENT.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('ok') is True, d
          e=d.get('engine',{})
          print('$CLIENT', 'successful=',e.get('successful'), 'failed=',e.get('failed'), 'version=',e.get('version'))
          PY
          done

      - name: Export and verify persistent BLIS store changed
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          mkdir -p data
          curl --fail --retry 5 --retry-delay 8 --retry-all-errors --max-time 120 \
            "$BASE/api/store/export?after-refresh=1&ts=$(date +%s)" \
            -o data/live_store.json
          python - <<'PY'
          import json
          before=json.load(open('/tmp/store-before.json',encoding='utf-8'))
          after=json.load(open('data/live_store.json',encoding='utf-8'))
          bc=before.get('clients',{}); ac=after.get('clients',{})
          changed=[]
          for slug in ('aroma','bolyarka','astor-garden','mollox'):
              assert slug in ac, f'{slug} missing from exported store'
              bsn=len(bc.get(slug,{}).get('snapshots',[])); asn=len(ac[slug].get('snapshots',[]))
              bob=len(bc.get(slug,{}).get('observations',[])); aob=len(ac[slug].get('observations',[]))
              assert asn >= bsn, f'{slug} snapshot count regressed {bsn}->{asn}'
              assert aob >= bob, f'{slug} observation count regressed {bob}->{aob}'
              if asn>bsn or aob>bob: changed.append(slug)
              print(slug, 'snapshots=',asn, 'observations=',aob)
          if changed:
              print('PERSISTENCE_WRITE_OK', ','.join(changed))
          else:
              print('NO_NEW_DATA: refresh completed successfully; persistent counts are unchanged')
          PY

      - name: Commit daily data snapshot
        run: |
          git config user.name "BLIS Engine"
          git config user.email "actions@users.noreply.github.com"
          git add data/live_store.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "BLIS daily multi-client data $(date -u +%F)"
            git push
          fi
