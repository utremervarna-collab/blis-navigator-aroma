name: Public Dashboard Apply

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_public_dashboard.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply public dashboard patch
        run: python3 scripts/apply_public_dashboard.py
      - name: Verify and commit
        shell: bash
        run: |
          grep -q 'PUBLIC_FULL_DASHBOARD_V1' 000_auth_gateway_resilient.go
          grep -q "ownerVisibleOrder=\['aroma','bolyarka','mollox','wirello','astor-garden','varna-towers','everbet','black-sea-center','kub'\]" static/navigator-client-ui.js
          gofmt -w 000_auth_gateway_resilient.go
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 000_auth_gateway_resilient.go static/navigator-client-ui.js
          if git diff --cached --quiet; then
            echo 'Already applied.'
            exit 0
          fi
          git commit -m 'Open full Navigator dashboard and all profiles'
          git push origin HEAD:main
