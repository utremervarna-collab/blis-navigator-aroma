name: Alert Center Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  inspect-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Inspect current signal and source payloads
        run: |
          cat > inspect.cjs <<'NODE'
          const { chromium }=require('playwright-core');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const p=await b.newPage();await p.goto('https://blis-navigator-aroma.onrender.com/dashboard.html?client=aroma',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(3500);const x=await p.evaluate(()=>({signals:(typeof D!=='undefined'&&D&&Array.isArray(D.signals))?D.signals:[],sources:(typeof S!=='undefined'&&Array.isArray(S))?S.slice(0,12):[]}));console.log('SIGNALS',JSON.stringify(x.signals));console.log('SOURCES',JSON.stringify(x.sources));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node inspect.cjs
