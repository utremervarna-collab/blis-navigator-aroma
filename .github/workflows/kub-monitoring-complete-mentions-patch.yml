name: KUB Monitoring Complete Mentions Patch

on:
  push:
    paths:
      - '.github/workflows/kub-monitoring-complete-mentions-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove KUB API display cap and broaden contextual identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) API: support limit=all and remove the artificial 500-row ceiling.
          p = Path('signal_collector.go')
          s = p.read_text()
          pattern = re.compile(
              r'\tlimit := 100\n'
              r'\tif raw := r\.URL\.Query\(\)\.Get\("limit"\); raw != "" \{\n'
              r'\t\tif n, err := strconv\.Atoi\(raw\); err == nil && n > 0 && n <= 500 \{\n'
              r'\t\t\tlimit = n\n'
              r'\t\t\}\n'
              r'\t\}'
          )
          replacement = '''\tlimit := 100
\tif raw := strings.TrimSpace(r.URL.Query().Get("limit")); raw != "" {
\t\tif strings.EqualFold(raw, "all") {
\t\t\tlimit = 0
\t\t} else if n, err := strconv.Atoi(raw); err == nil && n > 0 {
\t\t\tlimit = n
\t\t}
\t}'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'signal limit block patch count={n}')
          s2, n = re.subn(r'\t\tif len\(rows\) > limit \{', '\t\tif limit > 0 && len(rows) > limit {', s2, count=1)
          if n != 1:
              raise SystemExit(f'signal slice guard patch count={n}')
          p.write_text(s2)

          # 2) KUB identity: retain precise aliases, plus standalone KUB only when
          # crisis/company context is present. This avoids generic geometric "куб" noise.
          p = Path('kub_signal_extension.go')
          s = p.read_text()
          old = '''func kubRelevant(text string) bool {
\tlow := strings.ToLower(text)
\tfor _, term := range kubSignalAliases {
\t\tif strings.Contains(low, strings.ToLower(term)) {
\t\t\treturn true
\t\t}
\t}
\treturn false
}'''
          new = '''func kubRelevant(text string) bool {
\tlow := strings.ToLower(text)
\tfor _, term := range kubSignalAliases {
\t\tif strings.Contains(low, strings.ToLower(term)) {
\t\t\treturn true
\t\t}
\t}

\t// A publication may abbreviate the company to KUB/КУБ without repeating the
\t// full corporate name. Accept that abbreviation only in unambiguous KUB-crisis
\t// context so generic uses of the word "куб" never contaminate Monitoring.
\tnormalized := " " + strings.NewReplacer(
\t\t",", " ", ".", " ", ":", " ", ";", " ", "!", " ", "?", " ",
\t\t"(", " ", ")", " ", "[", " ", "]", " ", "{", " ", "}", " ",
\t\t"\\\"", " ", "'", " ", "„", " ", "“", " ", "”", " ", "—", " ", "-", " ",
\t).Replace(low) + " "
\thasKUB := strings.Contains(normalized, " куб ") || strings.Contains(normalized, " kub ")
\tif hasKUB && collectorContainsAny(low,
\t\t"варна", "баба алино", "forest club", "форест клуб", "невзоров", "несторов",
\t\t"корпорац", "данс", "народното събрание", "парламент", "община варна",
\t\t"forest club varna", "електроразпределение север",
\t) {
\t\treturn true
\t}
\treturn false
}'''
          if old not in s:
              raise SystemExit('kubRelevant source block not found')
          p.write_text(s.replace(old, new, 1))

          # 3) UI: Monitoring requests the entire KUB signal history instead of 500.
          p = Path('static/kub-live-feed-v3.js')
          s = p.read_text()
          old = '/api/signals?client=kub&limit=500&_='
          new = '/api/signals?client=kub&limit=all&_='
          if old not in s:
              raise SystemExit('KUB feed API request pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify patch invariants
        shell: bash
        run: |
          grep -F 'strings.EqualFold(raw, "all")' signal_collector.go
          grep -F 'limit > 0 && len(rows) > limit' signal_collector.go
          grep -F 'hasKUB && collectorContainsAny' kub_signal_extension.go
          grep -F 'client=kub&limit=all' static/kub-live-feed-v3.js
          ! grep -F 'client=kub&limit=500' static/kub-live-feed-v3.js
          gofmt -w signal_collector.go kub_signal_extension.go kub_monitoring_mention_coverage_v1.go
          go test ./...

      - name: Commit complete mention pipeline
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signal_collector.go kub_signal_extension.go static/kub-live-feed-v3.js kub_monitoring_mention_coverage_v1.go
          git commit -m 'Show every captured KUB mention in Monitoring'
          git push origin HEAD:main
