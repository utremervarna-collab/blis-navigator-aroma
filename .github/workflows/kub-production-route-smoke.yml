name: KUB Production Route Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NAVIGATOR_ORIGIN: ${{ vars.NAVIGATOR_ORIGIN }}

jobs:
  kub-route:
    if: ${{ vars.NAVIGATOR_ORIGIN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public KUB client route
        shell: bash
        run: |
          set -euo pipefail
          BASE="${NAVIGATOR_ORIGIN%/}"
          url="$BASE/kub-client?smoke=$(date +%s)"
          ok=0
          code=000
          for i in $(seq 1 18); do
            code=$(curl -L -sS --max-time 20 -o /tmp/kub.html -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ] && grep -q 'Корпорация КУБ' /tmp/kub.html && ! grep -qi 'MOLLOX' /tmp/kub.html; then
              ok=1
              break
            fi
            sleep 5
          done
          echo "ORIGIN=$BASE"
          echo "HTTP=$code"
          grep -o '<title>[^<]*</title>' /tmp/kub.html || true
          if [ "$ok" != "1" ]; then
            echo 'KUB_ROUTE_SMOKE_FAILED'
            head -c 2000 /tmp/kub.html || true
            exit 1
          fi
          echo 'KUB_ROUTE_SMOKE_OK'
